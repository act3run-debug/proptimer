         * масштабируется целиком, на любую глубину, поэтому её внутренние
         * доли не меняются, а цели внутри меняются в одно и то же число раз.
         */
        static scaleNode(node, targetFactor, weightFactor) {
          const fw = weightFactor === undefined ? targetFactor : weightFactor;
          if (!node) return;
          if (this.isFolder(node)) {
            (node.children || []).forEach(child =>
              this.scaleNode(child, targetFactor, fw)
            );
            return;
          }
          const timer = this.timerById(node.id);
          if (!timer) return;
          if (Number.isFinite(targetFactor)) {
            timer.targetProportion = (Number(timer.targetProportion) || 0) * targetFactor;
          }
          if (Number.isFinite(fw)) {
            timer.proportion = (Number(timer.proportion) || 0) * fw;
          }
        }
        /**
         * Может ли узел принять добавку к целям: таймер — всегда, папка —
         * только если на любой глубине в ней есть хотя бы один таймер.
         * Пустая папка ничего принять не может (делить нечем между детьми).
         */
        static canAbsorb(node) {
          if (!node) return false;
          if (this.isTimerNode(node)) return Boolean(this.timerById(node.id));
          return (node.children || []).some(child => this.canAbsorb(child));
        }
        /**
         * Нечего перераспределять пропорционально — делим поровну (ТЗ 3.8).
         * Часть, доставшаяся папке, делится поровну между её детьми и так
         * дальше на любую глубину (ТЗ 3.8.4). Пустые папки (и папки, в которых
         * нет ни одного таймера) в делёж не входят — принять добавку им
         * нечем. Возвращает false, если принять некому: тогда вызывающий
         * обязан найти получателя сам, иначе сумма приложения перестала бы
         * быть равной 1 (ТЗ 3.2.1).
         */
        static distributeEqually(nodes, amountTarget, amountWeight) {
          const list = (nodes || []).filter(node => this.canAbsorb(node));
          if (!list.length) return false;
          const aw = amountWeight === undefined ? amountTarget : amountWeight;
          const perT = (Number(amountTarget) || 0) / list.length;
          const perW = (Number(aw) || 0) / list.length;
          list.forEach(node => {
            if (this.isFolder(node)) {
              this.distributeEqually(node.children, perT, perW);
              return;
            }
            const timer = this.timerById(node.id);
            if (!timer) return;
            timer.targetProportion = (Number(timer.targetProportion) || 0) + perT;
            timer.proportion = (Number(timer.proportion) || 0) + perW;
          });
          return true;
        }
        /**
         * Вернуть уровню `amount` (цели) и `amountWeight` (веса), сохранив
         * сумму уровня (ТЗ 7.2.2/7.3.2). parentNode = null означает корень.
         * Если уровень не может принять добавку (пуст или состоит из одних
         * пустых папок) — поднимаемся выше: сумма родителя упала, и иначе
         * общая сумма приложения перестала бы быть равной 1 (ТЗ 3.2.1).
         */
        static giveToLevel(parentNode, amount, amountWeight, guard) {
          const step = guard || 0;
          if (step > 64) return;
          const amountT = Number(amount) || 0;
          const amountW =
            amountWeight === undefined ? amountT : Number(amountWeight) || 0;
          if (!(amountT > 0) && !(amountW > 0)) return;
          const children = parentNode ? parentNode.children || [] : this.root();
          const sumT = this.levelSumNodes(children);
          const sumW = this.levelWeightNodes(children);
          if (children.length && sumT > 0) {
            const fT = (sumT + amountT) / sumT;
            const fW = sumW > 0 ? (sumW + amountW) / sumW : 1;
            children.forEach(child => this.scaleNode(child, fT, fW));
            return;
          }
          if (this.distributeEqually(children, amountT, amountW)) return;
          if (!parentNode) return;
          // Уровень принять не может: производная цель папки parentNode
          // нулевая, поэтому освободившееся уходит на уровень выше — её
          // сиблингам (ТЗ 7.3); пустая папка parentNode в делёж не входит.
          const loc = this.findNode(parentNode.id);
          if (!loc) return;
          this.giveToLevel(loc.parent, amountT, amountW, step + 1);
        }

        // --- правка доли (локальная, ТЗ 3.6) ---------------------------
        static setShareLocal(id, share) {
          const loc = this.findNode(id);
          // Долю папки менять нельзя: папка не таймер (ТЗ 3.5.1)
          if (!loc || !this.isTimerNode(loc.node)) return false;
          const timer = this.timerById(id);
          if (!timer) return false;
          if (loc.siblings.length < 2) return false;
          const others = loc.siblings.filter(n => n !== loc.node);
          const sumT = this.levelSumNodes(loc.siblings);
          const sumW = this.levelWeightNodes(loc.siblings);
          const othersT = this.levelSumNodes(others);
          const othersW = this.levelWeightNodes(others);
          const p = this.clamp01(share);
          let newTarget = p * sumT;
          let newWeight = p * sumW;
          if (othersT > 0) {
            const fT = (sumT - newTarget) / othersT;
            const fW = othersW > 0 ? (sumW - newWeight) / othersW : 1;
            others.forEach(n => this.scaleNode(n, fT, fW));
          } else if (!this.distributeEqually(others, sumT - newTarget, sumW - newWeight)) {
            // ТЗ 3.8.2: у остальных нули — освободившееся поровну. Но если
            // принять некому (сиблинги — только пустые папки), правка
            // невозможна: таймер остаётся единственным держателем суммы
            // уровня, иначе она (и сумма приложения, ТЗ 3.2.1) уменьшилась бы.
            newTarget = sumT;
            newWeight = sumW;
          }
          timer.targetProportion = newTarget;
          timer.proportion = newWeight;
          this.changed();
          return true;
        }

        // --- правка цели (глобальная, ТЗ 3.7) --------------------------
        static setTargetGlobal(id, value) {
          const timer = this.timerById(id);
          if (!timer) return false;
          const all = AppState.getTimers();
          const others = all.filter(t => t !== timer);
          // Единственный таймер приложения держит всю сумму (ТЗ 3.2.1):
          // перераспределять не на кого, значит его цель остаётся равной 1.
          const v = others.length ? this.clamp01(value) : 1;
          const totalWeight = all.reduce((s, t) => s + (Number(t.proportion) || 0), 0);
          const othersTarget = others.reduce(
            (s, t) => s + (Number(t.targetProportion) || 0),
            0
          );
          const newWeight = v * totalWeight;
          const othersWeight = totalWeight - newWeight;
          timer.targetProportion = v;
          timer.proportion = newWeight;
          if (v >= 1) {
            // ТЗ 3.2.4: если у одной сущности 1, у всех остальных — 0
            others.forEach(t => {
              t.targetProportion = 0;
              t.proportion = 0;
            });
          } else if (othersTarget > 0) {
            // ТЗ 3.7.2: все остальные таймеры приложения — в одно и то же
            // число раз (веса тем же множителем, поэтому сумма весов, а
            // значит и планы, сохраняются).
            const fT = (1 - v) / othersTarget;
            const othersWeightSum = others.reduce(
              (s, t) => s + (Number(t.proportion) || 0),
              0
            );
            const fW = othersWeightSum > 0 ? othersWeight / othersWeightSum : 1;
            others.forEach(t => {
              t.targetProportion = (Number(t.targetProportion) || 0) * fT;
              t.proportion = (Number(t.proportion) || 0) * fW;
            });
          } else {
            // ТЗ 3.8.3: перераспределять нечего — поровну между остальными
            const n = others.length || 1;
            const perT = (1 - v) / n;
            const perW = othersWeight / n;
            others.forEach(t => {
              t.targetProportion = perT;
              t.proportion = perW;
            });
          }
          this.changed();
          return true;
        }

        // --- создание/вставка/удаление ---------------------------------
        static createFolder(name, parentNode, index) {
          const node = this.createFolderNode(
            name === undefined || name === null || String(name).trim() === ""
              ? this.DEFAULT_FOLDER_NAME
              : String(name).trim()
          );
          const list = parentNode ? parentNode.children || (parentNode.children = []) : this.root();
          const at =
            index === undefined || index === null
              ? list.length
              : Math.max(0, Math.min(index, list.length));
          list.splice(at, 0, node);
          this.changed();
          return node;
        }
        static insertTimerNode(timerId, parentNode, index) {
          const existing = this.findNode(timerId);
          if (existing) return existing.node;
          const node = this.createTimerNode(timerId);
          const list = parentNode ? parentNode.children || (parentNode.children = []) : this.root();
          const at =
            index === undefined || index === null
              ? list.length
              : Math.max(0, Math.min(index, list.length));
          list.splice(at, 0, node);
          this.changed();
          return node;
        }
        /**
         * Обернуть узлы (таймеры и/или папки) в новую папку на месте первого
         * из них. Используется операцией «Создать задачу внутри группы»
         * (ТЗ 5.3.2) и переносом «В группу», когда папок ещё нет (ТЗ 6.2).
         */
        static wrapNodesIntoFolder(nodeIds, name) {
          const ids = (nodeIds || []).map(Number).filter(Number.isFinite);
          const locs = [];
          ids.forEach(id => {
            const loc = this.findNode(id);
            if (loc && !locs.some(x => x.node === loc.node)) locs.push(loc);
          });
          if (!locs.length) return null;
          const first = locs[0];
          const hostList = first.siblings;
          const at = Math.min(first.index, hostList.length);
          const folder = this.createFolderNode(
            name && String(name).trim()
              ? String(name).trim()
              : this.DEFAULT_FOLDER_NAME
          );
          // Извлекаем узлы по id: после каждого splice сохранённые индексы
          // остальных «плывут», поэтому переспрашиваем позицию заново.
          locs.forEach(loc => {
            const cur = this.findNode(loc.node.id);
            if (cur) cur.siblings.splice(cur.index, 1);
            folder.children.push(loc.node);
          });
          hostList.splice(at, 0, folder);
          this.changed();
          return folder;
        }
        /** Таймер на своём месте заменяется папкой с подзадачами (ТЗ 5.2). */
        static replaceTimerWithFolder(timerId, folderName, childTimerIds) {
          const loc = this.findNode(timerId);
          const folder = this.createFolderNode(
            folderName === undefined || folderName === null || String(folderName).trim() === ""
              ? this.DEFAULT_FOLDER_NAME
              : String(folderName).trim()
          );
          (childTimerIds || []).forEach(id =>
            folder.children.push(this.createTimerNode(id))
          );
          if (!loc) {
            this.root().push(folder);
            this.changed();
            return folder;
          }
          loc.siblings.splice(loc.index, 1, folder);
          this.changed();
          return folder;
        }
        /**
         * Удаление узла с перерасчётом (ТЗ 7): освободившаяся часть
         * распределяется между сиблингами того же уровня, сумма уровня
         * сохраняется; за пределами уровня ничего не меняется.
         * Возвращает { node, timerIds, freedTarget, freedWeight }.
         */
        static deleteNodeWithRedistribution(id) {
          const loc = this.findNode(id);
          if (!loc) return null;
          const freedTarget = this.nodeTarget(loc.node);
          const freedWeight = this.nodeWeight(loc.node);
          const timerIds = this.descendantTimerIds(loc.node);
          loc.siblings.splice(loc.index, 1);
          this.giveToLevel(loc.parent, freedTarget, freedWeight);
          this.changed();
          return {
            node: loc.node,
            timerIds,
            freedTarget,
            freedWeight,
            parent: loc.parent,
          };
        }

        // --- перенос и перемещение (ТЗ 6, 9) ---------------------------
        static canMoveInto(nodeId, folderId) {
          if (folderId === null || folderId === undefined) return true;
          if (this.sameId(nodeId, folderId)) return false;
          const loc = this.findNode(nodeId);
          if (!loc) return false;
          // Нельзя перенести папку внутрь самой себя или своего потомка
          const folders = [];
          const collect = node => {
            if (this.isFolder(node)) {
              folders.push(Number(node.id));
              (node.children || []).forEach(collect);
            }
          };
          collect(loc.node);
          if (folders.some(f => this.sameId(f, folderId))) return false;
          const target = this.findNode(folderId);
          return Boolean(target) && this.isFolder(target.node);
        }
        /**
         * Перенос узла в папку (folderId = null -> в корень). Целевая
         * пропорция переносимой сущности НЕ меняется (ТЗ 6.4): сумма одного
         * уровня уменьшается, другого — увеличивается на ту же величину.
         */
        static moveToFolder(nodeId, folderId, index) {
          const target =
            folderId === null || folderId === undefined
              ? this.root()
              : (this.childrenOf(folderId) || null);
          if (!target) return false;
          if (!this.canMoveInto(nodeId, folderId)) return false;
          const loc = this.findNode(nodeId);
          if (!loc) return false;
          loc.siblings.splice(loc.index, 1);
          const at =
            index === undefined || index === null
              ? target.length
              : Math.max(0, Math.min(index, target.length));
          target.splice(at, 0, loc.node);
          this.changed();
          return true;
        }
        /**
         * Перемещение стрелками (ТЗ 9). Движение буквально по вертикали:
         * один клик = одна позиция среди сиблингов, а чтобы попасть внутрь
         * соседней группы, всегда нужен дополнительный клик (ТЗ 9.2) —
         * погружение происходит только с края уровня.
         */
        static moveUp(id) {
          const loc = this.findNode(id);
          if (!loc) return false;
          const { siblings, index, node, parent } = loc;
          const prev = index > 0 ? siblings[index - 1] : null;
          const isLast = index === siblings.length - 1;
          // ТЗ 9.4.2/9.4.3: снизу у края — погружение в группу-соседа сверху,
          // каждый следующий клик погружает глубже.
          if (isLast && prev && this.isFolder(prev)) {
            return this.moveToFolder(id, prev.id, (prev.children || []).length);
          }
          if (index > 0) {
            siblings.splice(index, 1);
            siblings.splice(index - 1, 0, node);
            this.changed();
            return true;
          }
          // index === 0
          if (parent) {
            // ТЗ 9.3.1: верх уровня — выход из группы на уровень выше,
            // ровно над этой группой.
            const parentLoc = this.findNode(parent.id);
            if (!parentLoc) return false;
            siblings.splice(index, 1);
            parentLoc.siblings.splice(parentLoc.index, 0, node);
            this.changed();
            return true;
          }
          // ТЗ 9.4.1: верх самого верхнего уровня — в самый низ, вне группы.
          siblings.splice(index, 1);
          siblings.push(node);
          this.changed();
          return true;
        }
        static moveDown(id) {
          const loc = this.findNode(id);
          if (!loc) return false;
          const { siblings, index, node, parent } = loc;
          const next = index < siblings.length - 1 ? siblings[index + 1] : null;
          const isFirst = index === 0;
          // ТЗ 9.4.4: сверху у края — погружение в группу-соседа снизу.
          if (isFirst && next && this.isFolder(next)) {
            return this.moveToFolder(id, next.id, 0);
          }
          if (index < siblings.length - 1) {
            siblings.splice(index, 1);
            siblings.splice(index + 1, 0, node);
            this.changed();
            return true;
          }
          // index === last
          if (parent) {
            // ТЗ 9.3.2: низ уровня — выход из группы на уровень ниже,
            // ровно под этой группой.
            const parentLoc = this.findNode(parent.id);
            if (!parentLoc) return false;
            siblings.splice(index, 1);
            parentLoc.siblings.splice(parentLoc.index + 1, 0, node);
            this.changed();
            return true;
          }
          // ТЗ 9.4.4: низ самого верхнего уровня — в самый верх, вне группы.
          siblings.splice(index, 1);
          siblings.unshift(node);
          this.changed();
          return true;
        }
        static move(id, direction) {
          return direction === "down" ? this.moveDown(id) : this.moveUp(id);
        }
        static renameFolder(folderId, name) {
          const loc = this.findNode(folderId);
          if (!loc || !this.isFolder(loc.node)) return false;
          loc.node.name = String(name === null || name === undefined ? "" : name);
          this.changed();
          return true;
        }
      }

      // ============================================================
      //  Стрелки перемещения (ТЗ 8.4/9) — общие для таймера и для папки.
      //  Глифы ↑/↓ намеренно отличаются от ▼/▲ компактного режима карточки.
      // ============================================================
      class TreeMoveView {
        static UP_ICON = "\u2191";
        static DOWN_ICON = "\u2193";
        static buttons(kind, id) {
          const box = document.createElement("span");
          box.className = "move-buttons";
          box.setAttribute(`data-${kind}-id`, String(id));
          box.appendChild(
            UIFactory.createButton(this.UP_ICON, "move-up", {
              class: "move-button",
              title: "Переместить вверх",
              [`data-${kind}-id`]: String(id),
            })
          );
          box.appendChild(
            UIFactory.createButton(this.DOWN_ICON, "move-down", {
              class: "move-button",
              title: "Переместить вниз",
              [`data-${kind}-id`]: String(id),
            })
          );
          return box;
        }
      }

      // ============================================================
      //  Представление папки: шапка (название, производная цель, доля,
      //  «В группу», «Удалить») и контейнер детей с отступом уровня.
      //  Стрелка сворачивания СПРАВА (ТЗ 8.3), стрелки перемещения СЛЕВА
      //  (ТЗ 8.4). Состояние свёрнутости — только представление (как
      //  компактный режим карточек): в модель и в облако не попадает.
      // ============================================================
      class FolderView {
        static COLLAPSE_ICON = "\u25BC"; // ▼ — группа раскрыта, клик сворачивает
        static EXPAND_ICON = "\u25B6"; // ▶ — группа свёрнута, клик раскрывает
        static MOVE_UP_ICON = "\u2191"; // ↑
        static MOVE_DOWN_ICON = "\u2193"; // ↓
        static collapsedFolders = new Set();

        static isCollapsed(folderId) {
          return this.collapsedFolders.has(String(folderId));
        }
        static folderElement(folderId) {
          return document.getElementById(`folder-${folderId}`);
        }
        static nameElement(folderId) {
          return document.getElementById(`folder-name-${folderId}`);
        }
        static targetElement(folderId) {
          return document.getElementById(`folder-target-${folderId}`);
        }
        static shareElement(folderId) {
          return document.getElementById(`folder-share-${folderId}`);
        }
        static toggleElement(folderId) {
          return document.getElementById(`folder-toggle-${folderId}`);
        }
        static childrenElement(folderId) {
          return document.getElementById(`folder-children-${folderId}`);
        }
        static forget(folderId) {
          this.collapsedFolders.delete(String(folderId));
        }
        static moveButtons(kind, id) {
          return TreeMoveView.buttons(kind, id);
        }
        static createFolderElement(node) {
          const wrapper = document.createElement("div");
          wrapper.className = this.isCollapsed(node.id)
            ? "folder-node collapsed"
            : "folder-node";
          wrapper.id = `folder-${node.id}`;
          wrapper.setAttribute("data-folder-id", String(node.id));

          const header = document.createElement("div");
          header.className = "folder-header";
          // слева — стрелки перемещения (ТЗ 8.4)
          header.appendChild(this.moveButtons("folder", node.id));
          const label = document.createElement("label");
          label.className = "field-label folder-label";
          label.textContent = "Папка:";
          header.appendChild(label);
          const nameInput = UIFactory.createInput("text", {
            class: "folder-name",
            id: `folder-name-${node.id}`,
            value: node.name || "",
            placeholder: "Название группы",
            "data-action": "folder-name",
            "data-folder-id": String(node.id),
          });
          header.appendChild(nameInput);
          const target = document.createElement("span");
          target.className = "folder-target";
          target.id = `folder-target-${node.id}`;
          header.appendChild(target);
          const share = document.createElement("span");
          share.className = "folder-share";
          share.id = `folder-share-${node.id}`;
          share.title =
            "Доля группы среди сиблингов — производная величина (сумма целей содержимого)";
          header.appendChild(share);
          header.appendChild(
            UIFactory.createButton("В группу", "to-group", {
              class: "folder-action",
              title: "Перенести группу внутрь другой группы",
              "data-folder-id": String(node.id),
            })
          );
          header.appendChild(
            UIFactory.createButton("Удалить", "delete-folder", {
              class: "folder-action",
              title: "Удалить группу вместе с содержимым",
              "data-folder-id": String(node.id),
            })
          );
          // справа — стрелка сворачивания (ТЗ 8.3)
          header.appendChild(
            UIFactory.createButton(
              this.isCollapsed(node.id) ? this.EXPAND_ICON : this.COLLAPSE_ICON,
              "toggle-folder",
              {
                class: "folder-toggle",
                id: `folder-toggle-${node.id}`,
                title: this.isCollapsed(node.id) ? "Развернуть группу" : "Свернуть группу",
                "aria-expanded": this.isCollapsed(node.id) ? "false" : "true",
                "data-folder-id": String(node.id),
              }
            )
          );
          wrapper.appendChild(header);

          const children = document.createElement("div");
          children.className = "folder-children";
          children.id = `folder-children-${node.id}`;
          wrapper.appendChild(children);
          return wrapper;
        }
        static updateFolderElement(node) {
          const el = this.folderElement(node.id);
          if (!el) return;
          const collapsed = this.isCollapsed(node.id);
          el.classList.toggle("collapsed", collapsed);
          const nameInput = this.nameElement(node.id);
          if (
            nameInput &&
            nameInput.value !== (node.name || "") &&
            document.activeElement !== nameInput
          ) {
            nameInput.value = node.name || "";
          }
          const target = this.targetElement(node.id);
          if (target) {
            target.textContent = `Целевая пропорция: ${Number(
              TreeModel.folderTarget(node.id)
            ).toFixed(4)}`;
          }
          const share = this.shareElement(node.id);
          if (share) {
            const visible = TreeModel.isShareVisible(node.id);
            share.style.display = visible ? "" : "none";
            share.textContent = `Доля: ${Number(
              TreeModel.shareOf(node.id)
            ).toFixed(4)}`;
          }
          const toggle = this.toggleElement(node.id);
          if (toggle) {
            toggle.textContent = collapsed ? this.EXPAND_ICON : this.COLLAPSE_ICON;
            toggle.title = collapsed ? "Развернуть группу" : "Свернуть группу";
            toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
          }
        }
        static toggleCollapsed(folderId) {
          const key = String(folderId);
          if (this.collapsedFolders.has(key)) this.collapsedFolders.delete(key);
          else this.collapsedFolders.add(key);
          const node = TreeModel.findNode(folderId);
          if (node && TreeModel.isFolder(node.node)) {
            this.updateFolderElement(node.node);
          }
          return this.isCollapsed(folderId);
        }
        /** Доли/цели всех папок и строки «Доля» всех таймеров. */
        static updateAllMeta() {
          TreeModel.allFolderNodes().forEach(node => this.updateFolderElement(node));
          AppState.getTimers().forEach(timer =>
            TimerView.updateTimerShare(timer)
          );
        }
      }

      // ============================================================
      //  Контроллер дерева: создание/удаление папок, перенос «В группу»,
      //  перемещение стрелками, переименование. Любое действие — сразу
      //  в localStorage и в облако (ТЗ 10.2).
      // ============================================================
      class TreeController {
        static createFolder(name, parentNode) {
          const node = TreeModel.createFolder(name, parentNode || null);
          this.afterStructureChange();
          return node;
        }
        /** Папка из отмеченных таймеров (используется модалками). */
        static createFolderFromTimers(timerIds, name) {
          const node = TreeModel.wrapNodesIntoFolder(timerIds, name);
          if (node) this.afterStructureChange();
          return node;
        }
        static deleteFolder(folderId) {
          const info = TreeModel.deleteNodeWithRedistribution(folderId);
          if (!info) return false;
          SessionManager.clearJustAfterResetFlag();
          info.timerIds.forEach(id => {
            const timer = AppState.findTimerById(id);
            if (timer) AppState.removeTimer(id);
            TimerView.forgetCompactState(id);
          });
          TreeModel.allFolderNodes(info.node.children || []).forEach(child =>
            FolderView.forget(child.id)
          );
          FolderView.forget(folderId);
          this.afterStructureChange();
          return true;
        }
        static deleteTimerNode(timer) {
          const info = TreeModel.deleteNodeWithRedistribution(timer.id);
          TimerView.forgetCompactState(timer.id);
          return info;
        }
        static move(nodeId, direction) {
          const moved = TreeModel.move(nodeId, direction);
          if (moved) {
            TimerView.renderTree();
            FolderView.updateAllMeta();
            TimerView.syncAllProportionInputs();
            StorageService.saveTimersToLocalStorage();
            // Перемещение меняет порядок — он обязан разъехаться по устройствам
            CloudSync.bumpControl();
          }
          return moved;
        }
        static moveToFolder(nodeId, folderId) {
          if (!TreeModel.canMoveInto(nodeId, folderId)) return false;
          const moved = TreeModel.moveToFolder(nodeId, folderId);
          if (moved) {
            TimerView.renderTree();
            FolderView.updateAllMeta();
            TimerView.syncAllProportionInputs();
            CalculationService.updateCalculations();
            AppController.calculateRecommendations();
            StorageService.saveTimersToLocalStorage();
            CloudSync.bumpControl();
          }
          return moved;
        }
        static renameFolder(folderId, name) {
          const renamed = TreeModel.renameFolder(folderId, name);
          if (renamed) {
            const node = TreeModel.findNode(folderId);
            if (node) FolderView.updateFolderElement(node.node);
            StorageService.saveTimersToLocalStorage();
            CloudSync.interactiveSync();
          }
          return renamed;
        }
        static handleFolderNameChange(input, folderId) {
          return this.renameFolder(folderId, input.value);
        }
        static handleShareChange(input, timerId) {
          SessionManager.clearJustAfterResetFlag();
          const share = Utils.parseShareInput(input.value);
          if (!Number.isFinite(share)) {
            TimerView.syncAllProportionInputs();
            return false;
          }
          const ok = TreeModel.setShareLocal(timerId, share);
          if (ok) {
            TimerView.syncAllProportionInputs();
            FolderView.updateAllMeta();
            if (AppState.getGlobalEndTime()) {
              TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
            }
            AppController.calculateRecommendations();
            StorageService.saveTimersToLocalStorage();
            CloudSync.bumpControl();
          }
          return ok;
        }
        /** Общий хвост структурных операций: пересчёт + порядок + облако. */
        static afterStructureChange() {
          TimerView.renderTree();
          FolderView.updateAllMeta();
          TimerView.syncAllProportionInputs();
          if (AppState.getGlobalEndTime()) {
            TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
          }
          CalculationService.updateCalculations();
          AppController.calculateRecommendations();
          AppState.notify("displayNeedsUpdate");
          StorageService.saveTimersToLocalStorage();
          CloudSync.bumpControl();
        }
      }

      // ============================================================
      //  Модалка «Создать группу» (ТЗ 5.1) — кнопка в меню «Операции».
      // ============================================================
      class CreateGroupController {
        static openModal() {
          const M = ModalController;
          const box = M.box();
          box.innerHTML = "";
          box.appendChild(M.el("div", { class: "modal-title" }, "Создать группу"));
          const nameRow = M.el("div", { class: "modal-row" });
          nameRow.appendChild(M.el("label", { for: "createGroupName" }, "Название:"));
          nameRow.appendChild(
            M.el("input", {
              type: "text",
              id: "createGroupName",
              placeholder: "Название группы",
              value: TreeModel.DEFAULT_FOLDER_NAME,
            })
          );
          box.appendChild(nameRow);
          box.appendChild(
            M.el(
              "div",
              { class: "modal-hint" },
              "Группа может остаться пустой — задачи и другие группы можно перенести в неё позже (кнопка «В группу»)."
            )
          );
          box.appendChild(M.errorRow());
          box.appendChild(
            M.buttonRow("createGroupConfirm", "create-group-confirm", "Создать")
          );
          M.context = { type: "create-group" };
          M.open();
        }
        static confirm() {
          const input = document.getElementById("createGroupName");
          const name = input ? (input.value || "").trim() : "";
          ModalController.close();
          return TreeController.createFolder(name || TreeModel.DEFAULT_FOLDER_NAME);
        }
      }

      // ============================================================
      //  Модалка «В группу» (ТЗ 6) — перенос таймера или группы.
      //  Если папок ещё нет, предлагаются таймеры: из отмеченных и
      //  переносимого узла создаётся группа (по подобию ТЗ 5.3.2).
      // ============================================================
      class MoveToGroupController {
        static ROOT_OPTION = "root";
        static openModal(nodeId, kind) {
          const M = ModalController;
          const box = M.box();
          box.innerHTML = "";
          const what = kind === "folder" ? "группу" : "задачу";
          box.appendChild(
            M.el("div", { class: "modal-title" }, `Перенести ${what} в группу`)
          );
          const folders = TreeModel.allFolderNodes().filter(
            node => TreeModel.canMoveInto(nodeId, node.id)
          );
          const list = M.el("div", { id: "moveGroupList" });
          const rootItem = M.el("label", { class: "group-select-item" });
          rootItem.appendChild(
            M.el("input", {
              type: "checkbox",
              class: "move-checkbox move-root",
              value: this.ROOT_OPTION,
            })
          );
          rootItem.appendChild(document.createTextNode(" Вне группы (в корень)"));
          list.appendChild(rootItem);
          if (folders.length) {
            folders.forEach(node => {
              const item = M.el("label", { class: "group-select-item" });
              item.appendChild(
                M.el("input", {
                  type: "checkbox",
                  class: "move-checkbox move-folder",
                  "data-folder-id": String(node.id),
                })
              );
              const name = node.name ? node.name : "(без названия)";
              item.appendChild(
                document.createTextNode(
                  ` 📁 ${name} · цель ${Number(
                    TreeModel.nodeTarget(node)
                  ).toFixed(3)}`
                )
              );
              list.appendChild(item);
            });
          } else {
            list.appendChild(
              M.el(
                "div",
                { class: "modal-hint" },
                "Групп пока нет. Отметьте задачи — они вместе с переносимой образуют новую группу:"
              )
            );
            AppState.getTimers().forEach(timer => {
              if (TreeModel.sameId(timer.id, nodeId)) return;
              const loc = TreeModel.findNode(timer.id);
              if (!loc) return;
              // потомков переносимой папки не показываем: они уже внутри
              if (kind === "folder" && TreeModel.findNode(nodeId)) {
                const inside = TreeModel.descendantTimerIds(
                  TreeModel.findNode(nodeId).node
                ).some(id => TreeModel.sameId(id, timer.id));
                if (inside) return;
              }
              const item = M.el("label", { class: "group-select-item" });
              item.appendChild(
                M.el("input", {
                  type: "checkbox",
                  class: "move-checkbox move-timer",
                  "data-timer-id": String(timer.id),
                })
              );
              item.appendChild(
                document.createTextNode(
                  ` ${timer.name ? timer.name : "(без названия)"} · цель ${Number(
                    timer.targetProportion
                  ).toFixed(3)}`
                )
              );
              list.appendChild(item);
            });
          }
          box.appendChild(list);
          const nameRow = M.el("div", { class: "modal-row" });
          nameRow.appendChild(
            M.el("label", { for: "moveGroupName" }, "Название новой группы:")
          );
          nameRow.appendChild(
            M.el("input", {
              type: "text",
              id: "moveGroupName",
              value: TreeModel.DEFAULT_FOLDER_NAME,
            })
          );
          box.appendChild(nameRow);
          box.appendChild(M.errorRow());
          box.appendChild(M.buttonRow("moveConfirm", "move-confirm", "Перенести"));
          M.context = { type: "move", nodeId, kind };
          M.open();
        }
        static confirm() {
          const ctx = ModalController.context;
          if (!ctx || ctx.type !== "move") return false;
          const checked = [...document.querySelectorAll(".move-checkbox:checked")];
          if (!checked.length) {
            ModalController.setError("Отметьте, куда перенести");
            return false;
          }
          const rootChosen = checked.some(cb => cb.classList.contains("move-root"));
          const folderBoxes = checked.filter(cb =>
            cb.classList.contains("move-folder")
          );
          const timerBoxes = checked.filter(cb =>
            cb.classList.contains("move-timer")
          );
          const name = (
            (document.getElementById("moveGroupName") || {}).value || ""
          ).trim();
          ModalController.close();
          if (folderBoxes.length) {
            return TreeController.moveToFolder(
              ctx.nodeId,
              parseFloat(folderBoxes[0].getAttribute("data-folder-id"))
            );
          }
          if (timerBoxes.length) {
            const ids = timerBoxes.map(cb =>
              parseFloat(cb.getAttribute("data-timer-id"))
            );
            ids.push(Number(ctx.nodeId));
            const folder = TreeModel.wrapNodesIntoFolder(
              ids,
              name || TreeModel.DEFAULT_FOLDER_NAME
            );
            TreeController.afterStructureChange();
            return Boolean(folder);
          }
          if (rootChosen) {
            return TreeController.moveToFolder(ctx.nodeId, null);
          }
          return false;
        }
      }
      // ============================================================
      //  «Конструктор дня» (Требования-конструктор-дня-v3.md).
      //
      //  Модель: расписание НЕ хранит интервалы — оно выводится из Целей
      //  основного экрана, поэтому «основной экран → конструктор» (раздел 11)
      //  синхронизируется мгновенно и без отдельной механики:
      //    длительность расписания D = (Конец − Начало) по циферблату
      //    (при равных — 24 ч), узлы идут подряд от «Начала» в сохранённом
      //    порядке по времени, длительность узла = Цель × D (внутри группы —
      //    от её интервала). Хранится только то, чего нет в Целях:
      //    порядок по времени, «Начало», «Конец» и начала элементов без конца.
      //  Окно конструктора работает с ЧЕРНОВИКОМ (DayDraft) и переносит его
      //  на основной экран только по «Сохранить» (10.1).
      // ============================================================
      class ScheduleModel {
        static DAY = 1440;
        static EPS = 1e-9;
        static empty() {
          return {
            saved: false,
            start: 0,
            end: 0,
            order: { root: [], folders: {} },
            startOnly: {},
          };
        }
        static norm(m) {
          return ((Number(m) % 1440) + 1440) % 1440;
        }
        /** Длительность интервала по циферблату: равные границы = 24 часа (4.6). */
        static dur(s, e) {
          const d = this.norm(e - s);
          return d < this.EPS ? 1440 : d;
        }
        /** Конец, записанный как 00:00, — это 24:00 (4.3). */
        static normEnd(m) {
          const v = this.norm(m);
          return v < this.EPS ? 1440 : v;
        }
        static circ(a, b) {
          return Math.min(this.norm(a - b), this.norm(b - a));
        }
        static parseHM(text, allow24) {
          const m = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(
            text === null || text === undefined ? "" : String(text)
          );
          if (!m) return null;
          const h = Number(m[1]);
          const mi = Number(m[2]);
          if (mi > 59 || h > 24 || (h === 24 && (mi !== 0 || !allow24))) {
            return null;
          }
          return h * 60 + mi;
        }
        static parseStart(text) {
          return this.parseHM(text, false);
        }
        static parseEnd(text) {
          const v = this.parseHM(text, true);
          return v === null ? null : v === 0 ? 1440 : v;
        }
        static pad(n) {
          return String(n).padStart(2, "0");
        }
        static fmtStart(m) {
          const x = Math.round(this.norm(m));
          const y = x === 1440 ? 0 : x;
          return `${this.pad(Math.floor(y / 60))}:${this.pad(y % 60)}`;
        }
        static fmtEnd(m) {
          if (Math.round(m) === 1440) return "24:00";
          return this.fmtStart(m);
        }
        static fmtDur(d) {
          if (d === null || d === undefined) return "—";
          const t = Math.round(d);
          return `${Math.floor(t / 60)}ч ${t % 60}м`;
        }

        // --- хранилище ------------------------------------------------
        static sanitize(raw) {
          const out = this.empty();
          let obj = raw;
          if (typeof raw === "string") {
            try {
              obj = JSON.parse(raw);
            } catch (e) {
              obj = null;
            }
          }
          if (!obj || typeof obj !== "object" || Array.isArray(obj)) return out;
          const n = v => (Number.isFinite(Number(v)) ? this.norm(Number(v)) : 0);
          out.saved = obj.saved === true;
          out.start = n(obj.start);
          out.end = n(obj.end);
          const ids = a =>
            Array.isArray(a) ? a.map(Number).filter(Number.isFinite) : [];
          if (obj.order && typeof obj.order === "object") {
            out.order.root = ids(obj.order.root);
            const folders = obj.order.folders || {};
            Object.keys(folders).forEach(k => {
              out.order.folders[k] = ids(folders[k]);
            });
          }
          if (obj.startOnly && typeof obj.startOnly === "object") {
            Object.keys(obj.startOnly).forEach(k => {
              const v = Number(obj.startOnly[k]);
              if (Number.isFinite(v)) out.startOnly[k] = this.norm(v);
            });
          }
          return out;
        }
        static load(raw) {
          AppState.schedule = this.sanitize(raw);
          return AppState.schedule;
        }
        static endMinutes() {
          const el = AppState.getGlobalEndTimeElement();
          const parsed = TimeCalculator.parseGlobalEndTime(el ? el.value : "");
          return parsed ? parsed[0] * 60 + parsed[1] : null;
        }

        // --- согласование с деревом (11.3, 11.5, 12.2) ---------------
        static isTimed(node) {
          return TreeModel.nodeTarget(node) > 1e-12;
        }
        /**
         * Привести порядок по времени к текущему дереву: ушедшие/обнулённые
         * узлы выпадают, новые (Цель > 0) становятся ПОСЛЕДНИМИ в своём
         * уровне — в корне это «непосредственно перед промежутком» (11.3.5).
         */
        static reconcile() {
          const sched = AppState.getSchedule();
          const fix = (list, children) => {
            const want = (children || []).filter(
              n => n && typeof n === "object" && this.isTimed(n)
            );
            const wantIds = new Set(want.map(n => Number(n.id)));
            const kept = [];
            (list || []).forEach(id => {
              const num = Number(id);
              if (wantIds.has(num) && !kept.includes(num)) kept.push(num);
            });
            want.forEach(n => {
              const num = Number(n.id);
              if (!kept.includes(num)) kept.push(num);
            });
            return kept;
          };
          sched.order.root = fix(sched.order.root, TreeModel.root());
          const folders = {};
          TreeModel.allFolderNodes().forEach(f => {
            folders[String(f.id)] = fix(
              sched.order.folders[String(f.id)],
              f.children
            );
          });
          sched.order.folders = folders;
          // начала элементов без конца живут, пока у элемента нет Цели
          Object.keys(sched.startOnly).forEach(k => {
            const loc = TreeModel.findNode(Number(k));
            if (!loc || this.isTimed(loc.node)) delete sched.startOnly[k];
          });
        }
        /** Разбиение: папка занимает в порядке место исходного таймера. */
        static replaceId(oldId, newId) {
          const sched = AppState.getSchedule();
          const swap = list => {
            const i = list.findIndex(x => Number(x) === Number(oldId));
            if (i === -1) return false;
            list[i] = Number(newId);
            return true;
          };
          if (swap(sched.order.root)) return;
          Object.keys(sched.order.folders).forEach(k => {
            swap(sched.order.folders[k]);
          });
        }

        // --- раскладка по циферблату ----------------------------------
        static computeLayout() {
          const sched = AppState.getSchedule();
          this.reconcile();
          const S = sched.start;
          const D = this.dur(S, sched.end);
          const map = new Map();
          const rootList = [];
          const place = (ids, start, span, out) => {
            const locs = ids
              .map(id => TreeModel.findNode(id))
              .filter(Boolean);
            const total = locs.reduce(
              (sum, loc) => sum + TreeModel.nodeTarget(loc.node),
              0
            );
            let cur = start;
            locs.forEach(loc => {
              const t = TreeModel.nodeTarget(loc.node);
              const d = total > 0 ? (t / total) * span : 0;
              const entry = { id: Number(loc.node.id), s: cur, d };
              map.set(entry.id, entry);
              if (out) out.push(entry);
              if (TreeModel.isFolder(loc.node)) {
                place(sched.order.folders[String(loc.node.id)] || [], cur, d);
              }
              cur += d;
            });
          };
          place(sched.order.root, S, D, rootList);
          return { map, root: rootList, S, E: sched.end, D };
        }
        static layout() {
          this.syncFromFields();
          return this.computeLayout();
        }

        // --- «Конец» и «Начало (для конструктора)» на основном экране --
        static renderStartField() {
          const el = document.getElementById("scheduleStart");
          if (el) el.value = this.fmtStart(AppState.getSchedule().start);
        }
        static writeEndField(minutes) {
          const el = AppState.getGlobalEndTimeElement();
          if (!el) return;
          el.value = this.fmtStart(minutes);
          TimerController.handleGlobalEndTimeInput({ target: el });
        }
        /** Есть ли промежуток: «Начало» и «Конец» расходятся (3.3.3). */
        static hasGap() {
          const s = AppState.getSchedule();
          return Math.round(s.start) !== Math.round(s.end);
        }
        /** Подтянуть расписание под поле «Конец», изменённое пользователем. */
        static syncFromFields() {
          const sched = AppState.getSchedule();
          const e = this.endMinutes();
          if (e !== null && e !== Math.round(sched.end)) this.onEndChanged(e);
          return sched;
        }
        static onEndChanged(newE) {
          const sched = AppState.getSchedule();
          const oldE = sched.end;
          if (sched.saved && Math.round(sched.start) !== Math.round(oldE)) {
            // Промежуток есть: «Конец» — начало промежутка, расписание
            // сдвигается монолитным куском, «Начало» — на ту же величину (3.4)
            sched.start = this.norm(sched.start + (newE - oldE));
            sched.end = newE;
          } else if (sched.saved && sched.order.root.length) {
            // Промежутка нет: «Конец» подстраивается под ближайшее время
            // конца активности, «Начало» совпадает с ним (5.8, 5.10, 5.11)
            const b = this.snapToBoundary(newE);
            sched.start = b;
            sched.end = b;
            if (b !== newE) this.writeEndField(b);
          } else {
            // Расписание ещё не сохранялось из конструктора: «Конец» влияет
            // на «Начало» (3.3.5), без промежутка они совпадают (3.3.8)
            sched.start = newE;
            sched.end = newE;
          }
          this.renderStartField();
        }
        static onStartChanged(v, commit) {
          const sched = AppState.getSchedule();
          this.syncFromFields();
          const E = Math.round(sched.end);
          if (!sched.saved) {
            sched.start = v;
            sched.end = v;
            if (this.endMinutes() !== v) this.writeEndField(v);
          } else if (Math.round(sched.start) !== E) {
            // Есть промежуток: первая активность начинается в указанное
            // время, «Конец» не меняется, размер промежутка изменяется (3.5)
            sched.start = v;
          } else if (commit && sched.order.root.length) {
            // Без промежутка: подстраивается под начало ближайшей активности
            const b = this.snapToBoundary(v);
            sched.start = b;
            sched.end = b;
            if (b !== E) this.writeEndField(b);
          } else {
            return false;
          }
          this.renderStartField();
          return true;
        }
        /** Ближайшая граница корневых активностей; порядок поворачивается. */
        static snapToBoundary(target) {
          const sched = AppState.getSchedule();
          const lay = this.computeLayout();
          if (!lay.root.length) return this.norm(target);
          let best = 0;
          let bestDist = Infinity;
          lay.root.forEach((entry, i) => {
            const dist = this.circ(entry.s, target);
            if (dist < bestDist - 1e-9) {
              bestDist = dist;
              best = i;
            }
          });
          const order = sched.order.root;
          sched.order.root = order.slice(best).concat(order.slice(0, best));
          return this.norm(Math.round(lay.root[best].s));
        }
        // обработчики полей основного экрана
        static onEndFieldTyping() {
          // Пока пользователь печатает, подстраиваем только случай с промежутком
          // (монолитный сдвиг); «прилипание» к концу активности — по завершении
          if (AppState.getSchedule().saved && this.hasGap()) {
            this.syncFromFields();
          }
        }
        static onEndFieldCommitted() {
          this.syncFromFields();
          this.persist();
        }
        static onStartField(value, commit) {
          const v = this.parseStart(value);
          if (v === null) return;
          if (this.onStartChanged(v, commit)) this.persist();
        }
        static persist() {
          StorageService.saveTimersToLocalStorage();
          CloudSync.bumpControl();
        }
      }

      // ============================================================
      //  Черновик окна «Конструктор дня»: чистая структура данных без DOM.
      //  Узел: { id, kind: "t"|"f", name, parent, s, e, isNew }.
      //  s — минута начала (0..1439) или null; e — минута конца (1..1440,
      //  1440 = «24:00») или null (конца нет — 4.7). Все правки живут
      //  здесь и попадают на основной экран только через commit().
      // ============================================================
      class DayDraft {
        constructor() {
          this.nodes = new Map();
          this.tempSeq = 0;
          this.S = 0;
          this.E = 0;
          this.saved = false;
        }
        static fromMain() {
          const draft = new DayDraft();
          const sched = AppState.getSchedule();
          const lay = ScheduleModel.layout();
          draft.S = sched.start;
          draft.E = sched.end;
          draft.saved = sched.saved;
          const SM = ScheduleModel;
          const walk = (nodes, parent) => {
            (nodes || []).forEach(node => {
              const id = Number(node.id);
              const isFolder = TreeModel.isFolder(node);
              const timer = isFolder ? null : AppState.findTimerById(id);
              const entry = {
                id,
                kind: isFolder ? "f" : "t",
                name: isFolder ? node.name || "" : timer ? timer.name || "" : "",
                parent,
                s: null,
                e: null,
                isNew: false,
              };
              const place = lay.map.get(id);
              if (place && place.d > 0) {
                const a = Math.round(place.s);
                const b = Math.round(place.s + place.d);
                entry.s = SM.norm(a);
                entry.e = SM.normEnd(b);
                // минимум минута, полные сутки остаются полными сутками
                if (b - a < 1 && place.d < 1439.5) {
                  entry.e = SM.normEnd(entry.s + 1);
                }
              } else if (sched.startOnly[String(id)] !== undefined) {
                entry.s = SM.norm(sched.startOnly[String(id)]);
              }
              draft.nodes.set(id, entry);
              if (isFolder) walk(node.children, id);
            });
          };
          walk(TreeModel.root(), null);
          return draft;
        }
        clone() {
          const copy = new DayDraft();
          this.nodes.forEach((n, id) => copy.nodes.set(id, { ...n }));
          copy.tempSeq = this.tempSeq;
          copy.S = this.S;
          copy.E = this.E;
          copy.saved = this.saved;
          return copy;
        }

        // --- доступ ------------------------------------------------------
        get(id) {
          return this.nodes.get(Number(id)) || null;
        }
        all() {
          return Array.from(this.nodes.values());
        }
        isGroup(n) {
          return Boolean(n) && n.kind === "f";
        }
        children(parentId) {
          const pid = parentId === null || parentId === undefined ? null : Number(parentId);
          return this.all().filter(n => n.parent === pid);
        }
        timed(n) {
          return Boolean(n) && n.s !== null && n.e !== null;
        }
        duration(n) {
          return this.timed(n) ? ScheduleModel.dur(n.s, n.e) : null;
        }
        descendants(id) {
          const out = [];
          const walk = pid =>
            this.children(pid).forEach(c => {
              out.push(c);
              if (this.isGroup(c)) walk(c.id);
            });
          walk(id);
          return out;
        }
        isInside(id, ancestorId) {
          let cur = this.get(id);
          const target = Number(ancestorId);
          let guard = 0;
          while (cur && cur.parent !== null && guard++ < 64) {
            if (cur.parent === target) return true;
            cur = this.get(cur.parent);
          }
          return false;
        }
        depth(n) {
          let d = 0;
          let cur = n;
          while (cur && cur.parent !== null && d < 64) {
            d++;
            cur = this.get(cur.parent);
          }
          return d;
        }
        rootAncestor(n) {
          let cur = n;
          let guard = 0;
          while (cur && cur.parent !== null && guard++ < 64) cur = this.get(cur.parent);
          return cur;
        }

        // --- создание ----------------------------------------------------
        createActivity(name, s, e) {
          const title = String(name === null || name === undefined ? "" : name).trim();
          if (!title) return { ok: false, error: "Название обязательно" };
          if (e !== null && e !== undefined && (s === null || s === undefined)) {
            return { ok: false, error: "Укажите время начала" };
          }
          const node = {
            id: --this.tempSeq,
            kind: "t",
            name: title,
            parent: null,
            s: s === undefined ? null : s,
            e: s === null || s === undefined || e === undefined ? null : e,
            isNew: true,
          };
          this.nodes.set(node.id, node);
          this.autoNest(node);
          return { ok: true, node };
        }
        createGroup(name) {
          const title = String(name === null || name === undefined ? "" : name).trim();
          if (!title) return { ok: false, error: "Название обязательно" };
          const node = {
            id: --this.tempSeq,
            kind: "f",
            name: title,
            parent: null,
            s: null,
            e: null,
            isNew: true,
          };
          this.nodes.set(node.id, node);
          return { ok: true, node };
        }
        rename(id, name) {
          const n = this.get(id);
          if (!n) return false;
          n.name = String(name === null || name === undefined ? "" : name);
          return true;
        }

        // --- время -------------------------------------------------------
        /** Начало активности внутри интервала группы — активность в группе (8.3). */
        autoNest(node) {
          if (!node || node.kind !== "t" || node.s === null) return false;
          let best = null;
          let bestDepth = -1;
          this.all().forEach(g => {
            if (!this.isGroup(g) || g.id === node.id || !this.timed(g)) return;
            const inside =
              ScheduleModel.norm(node.s - g.s) < this.duration(g) - 1e-9;
            if (!inside) return;
            const d = this.depth(g);
            if (d > bestDepth) {
              best = g;
              bestDepth = d;
            }
          });
          if (best && node.parent !== best.id) {
            node.parent = best.id;
            return true;
          }
          return false;
        }
        /** Равнопропорциональное сжатие/расширение содержимого группы (9.4.2). */
        scaleContent(group, old, neu) {
          const SM = ScheduleModel;
          const oldD = SM.dur(old.s, old.e);
          const newD = SM.dur(neu.s, neu.e);
          const k = newD / oldD;
          const planned = this.descendants(group.id)
            .filter(c => c.s !== null)
            .map(c => {
              const off = SM.norm(c.s - old.s);
              const ns = Math.round(neu.s + off * k);
              if (c.e === null) return { c, s: SM.norm(ns), e: null, len: Infinity };
              const len = SM.dur(c.s, c.e);
              const ne = Math.round(neu.s + (off + len) * k);
              return { c, s: SM.norm(ns), e: SM.normEnd(ne), len: ne - ns };
            });
          if (planned.some(p => p.len < 1)) {
            group.shrunk = true;
            return false;
          }
          planned.forEach(p => {
            p.c.s = p.s;
            p.c.e = p.e;
          });
          group.shrunk = false;
          return true;
        }
        /** Задать время элемента; e = null удаляет конец (4.7). */
        setTime(id, s, e) {
          const n = this.get(id);
          if (!n) return false;
          const start = s === undefined ? n.s : s;
          let end = e === undefined ? n.e : e;
          if (start === null) end = null;
          const old = { s: n.s, e: n.e };
          if (
            this.isGroup(n) &&
            old.s !== null &&
            old.e !== null &&
            start !== null &&
            end !== null &&
            this.children(n.id).length
          ) {
            // Если прошлое сжатие не применилось (9.4.7), содержимое всё ещё
            // соответствует прежнему интервалу — масштабируем от него
            this.scaleContent(n, n.baseRef || old, { s: start, e: end });
            if (n.shrunk) n.baseRef = n.baseRef || old;
            else delete n.baseRef;
          } else if (this.isGroup(n)) {
            n.shrunk = false;
            delete n.baseRef;
          }
          n.s = start;
          n.e = end;
          if (n.kind === "t" && start !== null && start !== old.s) this.autoNest(n);
          return true;
        }
        setStart(id, s) {
          return this.setTime(id, s, s === null ? null : undefined);
        }
        setEnd(id, e) {
          const n = this.get(id);
          if (!n) return false;
          if (n.s === null) return false;
          return this.setTime(id, n.s, e);
        }
        /** Сдвинуть элемент и всё его содержимое, сохранив длительности. */
        shift(n, delta) {
          const SM = ScheduleModel;
          [n, ...this.descendants(n.id)].forEach(x => {
            if (x.s === null) return;
            const d = x.e === null ? null : SM.dur(x.s, x.e);
            x.s = SM.norm(x.s + delta);
            if (d !== null) x.e = SM.normEnd(x.s + d);
          });
        }

        // --- состав (раздел 9.5) -----------------------------------------
        canMoveToGroup(id) {
          const n = this.get(id);
          if (!n) return false;
          // у активности без временного диапазона кнопки нет (9.5.6)
          return this.isGroup(n) || this.timed(n);
        }
        toGroup(id, groupId) {
          const n = this.get(id);
          const g = this.get(groupId);
          if (!n || !g || !this.isGroup(g)) return { ok: false, error: "Выберите группу" };
          if (n.id === g.id || this.isInside(g.id, n.id)) {
            return { ok: false, error: "Нельзя поместить группу внутрь самой себя" };
          }
          if (!this.canMoveToGroup(id)) {
            return { ok: false, error: "Сначала укажите временной диапазон активности" };
          }
          n.parent = g.id;
          // 9.5.3: время начала совпадает со временем начала группы;
          // если у группы времени нет — выравнивать нечего
          if (g.s !== null && n.s !== null) {
            this.shift(n, ScheduleModel.norm(g.s - n.s));
          }
          return { ok: true };
        }
        fromGroup(id) {
          const n = this.get(id);
          if (!n || n.parent === null) return { ok: false, error: "Сущность не в группе" };
          const top = this.rootAncestor(n);
          n.parent = null;
          // 9.5.10: длительность сохраняется, начало = конец корневой группы
          if (top && top.e !== null && n.s !== null) {
            this.shift(n, ScheduleModel.norm(top.e - n.s));
          }
          return { ok: true };
        }

        // --- удаление ------------------------------------------------------
        /**
         * Удаление в конструкторе НИЧЕГО не пересчитывает: активность —
         * сама, группа — вместе с содержимым, а время всех остальных остаётся
         * прежним. Доли и перераспределение — дело основного экрана; в окне
         * образовавшуюся дыру (лишний промежуток, свободное время в группе)
         * пользователь закрывает подгонкой времени, пока она подсвечена.
         */
        remove(id) {
          const n = this.get(id);
          if (!n) return false;
          [n, ...this.descendants(n.id)].forEach(x => this.nodes.delete(x.id));
          return true;
        }

        // --- анализ: подсветка и блокировки (раздел 9.3) -----------------
        static arcOverlap(a, b) {
          const SM = ScheduleModel;
          return (
            SM.norm(b.s - a.s) < a.d - 1e-9 || SM.norm(a.s - b.s) < b.d - 1e-9
          );
        }
        /**
         * Свободные участки внутри [spanStart, spanStart + spanLen) за
         * вычетом занятых дуг. circular — корень: участки на стыке суток
         * склеиваются в один промежуток.
         */
        static holes(arcs, spanStart, spanLen, circular) {
          const SM = ScheduleModel;
          const segs = [];
          const push = (x, y) => {
            const lo = Math.max(0, x);
            const hi = Math.min(spanLen, y);
            if (hi - lo > 1e-9) segs.push([lo, hi]);
          };
          arcs.forEach(a => {
            const o = SM.norm(a.s - spanStart);
            push(o, o + a.d);
            if (o + a.d > 1440) push(0, o + a.d - 1440);
          });
          segs.sort((p, q) => p[0] - q[0]);
          const holes = [];
          let cur = 0;
          segs.forEach(([lo, hi]) => {
            if (lo > cur + 1e-9) holes.push([cur, lo]);
            cur = Math.max(cur, hi);
          });
          if (cur < spanLen - 1e-9) holes.push([cur, spanLen]);
          if (
            circular &&
            holes.length > 1 &&
            holes[0][0] <= 1e-9 &&
            holes[holes.length - 1][1] >= spanLen - 1e-9
          ) {
            const last = holes.pop();
            holes[0] = [last[0] - spanLen, holes[0][1]];
          }
          return holes.map(([lo, hi]) => ({
            from: SM.norm(spanStart + lo),
            to: SM.norm(spanStart + hi),
            len: hi - lo,
          }));
        }
        bounders(hole, nodes) {
          const SM = ScheduleModel;
          const out = [];
          nodes.forEach(n => {
            const end = SM.norm(n.s + SM.dur(n.s, n.e));
            if (Math.abs(end - SM.norm(hole.from)) < 1e-9) out.push(n.id);
            if (Math.abs(SM.norm(n.s) - SM.norm(hole.to)) < 1e-9) out.push(n.id);
          });
          return out;
        }
        analyze() {
          const SM = ScheduleModel;
          const red = new Set();
          const blue = new Set();
          const errors = [];
          const label = n => `«${n.name || "без названия"}»`;
          const err = (code, ids, text) => {
            errors.push({ code, ids, text });
            ids.forEach(i => red.add(i));
          };
          const arc = n => ({ s: n.s, d: this.duration(n) });
          const containers = [null, ...this.all().filter(n => this.isGroup(n)).map(g => g.id)];
          containers.forEach(cid => {
            const sibs = this.children(cid).filter(n => this.timed(n));
            for (let i = 0; i < sibs.length; i++) {
              for (let j = i + 1; j < sibs.length; j++) {
                if (DayDraft.arcOverlap(arc(sibs[i]), arc(sibs[j]))) {
                  err("overlap", [sibs[i].id, sibs[j].id],
                    `Интервалы ${label(sibs[i])} и ${label(sibs[j])} пересекаются`);
                }
              }
            }
          });
          this.all().forEach(c => {
            if (c.parent === null || !this.timed(c)) return;
            const p = this.get(c.parent);
            if (!p || !this.timed(p)) return;
            const inside =
              SM.norm(c.s - p.s) + this.duration(c) <= this.duration(p) + 1e-9;
            if (!inside) {
              err("outside", [c.id],
                `Время ${label(c)} не попадает в интервал группы ${label(p)}`);
            }
          });
          this.all().filter(n => this.isGroup(n)).forEach(g => {
            const kids = this.children(g.id);
            if (kids.length) {
              if (!this.timed(g)) {
                // 9.4.12: блокирует группа без времени с ВРЕМЕННЫМ содержимым;
                // состоящая из одних элементов без времени (например, после
                // обнуления Целей на основном экране) — допустима (9.4.10)
                if (this.descendants(g.id).some(c => this.timed(c))) {
                  err("group-no-time", [g.id],
                    `У группы ${label(g)} есть содержимое, но не задан временной диапазон`);
                }
              } else {
                const timedKids = kids.filter(k => this.timed(k));
                const holes = DayDraft.holes(timedKids.map(arc), g.s, this.duration(g), false);
                if (holes.length) {
                  const ids = [g.id];
                  holes.forEach(h => ids.push(...this.bounders(h, timedKids)));
                  err("group-free", ids,
                    `Внутри группы ${label(g)} есть свободное время`);
                }
                if (g.shrunk) {
                  err("group-short", [g.id],
                    `Группа ${label(g)} слишком короткая: содержимое не помещается (минимум минута на элемент)`);
                }
              }
            } else if (this.timed(g)) {
              err("group-empty", [g.id],
                `Группа ${label(g)} без содержимого не может занимать время — заполните её, удалите или уберите конец`);
            }
          });
          const rootTimed = this.children(null).filter(n => this.timed(n));
          const rootHoles = rootTimed.length
            ? DayDraft.holes(rootTimed.map(arc), 0, 1440, true)
            : [];
          if (rootHoles.length > 1) {
            const ids = [];
            rootHoles.forEach(h => ids.push(...this.bounders(h, rootTimed)));
            err("gaps", ids, "В расписании больше одного промежутка");
          } else if (rootHoles.length === 1) {
            this.bounders(rootHoles[0], rootTimed).forEach(i => blue.add(i));
          }
          let ref = 0;
          if (rootHoles.length === 1) ref = rootHoles[0].to;
          else if (rootHoles.length === 0 && rootTimed.length && this.saved) ref = this.S;
          return {
            red,
            blue,
            errors,
            canSave: errors.length === 0,
            rootHoles,
            gapCount: rootHoles.length,
            ref,
          };
        }

        // --- порядок отображения (8.1, 9.6) --------------------------------
        sortedChildren(parentId, ref) {
          const SM = ScheduleModel;
          const list = this.children(parentId);
          const base = parentId === null ? ref : this.get(parentId).s || 0;
          const byName = (a, b) => String(a.name).localeCompare(String(b.name), "ru");
          const withStart = list
            .filter(n => n.s !== null)
            .sort((a, b) => SM.norm(a.s - base) - SM.norm(b.s - base) || byName(a, b));
          const empties = list
            .filter(n => n.s === null)
            .sort((a, b) =>
              a.kind === b.kind ? byName(a, b) : a.kind === "f" ? -1 : 1
            );
          return { withStart, empties };
        }
        /** Строки окна: [{ node, depth, section: "main"|"empty" }]. */
        rows(analysis) {
          const a = analysis || this.analyze();
          const out = [];
          const emit = (n, depth, section) => {
            out.push({ node: n, depth, section });
            if (this.isGroup(n)) {
              const sub = this.sortedChildren(n.id, a.ref);
              sub.withStart.concat(sub.empties).forEach(c => emit(c, depth + 1, section));
            }
          };
          const top = this.sortedChildren(null, a.ref);
          top.withStart.forEach(n => emit(n, 0, "main"));
          top.empties.forEach(n => emit(n, 0, "empty"));
          return out;
        }

        // --- план сохранения (раздел 10) -----------------------------------
        plan() {
          const SM = ScheduleModel;
          const a = this.analyze();
          if (!a.canSave) return { ok: false, errors: a.errors };
          const rootTimed = this.children(null).filter(n => this.timed(n));
          let S = SM.norm(this.S);
          let E = SM.norm(this.E);
          let ref = 0;
          if (rootTimed.length) {
            if (a.gapCount === 1) {
              S = SM.norm(a.rootHoles[0].to);
              E = SM.norm(a.rootHoles[0].from);
              ref = S;
            } else {
              // Промежутка нет: «Конец» привязывается к ближайшему концу
              // активности, «Начало» совпадает с ним (10.2.2, 5.8, 5.11)
              let best = null;
              let bestDist = Infinity;
              rootTimed
                .slice()
                .sort((p, q) => SM.norm(p.s - a.ref) - SM.norm(q.s - a.ref))
                .forEach(n => {
                  const end = SM.norm(n.s + this.duration(n));
                  const dist = SM.circ(end, this.E);
                  if (dist < bestDist - 1e-9) {
                    bestDist = dist;
                    best = end;
                  }
                });
              S = best;
              E = best;
              ref = best;
            }
          }
          const total = rootTimed.reduce((sum, n) => sum + this.duration(n), 0);
          const targets = new Map();
          this.all()
            .filter(n => n.kind === "t")
            .forEach(n => {
              targets.set(
                n.id,
                this.timed(n) && total > 0 ? this.duration(n) / total : 0
              );
            });
          const sortBy = (list, base) =>
            list
              .slice()
              .sort((p, q) => SM.norm(p.s - base) - SM.norm(q.s - base))
              .map(n => n.id);
          const order = { root: sortBy(rootTimed, ref), folders: {} };
          this.all()
            .filter(n => this.isGroup(n))
            .forEach(g => {
              if (!this.timed(g)) return;
              order.folders[g.id] = sortBy(
                this.children(g.id).filter(k => this.timed(k)),
                g.s
              );
            });
          const startOnly = {};
          this.all().forEach(n => {
            if (n.s !== null && n.e === null) startOnly[n.id] = n.s;
          });
          return { ok: true, S, E, targets, order, startOnly, hasTime: rootTimed.length > 0 };
        }

        /** Перенести черновик на основной экран (кнопка «Сохранить»). */
        commit() {
          const plan = this.plan();
          if (!plan.ok) return plan;
          const idMap = new Map();
          const keep = new Set();
          const list = this.all().sort((a, b) => this.depth(a) - this.depth(b));
          const attach = (node, parentRealId) => {
            const target =
              parentRealId === null ? TreeModel.root() : TreeModel.childrenOf(parentRealId);
            if (target) target.push(node);
          };
          const renames = [];
          list.forEach(n => {
            const loc = n.isNew ? null : TreeModel.findNode(n.id);
            const wantParent = n.parent === null ? null : idMap.get(n.parent);
            if (loc && TreeModel.isFolder(loc.node) === (n.kind === "f")) {
              const real = Number(loc.node.id);
              idMap.set(n.id, real);
              keep.add(real);
              const cur = loc.parent ? Number(loc.parent.id) : null;
              if (cur !== (wantParent === undefined ? null : wantParent)) {
                loc.siblings.splice(loc.index, 1);
                attach(loc.node, wantParent === undefined ? null : wantParent);
              }
              renames.push([real, n.kind, n.name]);
              return;
            }
            // новый узел (или исчезнувший с основного экрана) — создаём
            if (n.kind === "f") {
              const folder = TreeModel.createFolderNode(n.name);
              attach(folder, wantParent === undefined ? null : wantParent);
              idMap.set(n.id, Number(folder.id));
              keep.add(Number(folder.id));
            } else {
              const timer = TimerModel.createTimer();
              timer.name = n.name;
              timer.targetProportion = 0;
              timer.proportion = 0;
              timer.recommendedProportion = 0;
              attach(
                TreeModel.createTimerNode(timer.id),
                wantParent === undefined ? null : wantParent
              );
              idMap.set(n.id, Number(timer.id));
              keep.add(Number(timer.id));
              AppState.addTimer(timer);
            }
          });
          // удаление: всё, чего нет в черновике (последнее слово — за нажавшим
          // «Сохранить», 11.4.3; удаление группы — вместе с содержимым, 7.3.9)
          const doomed = TreeModel.flatten().filter(x => !keep.has(x.id));
          const doomedIds = new Set(doomed.map(x => x.id));
          doomed.forEach(x => {
            if (x.parent && doomedIds.has(Number(x.parent.id))) return;
            const loc = TreeModel.findNode(x.id);
            if (loc) loc.siblings.splice(loc.index, 1);
          });
          doomed.forEach(x => {
            if (x.kind === "timer") {
              AppState.removeTimer(x.id);
              TimerView.forgetCompactState(x.id);
            } else {
              FolderView.forget(x.id);
            }
          });
          // имена
          renames.forEach(([real, kind, name]) => {
            if (kind === "f") {
              const loc = TreeModel.findNode(real);
              if (loc) loc.node.name = name;
            } else {
              const timer = AppState.findTimerById(real);
              if (timer) timer.name = name;
              const card = AppState.getTimerElement(real);
              const input = card && card.querySelector('input[data-action="name"]');
              if (input) input.value = name;
            }
          });
          // Цели (10.2.3) и Вес (10.2.4: сохраняется сумма весов, как это
          // делает правка Цели на основном экране)
          const timers = AppState.getTimers();
          const weightSum = timers.reduce((s, t) => s + (Number(t.proportion) || 0), 0);
          const W = weightSum > 0 ? weightSum : 1;
          let targetSum = 0;
          const realTargets = new Map();
          plan.targets.forEach((v, draftId) => {
            realTargets.set(idMap.get(draftId), v);
            targetSum += v;
          });
          timers.forEach(t => {
            const v = realTargets.get(Number(t.id));
            if (v === undefined) return;
            t.targetProportion = v;
            if (targetSum > 0) t.proportion = v * W;
          });
          TreeModel.changed();
          // расписание
          const sched = AppState.getSchedule();
          const mapIds = ids => ids.map(i => idMap.get(i)).filter(i => i !== undefined);
          sched.saved = true;
          if (plan.hasTime) {
            sched.start = plan.S;
            sched.end = plan.E;
          }
          sched.order = { root: mapIds(plan.order.root), folders: {} };
          Object.keys(plan.order.folders).forEach(k => {
            const real = idMap.get(Number(k));
