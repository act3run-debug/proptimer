            if (real !== undefined) sched.order.folders[String(real)] = mapIds(plan.order.folders[k]);
          });
          sched.startOnly = {};
          Object.keys(plan.startOnly).forEach(k => {
            const real = idMap.get(Number(k));
            if (real !== undefined) sched.startOnly[String(real)] = plan.startOnly[k];
          });
          ScheduleModel.reconcile();
          if (plan.hasTime && ScheduleModel.endMinutes() !== plan.E) {
            ScheduleModel.writeEndField(plan.E);
          }
          ScheduleModel.renderStartField();
          TimerView.renderTree();
          TimerView.syncAllProportionInputs();
          if (AppState.getGlobalEndTime()) {
            TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
          }
          CalculationService.updateCalculations();
          AppController.calculateRecommendations();
          AppState.notify("displayNeedsUpdate");
          StorageService.saveTimersToLocalStorage();
          CloudSync.bumpControl();
          return { ok: true, plan };
        }
      }

      // ============================================================
      //  Окно «Конструктор дня» (раздел 7): модальное поверх основного
      //  экрана, пока открыто — основной экран данного устройства
      //  не редактируется (11.4).
      // ============================================================
      class DayBuilder {
        static draft = null;
        static mode = "list";
        static pickFor = null;
        static messages = [];

        static isActive() {
          return (
            Boolean(this.draft) &&
            Boolean(ModalController.context) &&
            ModalController.context.type === "day"
          );
        }
        static isOpen() {
          return this.isActive() && ModalController.isOpen();
        }
        static open() {
          ScheduleModel.syncFromFields();
          this.draft = DayDraft.fromMain();
          this.mode = "list";
          this.messages = [];
          ModalController.context = { type: "day" };
          this.render();
          ModalController.context = { type: "day" };
          ModalController.open();
          const box = ModalController.box();
          if (box) box.classList.add("day-builder");
        }
        static close() {
          this.draft = null;
          this.mode = "list";
          this.pickFor = null;
          this.messages = [];
          const box = ModalController.box();
          if (box) box.classList.remove("day-builder");
          ModalController.close();
        }
        static setMessages(lines) {
          this.messages = lines || [];
          const el = document.getElementById("modalError");
          if (el) el.textContent = this.messages.join("\n");
        }
        static el(tag, attrs, text) {
          return ModalController.el(tag, attrs || {}, text);
        }
        static timeInput(cls, value, field, id, placeholder) {
          return this.el("input", {
            type: "text",
            class: `dd-time ${cls}`,
            value,
            placeholder,
            size: "5",
            "data-dd-field": field,
            "data-dd-id": String(id),
          });
        }
        static button(text, action, id, extra) {
          const attrs = { "data-dd-action": action, ...(extra || {}) };
          if (id !== undefined && id !== null) attrs["data-dd-id"] = String(id);
          return this.el("button", attrs, text);
        }
        static render() {
          const box = ModalController.box();
          if (!box || !this.draft) return;
          box.innerHTML = "";
          if (this.mode === "create-activity") return this.renderCreateActivity(box);
          if (this.mode === "create-group") return this.renderCreateGroup(box);
          if (this.mode === "pick-group") return this.renderPickGroup(box);
          return this.renderList(box);
        }
        static renderList(box) {
          const draft = this.draft;
          const analysis = draft.analyze();
          box.appendChild(this.el("div", { class: "modal-title" }, "Конструктор дня"));
          const bar = this.el("div", { class: "modal-row dd-toolbar" });
          bar.appendChild(this.button("Создать группу", "new-group"));
          bar.appendChild(this.button("Создать активность", "new-activity"));
          box.appendChild(bar);
          const list = this.el("div", { id: "ddList", class: "dd-list" });
          const rows = draft.rows(analysis);
          let emptyShown = false;
          rows.forEach(row => {
            if (row.section === "empty" && !emptyShown) {
              emptyShown = true;
              list.appendChild(this.el("div", { class: "dd-section", id: "ddEmptyTitle" }, "Пустое"));
            }
            list.appendChild(this.renderRow(row, analysis));
          });
          if (!rows.length) {
            list.appendChild(this.el("div", { class: "modal-hint" }, "Пока нет ни активностей, ни групп."));
          }
          box.appendChild(list);

        // --- клики ------------------------------------------------------
        static handleClick(target) {
          if (!this.draft) return;
          const action = target.getAttribute("data-dd-action");
          const idAttr = target.getAttribute("data-dd-id");
          const id = idAttr === null ? null : Number(idAttr);
          const draft = this.draft;
          const fail = text => this.setMessages([text]);
          if (action === "close") return this.close();
          if (action === "save") return this.save();
          if (action === "back") {
            this.mode = "list";
            this.pickFor = null;
            return this.render();
          }
          if (action === "new-group") {
            this.mode = "create-group";
            return this.render();
          }
          if (action === "new-activity") {
            this.mode = "create-activity";
            return this.render();
          }
          if (action === "create-group-confirm") {
            const res = draft.createGroup(document.getElementById("ddNewName").value);
            if (!res.ok) return this.setMessages([res.error]);
            this.mode = "list";
            this.messages = [];
            return this.render();
          }
          if (action === "create-activity-confirm") {
            const name = document.getElementById("ddNewName").value;
            const sText = document.getElementById("ddNewStart").value.trim();
            const eText = document.getElementById("ddNewEnd").value.trim();
            const s = sText === "" ? null : ScheduleModel.parseStart(sText);
            const e = eText === "" ? null : ScheduleModel.parseEnd(eText);
            if ((sText !== "" && s === null) || (eText !== "" && e === null)) {
              return this.setMessages(["Время указывается как чч:мм (конец — до 24:00)"]);
            }
            const res = draft.createActivity(name, s, e);
            if (!res.ok) return this.setMessages([res.error]);
            this.mode = "list";
            this.messages = [];
            return this.render();
          }
          if (action === "to-group") {
            this.mode = "pick-group";
            this.pickFor = id;
            return this.render();
          }
          if (action === "pick-confirm") {
            const boxes = Array.from(document.querySelectorAll(".dd-pick:checked"));
            if (boxes.length !== 1) {
              return fail("Отметьте ровно одну группу");
            }
            const res = draft.toGroup(this.pickFor, Number(boxes[0].getAttribute("data-dd-id")));
            if (!res.ok) return fail(res.error);
            this.mode = "list";
            this.pickFor = null;
            this.messages = [];
            return this.render();
          }
          if (action === "from-group") {
            draft.fromGroup(id);
            this.messages = [];
            return this.render();
          }
          if (action === "delete") {
            draft.remove(id);
            this.messages = [];
            return this.render();
          }
          if (action === "clear-end") {
            draft.setEnd(id, null);
            this.messages = [];
            return this.render();
          }
        }
        static handleFocus(target) {
          if (
            this.draft &&
            target &&
            target.classList &&
            target.classList.contains("dd-time") &&
            typeof target.select === "function"
          ) {
            target.select();
          }
        }
        /** Изменение поля (change): применить к черновику и перерисовать. */
        static handleChange(target) {
          if (!this.draft || this.mode !== "list") return;
          const field = target.getAttribute("data-dd-field");
          if (!field) return;
          const id = Number(target.getAttribute("data-dd-id"));
          const draft = this.draft;
          if (field === "name") {
            draft.rename(id, target.value);
            this.messages = [];
            return this.render();
          }
          const op = this.timeOp(draft, id, field, target.value);
          if (!op.ok) {
            this.setMessages([op.error]);
            return this.render();
          }
          this.messages = [];
          this.render();
        }
        /** Применить правку времени к переданному черновику. */
        static timeOp(draft, id, field, text) {
          const SM = ScheduleModel;
          const t = String(text).trim();
          if (field === "start") {
            if (t === "") {
              draft.setStart(id, null);
              return { ok: true };
            }
            const s = SM.parseStart(t);
            if (s === null) return { ok: false, error: "Время начала указывается как чч:мм" };
            draft.setStart(id, s);
            return { ok: true };
          }
          if (t === "") {
            draft.setEnd(id, null);
            return { ok: true };
          }
          const e = SM.parseEnd(t);
          if (e === null) return { ok: false, error: "Время конца указывается как чч:мм (до 24:00)" };
          if (!draft.setEnd(id, e)) return { ok: false, error: "Сначала укажите время начала" };
          return { ok: true };
        }
        /** Набор текста (input): подсветка конфликтов сразу, без перерисовки (9.3.2). */
        static handleInput(target) {
          if (!this.draft || this.mode !== "list") return;
          const field = target.getAttribute("data-dd-field");
          if (field !== "start" && field !== "end") return;
          const id = Number(target.getAttribute("data-dd-id"));
          const preview = this.draft.clone();
          const op = this.timeOp(preview, id, field, target.value);
          if (!op.ok) return;
          this.paint(preview.analyze());
        }
        static paint(analysis) {
          document.querySelectorAll("#ddList .dd-row").forEach(row => {
            const id = Number(row.getAttribute("data-dd-id"));
            row.classList.toggle("dd-red", analysis.red.has(id));
            row.classList.toggle("dd-blue", !analysis.red.has(id) && analysis.blue.has(id));
          });
        }
        static save() {
          if (!this.draft) return null;
          const result = this.draft.commit();
          if (!result.ok) {
            this.setMessages(result.errors.map(e => e.text));
            return result;
          }
          this.close();
          return result;
        }
      }

      class ModalController {
        // Общие модальные окна: контент строится контроллерами операций,

          const el = document.getElementById("modalError");
          if (el) el.textContent = text || "";
        }
        static el(tag, attrs = {}, text) {
          const node = document.createElement(tag);
          for (const [key, value] of Object.entries(attrs)) {
            if (key === "class") node.className = value;
            else if (key === "value") node.value = value;
            else node.setAttribute(key, value);
          }
          if (text !== undefined) node.textContent = text;
          return node;
        }
        static errorRow() {
          return this.el("div", { class: "modal-error", id: "modalError" });

        static buttonRow(okId, okAction, okText) {

            this.el(
              "button",
              { id: okId, "data-modal-action": okAction },

            )

              { id: "modalCancel", "data-modal-action": "cancel" },
              "\u041e\u0442\u043c\u0435\u043d\u0430"
            )
          );
          return row;

        static handleOverlayClick(event) {
          const target = event.target;
          // «Конструктор дня»: клик мимо окна его не закрывает (правки пропали бы)
          if (DayBuilder.isActive()) {
            if (target.getAttribute && target.getAttribute("data-dd-action")) {
              DayBuilder.handleClick(target);
            }
            return;
          }
          if (target === ModalController.overlay()) {
            ModalController.close();
            return;
          }
          if (!target.getAttribute) return;
          const action = target.getAttribute("data-modal-action");
          if (!action) return;
          if (action === "cancel") {
            ModalController.close();
          } else if (action === "add-confirm") {
            AddTaskController.confirm();
          } else if (action === "group-confirm") {
            GroupTaskController.confirm();
          } else if (action === "split-confirm") {
            SplitController.confirm();
          } else if (action === "split-add-row") {
            SplitController.addRow();
          } else if (action === "create-group-confirm") {
            CreateGroupController.confirm();
          } else if (action === "move-confirm") {
            MoveToGroupController.confirm();
          } else if (
            typeof action === "string" &&
            action.indexOf("cloud-") === 0
          ) {
            CloudController.handleAction(action);
          }
        }
      }

      class Utils {
        static formatTime(seconds) {
          seconds = Math.floor(seconds);

          // форматируются по модулю со знаком спереди: раньше Math.floor по
          // каждому компоненту давал бы misleading "-1:-5:0" для -300с.
          const sign = seconds < 0 ? "-" : "";

          const hrs = Math.floor(abs / 3600);
          const mins = Math.floor((abs % 3600) / 60);
          const secs = abs % 60;
          const pad = n => String(n).padStart(2, "0");
          return `${sign}${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
        }
        static convertTimeInputsToSeconds(
          hoursInput,
          minutesInput,
          secondsInput

          const hours = parseInt(hoursInput.value) || 0;
          const minutes = parseInt(minutesInput.value) || 0;
          const seconds = parseInt(secondsInput.value) || 0;
          return hours * 3600 + minutes * 60 + seconds;

          const raw = String(value === null || value === undefined ? "" : value)
            .trim()

          // (разбиение на подзадачи, быстрые создания, замороженные часы)

          // Сдвиг часов носителя - поле, принадлежащее НОСИТЕЛЮ: берём его
          // из любого облачного снимка сразу, минуя гейты полного приёма.
          // true = локальное опубликованное значение изменилось.
          try {
            const holder = remote && remote.tzHolderDevice;
            if (!holder || holder === this.deviceId()) return false;
            if (
              remote.tzHolderSkewMs === null ||
              remote.tzHolderSkewMs === undefined
            ) {
              return false;
            }
            const incoming = Number(remote.tzHolderSkewMs);
            if (!Number.isFinite(incoming)) return false;
            const raw = localStorage.getItem("tzHolderSkewMs");
            if (raw !== null && Number(raw) === incoming) return false;
            localStorage.setItem("tzHolderSkewMs", String(incoming));
            return true;
          } catch (e) {
            return false;
          }
        }
        static applySnapshot(data) {
          if (!data || typeof data !== "object") return;
          // Если носитель - мы, чужая устаревшая копия НАШЕГО поля (сдвиг
          // часов) не должна затирать локально опубликованное значение
          if (
            data.tzHolderDevice &&
            data.tzHolderDevice === this.deviceId() &&
            localStorage.getItem("tzHolderSkewMs") !== null &&
            String(data.tzHolderSkewMs) !==
              localStorage.getItem("tzHolderSkewMs")
          ) {
            data = {
              ...data,
              tzHolderSkewMs: localStorage.getItem("tzHolderSkewMs"),
            };
          }
          this.STATE_KEYS.forEach(key => {
            const value = data[key];
            if (value === null || value === undefined) {
              localStorage.removeItem(key);
            } else {
              localStorage.setItem(key, String(value));
            }
          });
          // Сердцебиение принятого состояния переводим на ЛОКАЛЬНЫЕ часы:
          // проверка «страница долго была закрыта» не должна зависеть от
          // расхождения часов устройств (иначе живая чужая сессия на входе
          // ошибочно сворачивалась в авто-паузу с обнулённым Фактом).
          localStorage.setItem("lastSaveAt", String(CloudSync.serverNow()));
          // Принятое состояние считаем «уже отправленным»: не слать его
          // обратно и не принимать повторно
          localStorage.setItem(this.LS_PUSH_HASH, this.snapshotContentHash(data));
          localStorage.setItem(this.LS_PUSH_PROJ, this.meaningfulHash(data));
          this.lastPushAtMs = Date.now();
        }
        static quickHash(str) {
          let h = 0x811c9dc5;
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 0x01000193) >>> 0;
          }
          return h.toString(16).padStart(8, "0");
        }
        static snapshotContentHash(snapshot) {
          // Нормализованный хэш значимых полей: отсутствие ключа и null
          // считаются равными (облачная запись может быть старого формата),
          // __device и lastSaveAt (летучие поля) в сравнении не участвуют.
          const copy = {};
          this.STATE_KEYS.forEach(key => {
            if (key === "lastSaveAt") return;
            const value = snapshot ? snapshot[key] : null;
            copy[key] = value === undefined || value === null ? null : String(value);
          });
          return this.quickHash(JSON.stringify(copy));
        }

        // --- Сеть (PostgREST RPC) ---
        static async rpc(fn, args, options = {}) {
          const base = String(CLOUD_CONFIG.url).replace(/\/+$/, "");
          const t0 = Date.now();
          const res = await fetch(`${base}/rest/v1/rpc/${fn}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              apikey: CLOUD_CONFIG.anonKey,
              Authorization: `Bearer ${CLOUD_CONFIG.anonKey}`,
            },
            body: JSON.stringify(args),
            keepalive: Boolean(options.keepalive),
          });
          if (!res.ok) {
            let msg = "";
            try {
              msg = (await res.text()).slice(0, 200);
            } catch (e) {}
            throw new Error(`${fn}: HTTP ${res.status} ${msg}`);
          }
          // t1 — момент получения ответа: середина RTT для калибровки часов
          const t1 = Date.now();
          const body = await res.json();
          // Калибровка часов — ЕДИНСТВЕННЫЙ источник: серверный now() в теле
          // ответа put_state (не подвержен CORS-ограничениям, точность до мс).
          // Заголовок Date намеренно НЕ используется: в браузере он закрыт
          // CORS-safelist'ом (тесты в Node видели бы то, чего прод не видит),
          // а его секундная гранулярность закрепляла бы грубую первую калибровку.
          try {
            if (fn === "put_state" && typeof body === "string") {
              const serverMs = Date.parse(body);
              if (Number.isFinite(serverMs)) {
                this.setClockSkew(serverMs - (t0 + t1) / 2, t1 - t0);
              }
            }
          } catch (e) {}
          return body;
        }
        static setClockSkew(ms, rtt = Infinity) {
          if (!Number.isFinite(ms)) return;
          const prev = this.clockSkewMs;
          this.clockSkewMs = ms;
          try {
            localStorage.setItem("clockSkewMs", String(Math.round(ms)));
            localStorage.setItem("clockSkewAt", String(Date.now()));
          } catch (e) {}
          // NTP-фильтр: замер с меньшим RTT точнее. Фильтр сбрасывается,
          // если лучший замер устарел (10 мин - часы могли уйти дрейфом)
          // или новый замер отличается прыжком (>30 с - часы перевели).
          const at = Date.now();
          const stale = this.bestSkewAt === null || at - this.bestSkewAt > 600000;
          const jump = Math.abs(ms - this.bestSkewMs) > 30000;
          if (stale || jump || (Number.isFinite(rtt) && rtt < this.bestSkewRtt)) {
            if (Number.isFinite(rtt)) this.bestSkewRtt = rtt;
            this.bestSkewMs = ms;
            this.bestSkewAt = at;
          }
          // Носитель републикует СВОЙ сдвиг при изменении лучшего замера
          // (порог внутри republishSkew) и сразу разносит его force-push'ем;
          // все устройства мягко пересчитывают «Конец»/планы. Скачок СОБСТВЕННЫХ
          // часов (>=2 с) тоже пересчитывает планы - от нового serverNow.
          try {
            const published = TimeZoneHolder.republishSkew();
            if (published || Math.abs(ms - prev) >= 2000) {
              TimeZoneHolder.softRecalc();
            }
            if (published && this.isActive() && !this.reloading) {
              this.pushNow(true);
            }
          } catch (e) {}
        }
        static cloudGet() {
          return this.rpc("get_state", { p_key: this.getKeyHash() });
        }
        static cloudPut(data, options) {
          return this.rpc(
            "put_state",
            { p_key: this.getKeyHash(), p_data: data },
            options
          );
        }

        // --- Пуш / пул ---
        static pushNow(force = false, options = {}) {
          // Операции синхронизации сериализуются через цепочку: быстрый
          // повторный вызов (два управляющих действия подряд) не теряется,
          // а выполняется следующим.
          return this.enqueue(() => this._pushNow(force, options));
        }
        static async _pushNow(force = false, options = {}) {
          if (!this.isActive() || this.reloading) return false;
          try {
            // Сначала фиксируем модель в localStorage, чтобы снимок отражал
            // самые свежие данные (например, задачу, созданную только что,
            // до первого автосохранения — фикс найден E2E-тестом).
            try {
              StorageService.saveToLocalStorage();
            } catch (e) {}
            const snapshot = this.snapshotLocal();
            const contentHash = this.snapshotContentHash(snapshot);
            const meaningful = this.meaningfulHash(snapshot);
            // Отправляем только ОСМЫСЛЕННЫЕ изменения (структура/имена/веса/
            // цели/управление). Шум счётчиков во время трекинга не уходит:
            // вторые устройства выводят их из startTime сами. Раз в минуту —
            // контрольная точка полным снимком (устойчивость к сбоям).
            const tracking = this.parseSnapshotTimers(snapshot).some(
              t => t.isTracking
            );
            const checkpointDue =
              tracking &&
              (localStorage.getItem("trackingOwnerDevice") || "") ===
                this.deviceId() &&
              Date.now() - this.lastPushAtMs > this.CHECKPOINT_MS;
            if (
              !force &&
              meaningful === localStorage.getItem(this.LS_PUSH_PROJ) &&
              !checkpointDue
            ) {
              this.dirty = false; // не изменилось: не дёргаем updated_at в облаке
              this.updateCloudButton();
              return false;
            }
            const updatedAt = await this.cloudPut(snapshot, options);
            localStorage.setItem(this.LS_PUSH_HASH, contentHash);
            localStorage.setItem(this.LS_PUSH_PROJ, meaningful);
            this.lastPushAtMs = Date.now();
            if (updatedAt) {
              localStorage.setItem(this.LS_LAST_SYNC, String(updatedAt));
            }
            this.lastSyncAt = new Date();
            this.lastError = "";
            this.dirty = false;
            this.lastActivityAt = Date.now();
            this.broadcastPing(); // мгновенно будим другие устройства
            this.updateCloudButton();
            return true;
          } catch (err) {
            this.lastError = String((err && err.message) || err);
            this.updateCloudButton();
            return false;
          }
        }
        static pullNow(force = false) {
          return this.enqueue(() => this._pullNow(force));
        }
        static async _pullNow(force = false) {

          //    даже если у самих идёт трекинг;
          //  - remoteSeq == localSeq, управление совпадает, идёт трекинг:
          //    отличия счётчиков — «шум» параллельного вывода — игнорируем;
          //  - remoteSeq == localSeq, никто не трекается: принимаем при любом
          //    отличии содержимого (ручные правки, веса, история);
          //  - remoteSeq < localSeq или расхождение управления при равных seq:
          //    локальное состояние новее — не принимаем (наш push победит).
          if (!this.isActive() || this.reloading) return false;
          try {
            const row = await this.cloudGet();
            this.lastSyncAt = new Date();
            this.lastError = "";
            if (!row || !row.data) {
              this.updateCloudButton();
              return false; // в облаке пока пусто
            }
            if (row.updated_at) {
              localStorage.setItem(this.LS_LAST_SYNC, String(row.updated_at));
            }
            const remote = row.data;
            const local = this.snapshotLocal();
            // Сдвиг часов носителя принимается СРАЗУ (в обход минутного
            // квантования meaningful-проекции и троттлинга перезагрузок):
            // «Конец»/планы не должны ждать окна приёма. Это же устраняет
            // затирание: следующий push несёт уже свежее значение.
            if (this.adoptHolderSkew(remote)) {

            }
            // «Мёртвый владелец»: зеркалим чужой трекинг, но облачная запись
            // давно не обновлялась (владелец закрылся, не нажав «Пауза»).
            // Возраст — по СЕРВЕРНОМУ updated_at с поправкой на часы; свёртка —
            // по метке владельца (она на одних часах с его startTime).
            if (!force) {
              const owner = remote.trackingOwnerDevice || "";
              const remoteTracking = this.parseSnapshotTimers(remote).some(
                t => t.isTracking
              );
              const localTracking = AppState.getTimers().some(
                t => t.isTracking
              );
              // Возраст сессии — по «сердцебиению» владельца (lastSaveAt,
              // серверная система отсчёта): он не зависит от чужих часов и
              // не освежается калибровочным эхо-путом (в отличие от
              // серверного updated_at). Резерв — updated_at записи.
              const heartbeat = Number(remote.lastSaveAt) || 0;
              const ageOf = () => {
                if (heartbeat > 0) return this.correctedNow() - heartbeat;
                return row.updated_at
                  ? this.correctedNow() - Date.parse(row.updated_at)
                  : 0;
              };
              let ageMs = ageOf();
              const foldCandidate =
                remoteTracking &&
                localTracking &&
                owner &&
                owner !== this.deviceId() &&
                ageMs > this.ABANDON_MS &&
                Date.now() - this.lastPushAtMs > this.ABANDON_MS &&
                this.controlProjection(remote) ===
                  this.controlProjection(local);
              if (
                foldCandidate &&
                localStorage.getItem("clockSkewMs") === null
              ) {
                // Свои часы ещё не откалиброваны — ageMs недостоверен:
                // устройство со сбитыми часами приняло бы ЖИВУЮ сессию за
                // мёртвую. Калибруемся эхо-путом (запись возвращается в
                // облако НЕИЗМЕННОЙ: данные и сердцебиение владельца целы,
                // освежается лишь серверная метка времени), затем пересчёт.
                try {
                  await this.cloudPut(remote, {});
                } catch (e) {}
                if (localStorage.getItem("clockSkewMs") === null) {
                  this.updateCloudButton();
                  return false; // калибровка не вышла — решение отложено
                }
                ageMs = ageOf();
              }
              if (
                foldCandidate &&
                localStorage.getItem("clockSkewMs") !== null &&
                ageMs > this.ABANDON_MS
              ) {
                const foldMs = Number(remote.lastSaveAt);
                const foldAt =
                  Number.isFinite(foldMs) && foldMs > 0
                    ? new Date(foldMs)
                    : null;
                AppState.getTimers().forEach(t => {
                  if (t.isTracking) TimerModel.pauseAt(t, foldAt);
                });
                this.clearTrackingOwner();
                AppState.notify("displayNeedsUpdate");
                this.bumpControl(true); // пауза уходит в облако
                this.updateCloudButton();
                return false;
              }
            }
            const cloudContent = this.snapshotContentHash(remote);
            const localContent = this.snapshotContentHash(local);
            const remoteSeq = Number(remote.controlSeq || 0);
            const localSeq = this.localSeq();
            let adopt = false;
            let controlNewer = false;
            if (cloudContent === localContent) {
              adopt = false;
            } else if (force) {
              adopt = true;
            } else if (remoteSeq > localSeq) {
              adopt = true;
              controlNewer = true;
            } else if (remoteSeq === localSeq) {
              // Принимаем только ОСМЫСЛЕННЫЕ отличия (структура/имена/веса/
              // цели) и только если облачная запись — не эхо нашего
              // последнего пуша (иначе старая копия откатила бы локальную
              // правку, которую мы ещё не отправили). Шум счётчиков/планов
              // поводом не является: устройства сходятся к нему сами.
              const meaningfulDiffers =
                this.meaningfulHash(remote) !== this.meaningfulHash(local);
              const foreign =
                cloudContent !== localStorage.getItem(this.LS_PUSH_HASH);
              adopt = meaningfulDiffers && foreign;
            }
            if (!adopt) {
              if (cloudContent === localContent) {
                localStorage.setItem(this.LS_PUSH_HASH, cloudContent);
                this.dirty = false;
              }
              this.updateCloudButton();
              return false;
            }
            if (
              !force &&
              (!this.canAutoApply(controlNewer) ||
                !this.reloadAllowed(controlNewer))
            ) {
              // Приём отложен (троттлинг/модалка/ввод) — назначаем быстрый
              // ретрай, а не ждём периодического тика. Это же сводит гонку
              // одновременных заявок носителя часового пояса за секунды.
              this.scheduleControlRetry();
              this.updateCloudButton();
              return false;
            }
            // Защита: пока идёт перезагрузка, тики не должны затереть
            // принятые данные старой копией из памяти
            this.reloading = true;
            this.applySnapshot(remote);
            localStorage.setItem(this.LS_PUSH_HASH, cloudContent);
            this.updateCloudButton();
            return true;
          } catch (err) {
            this.lastError = String((err && err.message) || err);
            this.updateCloudButton();
            return false;
          }
        }
        static canAutoApply(controlNewer = false) {
          // Не подменяем локальное состояние перезагрузкой, пока открыто
          // модальное окно или пользователь печатает в поле. Локальный
          // трекинг больше не блокирует приём: счётчики выводятся из
          // startTime, а чужое управляющее действие важнее.
          try {
            if (ModalController.isOpen()) return false;
            const active = document.activeElement;
            if (active && active.tagName === "INPUT") return false;
          } catch (e) {}
          return true;
        }
        static reloadAllowed(controlNewer = false) {
          // Защита от «шторма перезагрузок»: обычный автоприём не чаще
          // раза в 30 с; управляющее действие — не чаще раза в 2,5 с
          const last = Number(sessionStorage.getItem("cloudReloadAt") || 0);
          return Date.now() - last >= (controlNewer ? 2500 : 30000);
        }
        static async calibrateClock() {
          // Однократный калибровочный push: измеряет расхождение часов по
          // серверному времени из ответа put_state. Выполняется в очереди
          // после других операций; пропускается, если калибровка уже есть.
          if (!this.isActive() || localStorage.getItem("clockSkewMs")) {
            return false;
          }
          return this.pushNow(true);
        }
        static scheduleControlRetry() {
          if (this._pendingControlRetry) return;
          this._pendingControlRetry = setTimeout(() => {
            this._pendingControlRetry = null;
            if (!this.reloading) this.tick();
          }, 1500);
        }
        static reloadForSync(force = false) {
          if (!force && !this.reloadAllowed()) return;
          sessionStorage.setItem("cloudReloadAt", String(Date.now()));
          location.reload();
        }
        static reloadAfterAdopt() {
          // Данные уже приняты в localStorage (pullNow прошёл все проверки,
          // включая троттлинг) — перезагружаемся безусловно. Повторная
          // проверка троттлинга здесь раньше оставляла страницу «зомби»
          // с reloading=true без перезагрузки: синхронизация навсегда
          // блокировалась до ручного обновления.
          sessionStorage.setItem("cloudReloadAt", String(Date.now()));
          location.reload();
        }

        // --- Запуск и фоновая работа ---
        static async boot() {
          if (!this.isConfigured() || this.isDisabled()) {
            this.updateCloudButton();
            return;
          }
          if (!this.getKeyHash()) {
            CloudController.openKeyModal(true); // первый запуск: спросить ключ
            return;
          }
          this.loadSkew();
          this.initRealtime(); // fire-and-forget
          const applied = await this.pullNow();
          if (applied) {
            this.reloadAfterAdopt();
          } else {
            TimeZoneHolder.ensure(); // носитель есть всегда
            this.calibrateClock();
          }
          this.updateCloudButton();
        }
        static startPeriodic() {
          if (this.periodicTimer) return;
          this.scheduleNext();
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
              this.tick().finally(() => {
                if (!this.reloading) this.scheduleNext();
              });
            }
          });
          window.addEventListener("beforeunload", () => {
            // Последний шанс отправить изменения (keepalive — запрос
            // доживает после закрытия страницы)
            if (this.isActive() && this.dirty && !this.reloading) {
              this.pushNow(false, { keepalive: true });
            }
          });
        }
        static async tick() {
          if (!this.isActive() || this.reloading) return;
          this.initRealtime(); // fire-and-forget: подключение/ретрай
          // 1. СНАЧАЛА тянем из облака: чужое управляющее действие
          //    (секвенция новее) имеет приоритет над локальными изменениями —
          //    push не должен затереть его устаревшим состоянием.
          const applied = await this.pullNow();
          if (applied) {
            this.reloadAfterAdopt();
            return; // страница перезагружается с принятым состоянием
          }
          // 2. Затем отправляем локальные изменения: pushNow сам фиксирует
          //    модель в localStorage и отправляет снимок только при отличии.
          await this.pushNow();
        }
        static interactiveSync() {
          // Логика «Обновить»: любой клик, получение/потеря фокуса полем
          // вызывают немедленную синхронизацию (push + pull) с дебаунсом —
          // серия быстрых действий сливается в один обмен. В полном простое
          // работает обычный тик раз в syncIntervalMs.
          if (!this.isActive() || this.reloading) return;
          this.lastActivityAt = Date.now();
          if (this._interactiveDebounce) {
            clearTimeout(this._interactiveDebounce);
          }
          this._interactiveDebounce = setTimeout(() => {
            this._interactiveDebounce = null;
            this.tick();
          }, 700);
        }
        // --- Supabase Realtime: broadcast-пинги для мгновенной доставки ---
        // Если Realtime недоступен (офлайн, заблокирован CDN, среда без
        // ES-модулей) — молча остаётся опрос (тик), он же адаптивный.
        static async loadRealtimeModule() {
          return import("https://cdn.jsdelivr.net/npm/@supabase/realtime-js@2/+esm");
        }
        static async initRealtime() {
          if (!this.isActive() || this.rtReady) return;
          if (this.rtFailed) {
            if (Date.now() < this.rtRetryAt) return;
            this.rtFailed = false;
          }
          try {
            const mod = await this.loadRealtimeModule();
            const RealtimeClient =
              (mod &&
                (mod.RealtimeClient ||
                  (mod.default && mod.default.RealtimeClient))) ||
              null;
            if (!RealtimeClient) throw new Error("RealtimeClient not found");
            const wsBase =
              String(CLOUD_CONFIG.url).replace(/\/+$/, "").replace(/^http/, "ws") +
              "/realtime/v1";
            const client = new RealtimeClient(wsBase, {
              params: { apikey: CLOUD_CONFIG.anonKey },
            });
            // Имя канала = хэш ключа синхронизации: без ключа канал не найти
            const channel = client.channel(`sync-${this.getKeyHash()}`);
            channel.on("broadcast", { event: "ping" }, msg => {
              this.onRemotePing(msg && msg.payload);
            });
            // subscribe() резолвится объектом канала, а не статусом —
            // надёжно ждём результат через callback со своим таймаутом
            await new Promise((resolve, reject) => {
              const guard = setTimeout(
                () => reject(new Error("subscribe timeout")),
                10000
              );
              channel.subscribe((status, err) => {
                clearTimeout(guard);
                if (status === "SUBSCRIBED") resolve(status);
                else reject(err || new Error(String(status)));
              });
            });
            this.rt = client;
            this.rtChannel = channel;
            this.rtReady = true;
          } catch (e) {
            this.rtFailed = true;
            this.rtRetryAt = Date.now() + 30000; // редкие ретраи, без штурма
          }
        }
        static onRemotePing(payload) {
          // Свои собственные пинги игнорируем (устройство помечено в payload)
          if (payload && payload.device && payload.device === this.deviceId()) {
            return;
          }
          this.lastActivityAt = Date.now();
          this.tick(); // немедленный pull(+push) — как по действию пользователя
        }
        static broadcastPing() {
          if (!this.rtReady || !this.rtChannel) return;
          try {
            const sent = this.rtChannel.send({
              type: "broadcast",
              event: "ping",
              payload: {
                device: this.deviceId(),
                seq: this.localSeq(),
                at: Date.now(),
              },
            });
            if (sent && typeof sent.catch === "function") sent.catch(() => {});
          } catch (e) {}
        }
        static teardownRealtime() {
          try {
            if (this.rtChannel && this.rtChannel.unsubscribe) {
              this.rtChannel.unsubscribe();
            }
            if (this.rt && this.rt.disconnect) this.rt.disconnect();
          } catch (e) {}
          this.rt = null;
          this.rtChannel = null;
          this.rtReady = false;
        }
        static currentPollDelay() {
          const base = Number(CLOUD_CONFIG.syncIntervalMs) || 20000;
          // С работающим Realtime мгновенность обеспечивают пинги — редкий
          // опрос лишь страховка. Без Realtime ускоряемся, когда идёт трекинг
          // или была недавняя активность.
          if (this.rtReady) return base;
          try {
            const tracking = AppState.getTimers().some(t => t.isTracking);
            const recent = Date.now() - this.lastActivityAt < 60000;
            if (tracking || recent) return Math.min(4000, base);
          } catch (e) {}
          return base;
        }
        static scheduleNext() {
          if (this.periodicTimer) clearTimeout(this.periodicTimer);
          this.periodicTimer = setTimeout(() => {
            this.periodicTimer = null;
            this.tick().finally(() => {
              if (!this.reloading) this.scheduleNext();
            });
          }, this.currentPollDelay());
        }
        static onLocalSaved() {
          if (!this.isActive()) return;
          const contentHash = this.snapshotContentHash(this.snapshotLocal());
          this.dirty = contentHash !== localStorage.getItem(this.LS_PUSH_HASH);
          this.updateCloudButton();
          // Дебаунс-пуш вскоре после сохранения, не дожидаясь следующего тика
          if (this.dirty && !this._saveDebounce) {
            this._saveDebounce = setTimeout(() => {
              this._saveDebounce = null;
              this.pushNow();
            }, 3000);
          }
        }
        static updateCloudButton() {
          const btn = document.getElementById("cloudButton");
          if (!btn) return;
          btn.classList.toggle("has-error", Boolean(this.lastError));
          btn.classList.toggle(
            "synced",
            !this.lastError && !this.dirty && this.isActive()
          );
          btn.title = !this.isActive()
            ? "Облако: не настроено или отключено"
            : this.lastError
              ? `Облако: ошибка — ${this.lastError}`
              : this.dirty
                ? "Облако: есть неотправленные изменения"
                : `Облако: синхронизировано (ключ ${this.keyFingerprint()})`;
        }
      }
      // ============================================================
      //  Носитель часового пояса — единый источник истины для трактовки
      //  «Конца» (ЧЧ:ММ) на всех устройствах. Все устройства трактуют
      //  синхронизированное время в зоне носителя, поэтому «Осталось»,
      //  «План» и суточный сброс у всех идентичны. Кнопка носителя зелёная
      //  у владельца и красная у остальных; клик — мгновенный перехват
      //  (управляющее действие: push + Realtime-пинг). Правка «Конца»
      //  носителя НЕ меняет: значение всегда трактуется в зоне носителя.
      // ============================================================
      class TimeZoneHolder {
        static LS_DEVICE = "tzHolderDevice";
        static LS_ZONE = "tzHolderZone";
        static localZone() {
          try {
            return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
          } catch (e) {
            return "UTC";
          }
        }
        static zone() {
          // Зона носителя; пока носителя нет (локальный режим) — своя зона
          return localStorage.getItem(this.LS_ZONE) || this.localZone();
        }
        static holderSkewMs() {
          // Расхождение часов носителя с серверным временем (server - local;
          // у спешащих часов - отрицательное). Часы носителя могут быть
          // сбиты произвольно - «Конец» привязан именно к ним.
          // ЕДИНЫЙ источник для ВСЕХ устройств (включая носителя) -
          // ОПУБЛИКОВАННОЕ значение: раньше носитель считал «Конец» по живой
          // калибровке (джиттер RTT), а зеркала - по опубликованной, поэтому
          // «План»/«Осталось» расходились на секунды даже в покое.
          const raw = localStorage.getItem("tzHolderSkewMs");
          if (raw !== null) {
            const v = Number(raw);
            if (Number.isFinite(v)) return v;
          }
          if (this.isHolder()) {
            return Math.round(CloudSync.bestSkewMs / 1000) * 1000;
          }
          return 0;
        }
        static republishSkew(force = false) {
          // Носитель публикует расхождение СВОИХ часов (в LS, оттуда - в
          // состояние). Берётся лучший замер (минимальный RTT); гистерезис
          // 2 с гасит остаточный джиттер, но реальный дрейф часов
          // публикуется. true = опубликованное значение изменилось.
          if (!this.isHolder()) return false;
          try {
            // Источник: лучший замер этой инстанции; до первого замера -
            // ПЕРСИСТЕНТНАЯ калибровка из LS (serverNow грузит её лениво),
            // а не нулевое начальное значение фильтра. Иначе носитель на
            // каждой перезагрузке публиковал бы 0 до первого put_state, и
            // зеркала перевызвали бы «Конец» на минуты (ровно тот баг,
            // из-за которого «План»/«Осталось» расходились).
            const live = Math.round(
              (CloudSync.bestSkewAt !== null
                ? CloudSync.bestSkewMs
                : CloudSync.serverNow() - Date.now()) /
                1000
            ) * 1000;
            const raw = localStorage.getItem("tzHolderSkewMs");
            const pub = raw === null ? NaN : Number(raw);
            if (Number.isFinite(pub)) {
              if (pub === live) return false;
              // Порог 1 с: лучший замер (минимальный RTT) стабилен, поэтому
              // секундная коррекция публикации безопасна и не даёт «Концу»
              // расходиться между устройствами на видимые секунды
              if (!force && Math.abs(live - pub) < 1000) return false;
            }
            localStorage.setItem("tzHolderSkewMs", String(live));
            return true;
          } catch (e) {
            return false;
          }
        }
        static softRecalc() {
          // Мягкий пересчёт ЖИВОЙ модели после изменения сдвига часов:
          // «Конец» перевызывается заново, планы пересчитываются. Без
          // сохранения и пуша - планы не входят в meaningful-проекцию,
          // шторма синхронизации не будет. В away-режиме распределение
          // заморожено (как в autoUpdate) - не трогаем.
          try {
            if (CloudSync.reloading) return;
            if (AppState.isAwayModeActive()) return;
            TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
            this.updateUI();
            AppState.notify("displayNeedsUpdate");
          } catch (e) {}
        }
        static endEpoch(hours, minutes, fromMs) {
          // Момент, когда ЧАСЫ носителя (его зона + их сдвиг) показывают
          // hours:minutes — единый «Конец» для всех устройств
          return (
            this.zonedTimeToEpoch(hours, minutes, this.zone(), fromMs) +
            this.holderSkewMs()
          );
        }
        static localEquivalentHHMM(epochMs) {
          // Что показывают ЧАСЫ этого устройства (в его зоне) в момент
          // epochMs. Округление до секунд: «Конец» попадает ровно в минуту,
          // и миллисекундный шум собственной калибровки (20:54:59.999)
          // не должен переворачивать отображаемую минуту (20:54).
          const own = Math.round((epochMs - CloudSync.clockSkewMs) / 1000) * 1000;
          return this.formatHHMM(own, this.localZone());
        }
        static holderDevice() {
          return localStorage.getItem(this.LS_DEVICE) || "";
        }
        static isHolder() {
          const d = this.holderDevice();
          return !d || d === CloudSync.deviceId();
        }
        static zoneOffsetMs(zone, atMs) {
          // Смещение зоны от UTC в данный момент (учитывает летнее время)
          const dtf = new Intl.DateTimeFormat("en-US", {
            timeZone: zone,
            hour12: false,
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
          const parts = {};
          for (const part of dtf.formatToParts(new Date(atMs))) {
            parts[part.type] = part.value;
          }
          const asUTC = Date.UTC(
            Number(parts.year),
            Number(parts.month) - 1,
            Number(parts.day),
            Number(parts.hour) % 24,
            Number(parts.minute),
            Number(parts.second)
          );
          return asUTC - Math.floor(atMs / 1000) * 1000;
        }
        static zonedTimeToEpoch(hours, minutes, zone, fromMs) {
          // Ближайшее (строго после fromMs) вхождение hours:minutes в зоне.
          // Двухпроходный расчёт: первое приближение уточняется смещением
          // в полученной точке (корректно на границах летнего времени).
          const dtf = new Intl.DateTimeFormat("en-US", {
            timeZone: zone,
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          });
          const parts = {};
          for (const part of dtf.formatToParts(new Date(fromMs))) {
            parts[part.type] = part.value;
          }
          const y = Number(parts.year);
          const mo = Number(parts.month) - 1;
          const d = Number(parts.day);
          const resolve = day => {
            const guess = Date.UTC(y, mo, day, hours, minutes);
            let epoch = guess - this.zoneOffsetMs(zone, guess);
            epoch = guess - this.zoneOffsetMs(zone, epoch);
            return epoch;
          };
          let epoch = resolve(d);
          if (epoch <= fromMs) epoch = resolve(d + 1);
          return epoch;
        }
        static formatHHMM(epochMs, zone) {
          try {
            return new Intl.DateTimeFormat("ru-RU", {
              timeZone: zone,
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            }).format(new Date(epochMs));
          } catch (e) {
            return "";
          }
        }
        static claim(recalc = true) {
          // Перехват носительства: мгновенная рассылка всем устройствам
          localStorage.setItem(this.LS_DEVICE, CloudSync.deviceId());
          localStorage.setItem(this.LS_ZONE, this.localZone());
          this.republishSkew(true);
          if (recalc && AppState.getGlobalEndTimeFromUI()) {
            // Планы пересчитываются от новой трактовки «Конца»
            TimeManager.updateGlobalEndTimeAndPlans(null, null, true);
          }
          this.updateUI();
          CloudSync.bumpControl();
        }
        static ensure() {
          // Носитель есть всегда: если в состоянии его нет — заявляем себя
          if (CloudSync.isActive() && !this.holderDevice()) {
            this.claim(false);
          }
          this.updateUI();
        }
        static updateUI() {
          const btn = document.getElementById("tzHolderButton");
          const iAm = this.isHolder();
          const zone = this.zone();
          if (btn) {
            btn.classList.toggle("tz-holder", iAm);
            btn.classList.toggle("tz-follower", !iAm);
            btn.title = iAm
              ? `Вы — носитель времени (${zone}): «Конец» и все расчёты идут по вашим часам. Клик на другом устройстве передаст носительство.`
              : `Носитель времени — другое устройство (${zone}): «Конец» трактуется по его часам. Нажмите, чтобы перехватить.`;
          }
          const hint = document.getElementById("tzHint");
          if (hint) {
            const value = AppState.getGlobalEndTimeFromUI();
            const m = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(value || "");
            if (m && !iAm) {
              // Момент «Конца» по часам носителя -> что он значит на часах
              // этого устройства (его зона + поправка его собственных часов)
              const epoch = this.endEpoch(
                Number(m[1]),
                Number(m[2]),
                CloudSync.serverNow()
              );
              hint.textContent = `у вас: ${this.localEquivalentHHMM(epoch)}`;
            } else {
              hint.textContent = "";
            }
          }
        }
      }
      class CloudController {
        // Модальное окно облака: статус, ключ, ручные операции
        static openModal() {
          const M = ModalController;
          const box = M.box();
          box.innerHTML = "";
          box.appendChild(
            M.el("div", { class: "modal-title" }, "☁ Облачная синхронизация")
          );
          if (!CloudSync.isConfigured()) {
            box.appendChild(
              M.el(
                "div",
                {},
                "Облако не настроено. Откройте этот файл в редакторе и впишите в CLOUD_CONFIG (в начале скрипта) Project URL и anon key из Supabase — подробная инструкция в DEPLOY.md."
              )
            );
            const row = M.el("div", { class: "modal-row" });
            row.appendChild(
              M.el("button", { "data-modal-action": "cancel" }, "Закрыть")
            );
            box.appendChild(row);
            M.context = { type: "cloud" };
            M.open();
            return;
          }
          const status = M.el("div", { class: "cloud-status" });
          status.appendChild(
            M.el(
              "div",
              {},
              CloudSync.getKeyHash()
                ? `Ключ синхронизации: задан (отпечаток ${CloudSync.keyFingerprint()} — на всех устройствах должен совпадать)`
                : "Ключ синхронизации: не задан"
            )
          );
          status.appendChild(
            M.el(
              "div",
              {},
              `Облако на этом устройстве: ${
                CloudSync.isDisabled() ? "отключено" : "включено"
              }`
            )
          );
          const lastSync =
            CloudSync.lastSyncAt ||
            localStorage.getItem(CloudSync.LS_LAST_SYNC);
          status.appendChild(
            M.el(
              "div",
              {},
              `Последняя синхронизация: ${CloudSync.formatSyncTime(lastSync)}`
            )
          );
          status.appendChild(
            M.el("div", {}, `Версия приложения: ${APP_VERSION}`)
          );
          box.appendChild(status);
          box.appendChild(M.errorRow());
          M.setError(CloudSync.lastError || "");
          const row1 = M.el("div", { class: "modal-row" });
          row1.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cloud-sync-now",
              },
              "Синхронизировать сейчас"
            )
          );
          row1.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cloud-set-key",
              },
              "Задать/сменить ключ"
            )
          );
          box.appendChild(row1);
          const row2 = M.el("div", { class: "modal-row" });
          row2.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cloud-force-push",
              },
              "Выгрузить в облако"
            )
          );
          row2.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cloud-force-pull",
              },
              "Загрузить из облака"
            )
          );
          box.appendChild(row2);
          const row3 = M.el("div", { class: "modal-row" });
          row3.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cloud-toggle-disable",
              },
              CloudSync.isDisabled()
                ? "Включить облако"
                : "Отключить на этом устройстве"
            )
          );
          row3.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cancel",
              },
              "Закрыть"
            )
          );
          box.appendChild(row3);
          M.context = { type: "cloud" };
          M.open();
        }
        static openKeyModal(isFirst) {
          const M = ModalController;
          const box = M.box();
          box.innerHTML = "";
          box.appendChild(
            M.el(
              "div",
              { class: "modal-title" },
              isFirst
                ? "Облачная синхронизация — настройка ключа"
                : "Задать/сменить ключ синхронизации"
            )
          );
          box.appendChild(
            M.el(
              "div",
              {},
              "Придумайте ключ синхронизации (кодовую фразу, минимум 4 символа) и введите его на всех своих устройствах одинаково. Сам ключ на сервер не уходит — хранится только его хэш, который служит «адресом» вашей записи в облаке."
            )
          );
          const row = M.el("div", { class: "modal-row" });
          row.appendChild(
            M.el("input", {
              type: "password",
              id: "cloudKeyInput",
              placeholder: "Ключ синхронизации",
            })
          );
          box.appendChild(row);
          box.appendChild(M.errorRow());
          const btnRow = M.el("div", { class: "modal-row" });
          btnRow.appendChild(
            M.el(
              "button",
              {
                id: "cloudKeyConfirm",
                "data-modal-action": "cloud-key-confirm",
              },
              "Сохранить и синхронизировать"
            )
          );
          btnRow.appendChild(
            M.el(
              "button",
              { "data-modal-action": isFirst ? "cloud-skip" : "cancel" },
              isFirst ? "Продолжить без облака" : "Отмена"
            )
          );
          box.appendChild(btnRow);
          M.context = { type: "cloud-key" };
          M.open();
          const input = document.getElementById("cloudKeyInput");
          if (input) setTimeout(() => input.focus(), 50);
        }
        static async handleAction(action) {
          const M = ModalController;
          try {
            if (action === "cloud-set-key") {
              this.openKeyModal(false);
              return;
            }
            if (action === "cloud-skip") {
              CloudSync.setDisabled(true);
              M.close();
              CloudSync.updateCloudButton();
              return;
            }
            if (action === "cloud-key-confirm") {
              const input = document.getElementById("cloudKeyInput");
              const pass = ((input && input.value) || "").trim();
              if (pass.length < 4) {
                M.setError("Ключ слишком короткий (минимум 4 символа)");
                return;
              }
              await CloudSync.setKeyFromPassphrase(pass);
              M.close();
              // Если в облаке уже есть данные под этим ключом — принимаем их
              // (и перезагружаемся); иначе выгружаем локальное состояние.
              const row = await CloudSync.cloudGet();
              if (row && row.data) {
                CloudSync.reloading = true;
                CloudSync.applySnapshot(row.data);
                localStorage.setItem(
                  CloudSync.LS_PUSH_HASH,
                  CloudSync.snapshotContentHash(row.data)
                );
                if (row.updated_at) {
                  localStorage.setItem(
                    CloudSync.LS_LAST_SYNC,
                    String(row.updated_at)
                  );
                }
                location.reload();
              } else {
                TimeZoneHolder.ensure(); // первый запуск: заявить носителя
                await CloudSync.pushNow(true);
                this.openModal();
              }
              return;
            }
            if (action === "cloud-sync-now") {
              M.close();
              await CloudSync.pushNow();
              const applied = await CloudSync.pullNow(true);
              if (applied) CloudSync.reloadForSync(true);
              else this.openModal();
              return;
            }
            if (action === "cloud-force-push") {
              await CloudSync.pushNow(true);
              this.openModal();
              return;
            }
            if (action === "cloud-force-pull") {
              M.close();
              const applied = await CloudSync.pullNow(true);
              if (applied) CloudSync.reloadForSync(true);
              else this.openModal();
              return;
            }
            if (action === "cloud-toggle-disable") {
              if (CloudSync.isDisabled()) {
                CloudSync.setDisabled(false);
                if (!CloudSync.getKeyHash()) {
                  this.openKeyModal(false);
                  return;
                }
              } else {
                CloudSync.setDisabled(true);
              }
              CloudSync.updateCloudButton();
              this.openModal();
              return;
            }
          } catch (err) {
            CloudSync.lastError = String((err && err.message) || err);
            this.openModal();
          }
        }
      }
    </script>
