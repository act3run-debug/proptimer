<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Пропорциональный таймер</title>
    <style>
      html,
      body {
        height: 100%;
        min-height: 100%;
      }
      body {
        background-color: #000000;
        color: #e0e0e0;
        margin: 0;
        padding: 0;
        font-family: Consolas, monospace;
      }
      .timer-container {
        border: 1px solid #ffffff;
        padding: 15px;
        margin: 10px;
        border-radius: 5px;
        background-color: #000000;
        flex: 0 1 auto;
        min-width: 300px;
        max-width: 450px;
      }
      .timer-controls {
        margin: 10px 0;
      }
      input[type="number"],
      input[type="text"],
      input[type="time"] {
        width: 60px;
        background-color: #000000;
        color: #e0e0e0;
        border: 1px solid #444;
        padding: 5px;
      }
      .time-display {
        font-size: 1.2em;
        margin: 5px 0;
      }
      button {
        margin: 0 5px;
        padding: 5px 10px;
        background-color: #000000;
        color: #e0e0e0;
        border: 1px solid #444;
        cursor: pointer;
      }
      button:hover {
        background-color: #222222;
      }
      #globalEndTime {
        margin: 10px;
        padding: 5px;
      }
      button.active-away {
        background-color: #555 !important;
      }
      #globalControls {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: #000000;
        padding: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        display: flex;
        align-items: center;
      }
      #timersContainer {
        margin-top: 60px;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
      }
      #appTitle {
        color: #4caf50;
        font-size: 22px;
        font-weight: bold;
        margin-right: 15px;
      }
      /* Фикс (интерфейс): единый стиль подписей полей — подпись всегда
         рядом со своим полем, выровнены в колонку */
      .field-label {
        display: inline-block;
        min-width: 170px;
        color: #4caf50;
        margin-right: 6px;
      }
      .name-input-container input[type="text"] {
        width: 200px;
      }
      .name-input-container,
      .proportion-container,
      .target-container,
      .tracked-inputs-container,
      .total-inputs-container,
      .recommendation-display-container,
      .priority-display-container,
      .actual-proportion-container,
      .buttons-container {
        margin: 6px 0;
      }
      /* Операции: кнопка меню справа, выпадающее меню, модальные окна,
         подсветка сиблингов разбиения */
      #menuButton {
        margin-left: auto;
      }
      #operationsMenu {
        position: absolute;
        top: 100%;
        right: 10px;
        background-color: #000000;
        border: 1px solid #444;
        display: none;
        flex-direction: column;
        z-index: 1200;
      }
      #operationsMenu.visible {
        display: flex;
      }
      #operationsMenu button {
        margin: 4px;
        text-align: left;
        white-space: nowrap;
      }
      #modalOverlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.75);
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #modalOverlay.hidden {
        display: none;
      }
      #modalBox {
        background: #111111;
        border: 1px solid #4caf50;
        border-radius: 6px;
        padding: 16px;
        min-width: 320px;
        max-width: 90%;
        max-height: 80vh;
        overflow: auto;
      }
      .modal-title {
        color: #4caf50;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .modal-row {
        margin: 8px 0;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .modal-error {
        color: #ff6b6b;
        min-height: 1.2em;
        margin: 6px 0;
      }
      .cloud-status div {
        margin: 2px 0;
      }
      .cloud-action-btn {
        flex: 1;
        white-space: nowrap;
      }
      #cloudButton.has-error {
        border-color: #ff6b6b;
        color: #ff6b6b;
      }
      #cloudButton.synced {
        border-color: #4caf50;
      }
      .group-select-item {
        display: block;
        margin: 4px 0;
      }
      .split-share {
        color: #4caf50;
        border: 1px dashed #4caf50;
        border-radius: 4px;
        padding: 2px 6px;
        cursor: help;
        display: inline-block;
      }
      .sibling-highlight {
        border-color: #4caf50 !important;
        box-shadow: 0 0 8px #4caf50;
      }
    </style>
  </head>
  <body>
    <div id="globalControls">
      <div id="appTitle">physus</div>
      <label> Конец: <input type="time" id="globalEndTime" /> </label>
      <button data-action="add-timer">+ Добавить таймер</button>
      <button id="awayButton" data-action="toggle-away">Отошёл</button>
      <button id="saveTimersToLocalStorageManually" data-action="save">
        Сохранить
      </button>
      <button id="exportButton" data-action="export">Экспорт</button>
      <button id="importButton" data-action="import">Импорт</button>
      <button
        id="cloudButton"
        data-action="cloud"
        title="Облачная синхронизация (Supabase)"
      >
        ☁ Облако
      </button>
      <button id="menuButton" data-action="menu" title="Операции со списком задач">
        ☰ Операции
      </button>
      <div id="operationsMenu">
        <button data-action="create-in-group">Создать задачу внутри группы</button>
      </div>
    </div>
    <div id="timersContainer"></div>
    <div id="modalOverlay" class="hidden">
      <div id="modalBox"></div>
    </div>
    <script>
      // ============================================================
      //  ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ (Supabase) — инструкция в DEPLOY.md.
      //  Впишите Project URL и anon key ниже. Пока они пустые,
      //  приложение работает в чисто локальном режиме (как раньше).
      // ============================================================
      const CLOUD_CONFIG = {
        url: "https://iqvqjiwjizlzronudgui.supabase.co",
        anonKey: "sb_publishable_da50tn1zQ9kDLuf0UsdAiw_yzMelb7J", // publishable key (безопасен для браузера)
        syncIntervalMs: 20000, // интервал фоновой синхронизации, мс
      };
      class NotificationService {
        static initializeNotificationSystem() {
          Notification.requestPermission();
        }
        static checkNotificationPermission() {
          return Notification.permission === "granted";
        }
        static showNotification(title, message) {
          if (this.checkNotificationPermission()) {
            new Notification(title, {
              body: message,
            });
          }
        }
        static notifyTaskCompleted(taskName) {
          this.showNotification(
            "Prep Task Completed",
            `Task "${taskName}" completed`
          );
        }
      }
      class EventService {
        static setupEventDelegation() {
          const timersContainer = AppState.getTimersContainerElement();
          timersContainer.addEventListener(
            "click",
            this.handleTimersContainerClick
          );
          timersContainer.addEventListener(
            "change",
            this.handleTimersContainerChange
          );
          // Автообновление при получении/потере фокуса поля ввода
          timersContainer.addEventListener(
            "focusin",
            this.handleFieldFocusTrigger
          );
          timersContainer.addEventListener(
            "focusout",
            this.handleFieldFocusTrigger
          );
          const globalControls = document.getElementById("globalControls");
          globalControls.addEventListener(
            "click",
            this.handleGlobalControlsClick
          );
          globalControls.addEventListener(
            "focusin",
            this.handleFieldFocusTrigger
          );
          globalControls.addEventListener(
            "focusout",
            this.handleFieldFocusTrigger
          );
          // Подсветка сиблингов разбиения при наведении на «Долю»
          timersContainer.addEventListener(
            "mouseover",
            this.handleTimersContainerMouseOver
          );
          timersContainer.addEventListener(
            "mouseout",
            this.handleTimersContainerMouseOut
          );
          const globalEndTimeInput = document.getElementById("globalEndTime");
          globalEndTimeInput.addEventListener(
            "input",
            TimerController.handleGlobalEndTimeInput
          );
          document
            .getElementById("modalOverlay")
            .addEventListener("click", ModalController.handleOverlayClick);
        }
        static handleFieldFocusTrigger(event) {
          // «Дать фокус» / «убрать фокус» с поля — триггер автообновления
          if (event.target && event.target.tagName === "INPUT") {
            AppController.autoUpdate();
          }
        }
        static handleTimersContainerClick(event) {
          return TimerController.handleTimersContainerClick(event);
        }
        static handleTimersContainerChange(event) {
          return TimerController.handleTimersContainerChange(event);
        }
        static handleTimersContainerMouseOver(event) {
          const shareEl =
            event.target.closest && event.target.closest(".split-share");
          if (!shareEl) return;
          EventService.highlightSiblings(
            shareEl.getAttribute("data-split-id"),
            true
          );
        }
        static handleTimersContainerMouseOut(event) {
          const shareEl =
            event.target.closest && event.target.closest(".split-share");
          if (!shareEl) return;
          EventService.highlightSiblings(
            shareEl.getAttribute("data-split-id"),
            false
          );
        }
        static highlightSiblings(splitId, on) {
          // Подсвечивает все карточки, созданные в ОДНОМ разбиении (общий splitId)
          if (!splitId) return;
          AppState.getTimers().forEach(t => {
            if (t.splitId === splitId) {
              const card = AppState.getTimerElement(t.id);
              if (card) card.classList.toggle("sibling-highlight", on);
            }
          });
        }
        static handleGlobalControlsClick(event) {
          // Автообновление срабатывает при каждом клике ДО целевого действия
          // (бывшие кнопки «Обновить всё», «Рекомендация»,
          // «Применить рекомендацию» убраны из интерфейса).
          AppController.autoUpdate();
          const target = event.target;
          if (target.tagName === "BUTTON") {
            const action = target.getAttribute("data-action");
            if (action === "add-timer") {
              AddTaskController.openModal();
            } else if (action === "menu") {
              MenuController.toggle();
            } else if (action === "create-in-group") {
              MenuController.hide();
              GroupTaskController.openModal();
            } else if (action === "toggle-away") {
              AppController.toggleAway();
            } else if (action === "save") {
              AppController.saveTimers();
            } else if (action === "export") {
              AppController.exportTimers();
            } else if (action === "import") {
              AppController.importTimers();
            } else if (action === "cloud") {
              CloudController.openModal();
            }
          }
        }
      }
      class SessionManager {
        static isJustAfterReset = false;
        static clearJustAfterResetFlag() {
          this.isJustAfterReset = false;
        }
        static checkForSessionReset() {
          const lastSessionEndTime = AppState.getLastSessionEndTime();
          if (!lastSessionEndTime) return false;
          const now = new Date();
          if (now >= lastSessionEndTime) {
            AppState.setNeedsReset(true);
            return true;
          }
          return false;
        }
        static performSessionReset() {
          if (!AppState.getNeedsReset()) return;
          const timers = AppState.getTimers();
          timers.forEach(timer => {
            timer.lastSessionDisplayProportion =
              ProportionCalculator.getActualProportion(timer.id);
            timer.originalDailyTotalSeconds = timer.dailyTotalSeconds;
            timer.dailyTotalSeconds = 0;
            timer.dailyTrackedSeconds = 0;
            timer.trackedSeconds = 0;
            timer.lastResetTime = new Date();
            if (timer.isTracking) {
              // Идёт отсчёт — новая сессия продолжает его с нуля
              TimerModel.rebaseTracking(timer);
            }
          });
          this.isJustAfterReset = true;
          AppState.setNeedsReset(false);
          // Фикс БАГ #2: сразу сдвигаем границу сессии в будущее, чтобы сброс
          // выполнялся строго один раз. Раньше, если globalEndTime отсутствовал
          // (например, терялся после перезагрузки страницы), needsReset
          // взводился каждый тик и счётчики обнулялись каждые 200 мс.
          this.advanceSessionEndTime();
          AppState.notify("sessionReset");
        }
        static advanceSessionEndTime() {
          const last = AppState.getLastSessionEndTime();
          if (!last) return;
          const now = new Date();
          if (now < last) return;
          const globalEnd = AppState.getGlobalEndTime();
          if (globalEnd && !isNaN(globalEnd.getTime())) {
            const next = new Date(globalEnd.getTime());
            while (next <= now) {
              next.setDate(next.getDate() + 1);
            }
            AppState.setLastSessionEndTime(next);
          } else {
            // Время конца не задано — естественная граница сессии: полночь.
            AppState.setLastSessionEndTime(TimeCalculator.getNextMidnight(now));
          }
        }
        static updateSessionEndTime(globalEndTime) {
          if (globalEndTime) {
            AppState.setLastSessionEndTime(new Date(globalEndTime));
          }
        }
        static checkAndPerformReset() {
          this.checkForSessionReset();
          this.performSessionReset();
        }
      }
      class AppController {
        static init() {
          TimerView.init();
          StorageService.loadTimersFromLocalStorage();
          SessionManager.checkForSessionReset();
          EventService.setupEventDelegation();
          this.setupIntervalUpdates();
          this.setupEventSubscriptions();
        }
        static setupIntervalUpdates() {
          setInterval(() => CalculationService.updateCalculations(), 200);
          setInterval(() => StorageService.saveTimersToLocalStorage(), 60000);
        }
        static setupEventSubscriptions() {
          AppState.subscribe("timerRemoved", timer => {
            if (AppState.getGlobalEndTime()) {
              TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
            }
            CalculationService.updateCalculations();
          });
          AppState.subscribe("timerPlansUpdated", timers => {
            timers.forEach(t => {
              TimerView.updateTimerPlannedTime(t);
              TimerView.updateTimerRemainingTime(t);
            });
          });
        }
        static addNewTimer(name = "", share = null) {
          SessionManager.clearJustAfterResetFlag();
          const timers = AppState.getTimers();
          if (timers.length === 0 || share === null) {
            // Первая задача (или служебное добавление) — обычное создание
            const newTimer = TimerModel.createTimer();
            newTimer.name = name || "";
            AppState.addTimer(newTimer);
            if (AppState.getGlobalEndTime()) {
              TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
            }
            CalculationService.updateCalculations();
            CloudSync.bumpControl();
            return newTimer;
          }
          // «Добавить ко всем» — механика add_task_to_group из py-скрипта,
          // где группа = все задачи
          return this.createTaskInGroup(
            timers.map(t => t.id),
            name,
            share
          );
        }
        static createTaskInGroup(groupIds, name, share) {
          // «Создать задачу внутри группы» (механика py-скрипта):
          //  - существующие задачи группы ужимаются в (1 - p), сохраняя
          //    относительные доли веса и цели; их время НЕ меняется;
          //  - новая задача получает долю p внутри группы (вес P*p, цель T*p)
          //    и «виртуальную историю» p*G/(1-p), чтобы её фактическая доля
          //    сразу равнялась целевой и рекомендации не перекашивались.
          SessionManager.clearJustAfterResetFlag();
          const group = AppState.getTimers().filter(t =>
            groupIds.includes(t.id)
          );
          if (!group.length) return null;
          let p = Number(share);
          if (!Number.isFinite(p) || p < 0) p = 0;
          if (p >= 1) p = 1 - 1e-9;
          const groupProportion = group.reduce(
            (sum, t) => sum + (t.proportion || 0),
            0
          );
          const groupTarget = group.reduce(
            (sum, t) => sum + (t.targetProportion || 0),
            0
          );
          const groupTime = group.reduce(
            (sum, t) => sum + (t.totalSeconds || 0),
            0
          );
          group.forEach(t => {
            t.proportion = (t.proportion || 0) * (1 - p);
            t.targetProportion = (t.targetProportion || 0) * (1 - p);
            TimerView.syncProportionInputs(t);
          });
          const newTimer = TimerModel.createTimer();
          newTimer.name = name || "";
          newTimer.proportion = groupProportion * p;
          newTimer.targetProportion = groupTarget * p;
          const virtualTime = (p * groupTime) / (1 - p);
          newTimer.totalSeconds = virtualTime;
          newTimer.dailyTotalSeconds = virtualTime;
          newTimer.originalDailyTotalSeconds = virtualTime;
          newTimer.lifetimeTotalSeconds = virtualTime;
          newTimer.recommendedProportion = 0;
          AppState.addTimer(newTimer);
          if (AppState.getGlobalEndTime()) {
            TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
          }
          CalculationService.updateCalculations();
          this.autoUpdate();
          CloudSync.bumpControl();
          return newTimer;
        }
        static splitTimer(timerId, specs) {
          // «Разбить задачу на подзадачи» (механика py-скрипта split_task,
          // исправленная: ВСЕ счётчики времени делятся пропорционально долям,
          // а не копируются целиком; счётчики трекинга сбрасываются).
          SessionManager.clearJustAfterResetFlag();
          const timers = AppState.getTimers();
          const index = timers.findIndex(t => t.id === timerId);
          if (index === -1) return null;
          const parent = timers[index];
          const totalShare = specs.reduce((sum, x) => sum + x.share, 0);
          if (!(totalShare > 0)) return null;
          const splitId = `split-${Date.now()}-${Math.random()
            .toString(36)
            .slice(2, 8)}`;
          const children = specs.map(spec => {
            const share = spec.share / totalShare; // нормализация к сумме 1
            const child = {
              ...parent,
              id: Utils.generateId(),
              name: spec.name,
              proportion: (parent.proportion || 0) * share,
              targetProportion: (parent.targetProportion || 0) * share,
              recommendedProportion: 0,
              trackedSeconds: (parent.trackedSeconds || 0) * share,
              totalTrackedSeconds: (parent.totalTrackedSeconds || 0) * share,
              totalDuration: (parent.totalDuration || 0) * share,
              dailyTrackedSeconds: (parent.dailyTrackedSeconds || 0) * share,
              totalSeconds: (parent.totalSeconds || 0) * share,
              dailyTotalSeconds: (parent.dailyTotalSeconds || 0) * share,
              originalDailyTotalSeconds:
                (parent.originalDailyTotalSeconds || 0) * share,
              lifetimeTotalSeconds: (parent.lifetimeTotalSeconds || 0) * share,
              plannedSeconds: 0,
              baseAllocation: 0,
              remainingSeconds: 0,
              isTracking: false,
              startTime: null,
              trackingSnapshot: null,
              lastResetTime: new Date(),
              shouldUpdateProportion: false,
              splitShare: share,
              splitId: splitId,
              splitParentName: parent.name || "",
            };
            delete child.lastSessionDisplayProportion;
            return child;
          });
          const newTimers = timers
            .slice(0, index)
            .concat(children, timers.slice(index + 1));
          AppState.setTimers(newTimers);
          AppState.notify("timerRemoved", parent); // убрать карточку родителя
          children.forEach(child => TimerView.addTimerElement(child));
          if (AppState.getGlobalEndTime()) {
            TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
          }
          CalculationService.updateCalculations();
          this.autoUpdate();
          CloudSync.bumpControl();
          return children;
        }
        static toggleTracking(id) {
          TimerController.toggleTracking(id);
        }
        static resetTimer(timer) {
          TimerController.resetTimer(timer);
        }
        static deleteTimer(timer) {
          TimerController.deleteTimer(timer);
        }
        static updateTimer(timer) {
          TimerController.updateTimer(timer);
        }
        static toggleAway() {
          TimeManager.toggleAway();
          // «Отошёл» останавливает трекинг — это управляющее действие
          CloudSync.bumpControl();
        }
        static calculateRecommendations() {
          SessionManager.checkAndPerformReset();
          CalculationService.calculateRecommendedProportions(
            AppState.getTimers(),
            CalculationService.getTotalTime()
          );
          CalculationService.calculatePriority(AppState.getTimers());
        }
        static applyRecommendations() {
          // Бывшая «Применить рекомендацию», но чтение из модели, а не из
          // текста DOM: рекомендованные пропорции становятся текущими весами,
          // затем планы и рекомендации пересчитываются от новых весов.
          SessionManager.clearJustAfterResetFlag();
          const timers = AppState.getTimers();
          timers.forEach(timer => {
            const rec = Number(timer.recommendedProportion);
            if (Number.isFinite(rec) && rec >= 0) {
              timer.proportion = rec;
              const input = AppState.getTimerProportionElement(timer.id);
              if (input) {
                input.value = String(rec);
              }
            }
          });
          TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
          CalculationService.calculateRecommendedProportions(
            timers,
            CalculationService.getTotalTime()
          );
          CalculationService.calculatePriority(timers);
          AppState.notify("displayNeedsUpdate");
        }
        static updateAllTimers() {
          // Бывшее «Обновить всё»: планы всех таймеров + рекомендации + приоритеты
          TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
          AppController.calculateRecommendations();
        }
        static autoUpdate() {
          // Единая точка автообновления. Триггеры:
          //  - любой пользовательский клик (до целевого действия);
          //  - получение/потеря фокуса поля ввода;
          //  - наступление «Конца» (ролловер сессии).
          SessionManager.checkAndPerformReset();
          // Пользовательское действие (клик/фокус) — немедленная синхронизация
          CloudSync.interactiveSync();
          if (AppState.isAwayModeActive()) {
            // В режиме «Отошёл» распределение заморожено: планы уменьшает
            // handleAwayMode, а пересчёт от настенного времени стёр бы
            // эти вычитания.
            return;
          }
          this.updateAllTimers();
          this.applyRecommendations();
        }
        static saveTimers() {
          StorageService.saveTimersToLocalStorage();
          // Ручное «Сохранить» сразу отправляет состояние в облако
          CloudSync.pushNow(true);
        }
        static exportTimers() {
          StorageService.exportTimersToFile();
        }
        static importTimers() {
          StorageService.importTimersFromFile();
        }
      }
      function initializeOnLoad() {
        AppController.init();
      }
      // Запуск: сначала приложение стартует на локальном состоянии,
      // затем подключается облако — если облачная запись отличается,
      // она применяется и страница перезагружается.
      window.onload = async () => {

        static parseTimersJSON(timersJSON) {
          // Фикс БАГ #8: сохранённые/импортированные данные могут быть
          // повреждены. Любые проблемы разбираются здесь и не должны прерывать

          let parsed;

          } catch (error) {
            console.error(
              "Сохранённые таймеры повреждены (JSON):",
              error && error.message
            );
            return [];
          }
          if (!Array.isArray(parsed)) {
            console.error("Сохранённые таймеры — не массив, игнорируем");
            return [];
          }
          const result = [];
          parsed.forEach(raw => {
            const timer = StorageService.sanitizeTimerEntry(raw);
            if (timer) {
              result.push(timer);
            }
          });
          return result;
        }
        static storageDateOrNull(value) {
          if (value === null || value === undefined || value === "") {
            return null;
          }
          const asNumber = Number(value);
          if (Number.isFinite(asNumber)) {
            return new Date(asNumber);
          }
          if (typeof value === "string") {
            const parsed = new Date(value);
            if (!isNaN(parsed.getTime())) {
              return parsed;
            }
          }
          return null;
        }
        static sanitizeTimerEntry(raw) {
          // Фикс БАГ #9: не-объекты и записи без валидного числового id
          // отбрасываются; отсутствующие/битые поля получают дефолты из
          // createTimer; числа приводятся через Number() (строка "600"
          // становится 600, а не источником конкатенации при сложении).
          if (raw === null || typeof raw !== "object" || Array.isArray(raw)) {
            return null;
          }
          const id = Number(raw.id);
          if (!Number.isFinite(id)) {
            return null;
          }
          const base = TimerModel.createTimer();
          const num = (value, fallback) => {
            if (value === null || value === undefined || value === "") {
              return fallback;
            }
            const n = Number(value);
            return Number.isFinite(n) ? n : fallback;
          };
          const timer = { ...base, ...raw };
          timer.id = id;
          timer.name = typeof raw.name === "string" ? raw.name : "";
          timer.proportion = num(raw.proportion, base.proportion);
          timer.targetProportion = num(raw.targetProportion, base.targetProportion);
          timer.recommendedProportion = num(
            raw.recommendedProportion,
            base.recommendedProportion
          );
          timer.trackedSeconds = num(raw.trackedSeconds, 0);
          timer.plannedSeconds = num(raw.plannedSeconds, 0);
          timer.baseAllocation = num(raw.baseAllocation, 0);
          timer.remainingSeconds = num(raw.remainingSeconds, 0);
          timer.totalDuration = num(raw.totalDuration, 0);
          timer.totalSeconds = num(raw.totalSeconds, 0);
          timer.dailyTrackedSeconds = num(raw.dailyTrackedSeconds, 0);
          timer.dailyTotalSeconds = num(raw.dailyTotalSeconds, 0);
          timer.originalDailyTotalSeconds = num(
            raw.originalDailyTotalSeconds,
            timer.dailyTotalSeconds
          );
          timer.lifetimeTotalSeconds = num(
            raw.lifetimeTotalSeconds,
            timer.totalSeconds
          );
          timer.totalTrackedSeconds = num(raw.totalTrackedSeconds, 0);
          const lsd = raw.lastSessionDisplayProportion;
          timer.lastSessionDisplayProportion =
            lsd === null || lsd === undefined || lsd === "" ||
            !Number.isFinite(Number(lsd))
              ? undefined
              : Number(lsd);
          timer.isTracking = raw.isTracking === true;
          timer.startTime = this.storageDateOrNull(raw.startTime);
          const snap = raw.trackingSnapshot;
          timer.trackingSnapshot =
            snap !== null && typeof snap === "object" && !Array.isArray(snap)
              ? snap
              : null;
          const resetDate = this.storageDateOrNull(raw.lastResetTime);
          timer.lastResetTime = resetDate ? resetDate : new Date();
          return timer;
        }
        static loadFromLocalStorage() {
          const timersJSON = this.getItemFromLocalStorage("timers");
          if (!timersJSON) {
            return false;
          }
          // Фикс БАГ #8/#9: устойчивый разбор — битый JSON больше не убивает
          // инициализацию, а неполные/мусорные записи не загрязняют модель.
          const loadedTimers = this.parseTimersJSON(timersJSON);
          AppState.setTimers(loadedTimers);
          const wasTimerActive = this.getItemFromLocalStorage("wasTimerActive");
          if (wasTimerActive === "true") {
            // Зеркалируемый трекинг переживает перезагрузку:
            //  - короткая (<90 с от последнего сохранения) — отсчёт продолжается,
            //    счётчики выводятся из startTime (двойного начисления нет);
            //  - долгое закрытие вкладки — авто-пауза на момент последнего
            //    «сердцебиения» (без фантомных часов), пауза уходит в облако.
            const heartbeat =
              Number(this.getItemFromLocalStorage("lastSaveAt")) || 0;
            const now = Date.now();
            let autoPaused = false;
            AppState.getTimers().forEach(timer => {
              if (!timer.isTracking) return;
              const gapSec = heartbeat ? (now - heartbeat) / 1000 : Infinity;
              if (!timer.startTime || !timer.trackingSnapshot || gapSec > 90) {
                const at =
                  heartbeat && gapSec !== Infinity
                    ? new Date(Math.min(heartbeat, now))
                    : null;
                TimerModel.pauseAt(timer, at);
                autoPaused = true;

            if (autoPaused) {

            this.getItemFromLocalStorage("lastSessionEndTime");
          if (lastSessionEndTimeStr) {

            // в Invalid Date (с ним `now >= граница` всегда false — дневной
            // сброс сессии молча переставал работать).
            const parsedMs = Number(lastSessionEndTimeStr);
            if (Number.isFinite(parsedMs)) {
              const parsedDate = new Date(parsedMs);
              if (!isNaN(parsedDate.getTime())) {
                AppState.setLastSessionEndTime(parsedDate);

          // Фикс БАГ #2: восстанавливаем время "Конца" (поле ввода + состояние

          // сохранённая граница уже в прошлом, SessionManager выполнит ровно

        static restoreGlobalEndTime() {
          const savedEndValue =

          if (endTimeElement) {

          const parsed = TimeCalculator.parseGlobalEndTime(savedEndValue);
          if (!parsed) return;
          const [hours, minutes] = parsed;
          const { newGlobalEndTime } = TimeCalculator.createNewGlobalEndTime(
            hours,
            minutes
          );
          AppState.setGlobalEndTime(newGlobalEndTime);
          // Фикс БАГ #10a: если граница сессии не сохранена или повреждена,
          // выводим её из времени «Конца» (предыдущее вхождение = следующие
          // вхождение минус сутки). Если она уже позади, SessionManager
          // выполнит ровно один сброс зависшей сессии и сдвинет границу.
          const currentSessionEnd = AppState.getLastSessionEndTime();
          if (!currentSessionEnd || isNaN(currentSessionEnd.getTime())) {
            const derived = new Date(newGlobalEndTime.getTime());

            AppState.setLastSessionEndTime(derived);

            now

        static exportTimersToFile() {

            startTime: timer.startTime ? timer.startTime.getTime() : null,

          let delta = (now - AppState.getLastUpdateTime()) / 1000;
          // Фикс БАГ #6: если в этом тике пересечена граница сессии (вкладка
          // "спала" и проснулась уже за границей), время ДО границы не
          // зачисляется в новую сессию — иначе активный таймер получал сразу
          // всю дельту (например, 2 часа) в обнулённый счётчик.
          if (resetDue && prevSessionEnd && now >= prevSessionEnd) {
            delta = Math.min(delta, (now - prevSessionEnd) / 1000);
            if (delta < 0) delta = 0;
          }
          AppState.setLastUpdateTime(now);
          const sessionRolled = TimeManager.updateGlobalEndTime(now);
          if (sessionRolled) {
            // Наступил «Конец»: автообновление планов и рекомендаций
            // для новой сессии (бывшие кнопки «Обновить всё» и
            // «Рекомендация» + «Применить рекомендацию»).
            AppController.autoUpdate();
          }
          this.updateActiveTimers(delta);
          TimeManager.handleAwayMode(now, delta);
          TimeManager.handleAutoAwayMode(delta);

          AppState.notify("displayNeedsUpdate");
        }

          if (!(totalWeight > 0)) return 0;

          // Фикс БАГ #1: timerId === null теперь означает "пересчитать планы

          // Раньше планы обновлялись только при явном timerId, поэтому при

          // или нулевыми.
          if (timerId === null || timer.id === timerId) {

      class TimeManager {
        static updateGlobalEndTime(now) {
          const globalEndTime = AppState.getGlobalEndTime();
          if (globalEndTime && now >= globalEndTime) {
            globalEndTime.setDate(globalEndTime.getDate() + 1);
            AppState.setGlobalEndTime(globalEndTime);
            AppState.setInitialAvailable((globalEndTime - now) / 1000);
            this.updateGlobalEndTimeAndPlans(null, null, false);
            return true; // произошёл ролловер сессии
          }
          return false;
        }
        static updateGlobalEndTimeAndPlans(
          timeValue,
          timerId,
          shouldUpdateDisplay = false
        ) {
          const parsed = CalculationService.parseGlobalEndTime(timeValue);
          const now = new Date();
          let newGlobalEndTime = null;
          let sessionEndTime;
          if (parsed) {
            const [hours, minutes] = parsed;
            const created = CalculationService.createNewGlobalEndTime(
              hours,
              minutes
            );
            newGlobalEndTime = created.newGlobalEndTime;
            sessionEndTime = newGlobalEndTime;
          } else {
            // Фикс БАГ #4: поле очищено/значение невалидно — считаем временем
            // конца полночь (как getTotalTime по умолчанию), а не оставляем
            // в состоянии Invalid Date, из-за которой везде появлялся NaN.
            sessionEndTime = TimeCalculator.getNextMidnight(now);
          }
          AppState.setGlobalEndTime(newGlobalEndTime);
          SessionManager.updateSessionEndTime(sessionEndTime);
          const remaining = CalculationService.calculateRemainingTime(
            sessionEndTime,
            now
          );
          AppState.setInitialAvailable(remaining);
          const timers = AppState.getTimers();
          const totalWeight = CalculationService.calculateTotalWeight(timers);
          CalculationService.updateTimerPlans(
            timers,
            remaining,
            timerId,
            totalWeight
          );
          if (shouldUpdateDisplay) {
            AppState.notify("displayNeedsUpdate");
          }
        }
        static toggleAway() {
          const newAwayModeActive = !AppState.isAwayModeActive();
          AppState.setAwayModeActive(newAwayModeActive);
          if (newAwayModeActive) {
            this.activateAwayMode();

        static handleAwayMode(now, delta) {

            const timers = AppState.getTimers();
            const totalProportion = timers.reduce(
              (sum, t) => sum + t.proportion,
              0
            );
            const updatedTimers = [];
            timers.forEach(t => {
              // Фикс БАГ #5: отсутствие уменьшает доступное время, но план
              // отдельного таймера не может стать отрицательным — зажимаем в 0.
              // При вырожденных весах (totalProportion = 0) не вычитаем ничего,
              // чтобы не получить NaN (Math.max(0, NaN) === NaN).
              if (totalProportion > 0) {

                  0,
                  t.plannedSeconds - elapsed * (t.proportion / totalProportion)
                );

              updatedTimers.push(t);

      class Utils {
        static formatTime(seconds) {
          seconds = Math.floor(seconds);
          // Фикс: отрицательные значения форматируются по модулю со знаком
          // спереди. Раньше Math.floor по каждому компоненту давал misleading
          // "-1ч -5м 0с" для переработки в 5 минут (-300с).
          const sign = seconds < 0 ? "-" : "";
          const abs = Math.abs(seconds);
          const hrs = Math.floor(abs / 3600);
          const mins = Math.floor((abs % 3600) / 60);
          const secs = abs % 60;
          return `${sign}${hrs}ч ${mins}м ${secs}с`;
        }
        static convertTimeInputsToSeconds(
          hoursInput,
          minutesInput,
          secondsInput
        ) {
          const hours = parseInt(hoursInput.value) || 0;
          const minutes = parseInt(minutesInput.value) || 0;
          const seconds = parseInt(secondsInput.value) || 0;
          return hours * 3600 + minutes * 60 + seconds;
        }
        static parseTimeInput(input) {
          return parseFloat(input.replace(",", ".").replace(".", ".")) || 0;
        }
        static parseShareInput(value) {
          // Доля для модальных окон: десятичная (0.25 / 0,25) или обычная
          // дробь (1/4). Некорректный ввод -> NaN (в отличие от parseTimeInput,
          // который молча даёт 0 — здесь важно отличать «не ввели» от нуля).
          const raw = String(value === null || value === undefined ? "" : value)
            .trim()
            .replace(",", ".");
          if (!raw) return NaN;
          if (raw.includes("/")) {
            const parts = raw.split("/");
            if (parts.length !== 2) return NaN;
            const num = Number(parts[0]);
            const den = Number(parts[1]);
            if (!Number.isFinite(num) || !Number.isFinite(den) || den === 0) {
              return NaN;
            }
            return num / den;
          }
          const n = Number(raw);
          return Number.isFinite(n) ? n : NaN;
        }
        static getTimerIdFromElement(element) {
          const timerContainer = element.closest(".timer-container");
          if (timerContainer) {
            const timerId = timerContainer.id.replace("timer-", "");
            return parseFloat(timerId);
          }
          return null;
        }
        static generateId() {
          return Date.now() + Math.random();
        }

        static LS_DEVICE_ID = "cloudDeviceId";
        static LS_CONTROL_SEQ = "controlSeq";
        static STATE_KEYS = [
          "timers",
          "globalEndTimeValue",
          "wasTimerActive",
          "lastSessionEndTime",
          "lastSaveAt",
          "controlSeq",
        ];
        static lastError = "";
        static _chain = Promise.resolve();
        static lastSyncAt = null;
        static dirty = false;
        static busy = false;
        static reloading = false;
        static periodicTimer = null;
        static _saveDebounce = null;
        static _interactiveDebounce = null;
        static rt = null; // Realtime-клиент (Supabase) — мгновенные пинги
        static rtChannel = null;
        static rtReady = false;
        static rtFailed = false;
        static rtRetryAt = 0;
        static lastActivityAt = 0;

        static enqueue(fn) {
          // Последовательное выполнение push/pull: без гонок и потерь
          const run = this._chain.then(fn, fn);
          this._chain = run.then(
            () => {},
            () => {}
          );
          return run;
        }
        static isConfigured() {
          return Boolean(CLOUD_CONFIG.url && CLOUD_CONFIG.anonKey);
        }
        static isDisabled() {
          return localStorage.getItem(this.LS_DISABLED) === "1";
        }
        static setDisabled(value) {
          if (value) {
            localStorage.setItem(this.LS_DISABLED, "1");
            this.teardownRealtime();
          } else {
            localStorage.removeItem(this.LS_DISABLED);
          }
        }
        static getKeyHash() {
          return localStorage.getItem(this.LS_KEY_HASH) || "";
        }
        static isActive() {
          return (
            this.isConfigured() &&
            !this.isDisabled() &&
            Boolean(this.getKeyHash())
          );
        }
        static keyFingerprint() {
          const hash = this.getKeyHash();
          return hash ? hash.slice(0, 6).toUpperCase() : "";
        }
        static formatSyncTime(value) {
          // Единый формат для Date-объекта и ISO-строки из localStorage
          if (!value) return "—";
          const d = value instanceof Date ? value : new Date(value);
          if (isNaN(d.getTime())) return String(value).slice(0, 19);
          const p = n => String(n).padStart(2, "0");
          return (
            `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
            `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
          );
        }
        static deviceId() {
          let id = localStorage.getItem(this.LS_DEVICE_ID);
          if (!id) {
            id = Math.random().toString(36).slice(2, 10);
            localStorage.setItem(this.LS_DEVICE_ID, id);
          }
          return id;
        }

        // --- Зеркалирование управления (мультиселевенная секвенция) ---
        static localSeq() {
          return Number(localStorage.getItem(this.LS_CONTROL_SEQ) || 0);
        }
        static bumpControl(push = true) {
          // Управляющее действие (старт/пауза/структура): увеличиваем
          // секвенцию и немедленно отправляем в облако, чтобы другие
          // устройства приняли изменение безусловно.
          if (!this.isConfigured()) return this.localSeq();
          const seq = this.localSeq() + 1;
          localStorage.setItem(this.LS_CONTROL_SEQ, String(seq));
          this.lastActivityAt = Date.now();
          try {
            StorageService.saveToLocalStorage();
          } catch (e) {}
          if (push) this.pushNow(true);
          return seq;
        }
        static parseSnapshotTimers(snapshot) {
          try {
            const arr = JSON.parse((snapshot && snapshot.timers) || "[]");
            return Array.isArray(arr) ? arr : [];
          } catch (e) {
            return [];
          }
        }
        static controlProjection(snapshot) {
          // Состояние управления: кто трекается и с каким startTime.
          // Счётчики сюда не входят — во время трекинга они выводятся
          // из startTime и на каждом устройстве чуть «шумят».
          return this.parseSnapshotTimers(snapshot)
            .map(
              t =>
                `${t.id}:${t.isTracking === true}:${t.startTime || 0}`
            )
            .sort()
            .join("|");
        }
        static meaningfulProjection(snapshot) {
          // «Осмысленное» состояние: структура списка, имена, веса, цели,
          // управление и глобальные ключи. Производные значения (счётчики,
          // планы, рекомендации) не входят — каждое устройство вычисляет
          // их одинаково самостоятельно, их отличия не повод для рассылки.
          const timers = this.parseSnapshotTimers(snapshot)
            .map(t =>
              [
                t.id,
                t.name || "",
                t.proportion,
                t.targetProportion,
                t.isTracking === true,
                t.startTime || 0,
              ].join(":")
            )
            .sort()
            .join("|");
          return [
            timers,
            (snapshot && snapshot.globalEndTimeValue) || "",
            (snapshot && snapshot.lastSessionEndTime) || "",
            (snapshot && snapshot.controlSeq) || "0",
          ].join("#");
        }
        static meaningfulHash(snapshot) {
          return this.quickHash(this.meaningfulProjection(snapshot));
        }

        // --- Ключ синхронизации -> хэш (ключ записи в базе) ---
        static async sha256Hex(text) {
          const bytes = new TextEncoder().encode(text);
          if (window.crypto && window.crypto.subtle) {
            const buf = await window.crypto.subtle.digest("SHA-256", bytes);
            return Array.from(new Uint8Array(buf))
              .map(b => b.toString(16).padStart(2, "0"))
              .join("");
          }
          // Резерв (file:// без crypto.subtle): FNV-1a в четыре прохода.
          // Не криптостойко, но для личного инструмента достаточно.
          let out = "";
          for (let salt = 0; salt < 4; salt++) {
            let h = (0x811c9dc5 ^ salt) >>> 0;
            for (let i = 0; i < bytes.length; i++) {
              h ^= bytes[i];
              h = Math.imul(h, 0x01000193) >>> 0;
            }
            out += h.toString(16).padStart(8, "0");
          }
          return out;
        }
        static async setKeyFromPassphrase(passphrase) {
          const hash = await this.sha256Hex(String(passphrase).trim());
          localStorage.setItem(this.LS_KEY_HASH, hash);
          // Под новым ключом ещё ничего не отправляли:
          localStorage.removeItem(this.LS_PUSH_HASH);
          this.setDisabled(false);
          this.lastError = "";
          return hash;
        }
        static clearKey() {
          [this.LS_KEY_HASH, this.LS_LAST_SYNC, this.LS_PUSH_HASH].forEach(
            key => localStorage.removeItem(key)
          );
        }

        // --- Снимок локального состояния ---
        static snapshotLocal() {
          const data = {};
          this.STATE_KEYS.forEach(key => {
            data[key] = localStorage.getItem(key);
          });
          data.__device = this.deviceId();
          return data;
        }
        static applySnapshot(data) {
          if (!data || typeof data !== "object") return;
          this.STATE_KEYS.forEach(key => {
            const value = data[key];
            if (value === null || value === undefined) {
              localStorage.removeItem(key);
            } else {
              localStorage.setItem(key, String(value));
            }
          });
          // Принятое состояние считаем «уже отправленным»: не слать его
          // обратно и не принимать повторно
          localStorage.setItem(this.LS_PUSH_HASH, this.snapshotContentHash(data));
          localStorage.setItem(this.LS_PUSH_PROJ, this.meaningfulHash(data));
          this.lastPushAtMs = Date.now();
        }
        static quickHash(str) {
          let h = 0x811c9dc5;
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 0x01000193) >>> 0;
          }
          return h.toString(16).padStart(8, "0");
        }
        static snapshotContentHash(snapshot) {
          // Нормализованный хэш значимых полей: отсутствие ключа и null
          // считаются равными (облачная запись может быть старого формата),
          // __device и lastSaveAt (летучие поля) в сравнении не участвуют.
          const copy = {};
          this.STATE_KEYS.forEach(key => {
            if (key === "lastSaveAt") return;
            const value = snapshot ? snapshot[key] : null;
            copy[key] = value === undefined || value === null ? null : String(value);
          });
          return this.quickHash(JSON.stringify(copy));
        }

        // --- Сеть (PostgREST RPC) ---
        static async rpc(fn, args, options = {}) {
          const base = String(CLOUD_CONFIG.url).replace(/\/+$/, "");
          const res = await fetch(`${base}/rest/v1/rpc/${fn}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              apikey: CLOUD_CONFIG.anonKey,
              Authorization: `Bearer ${CLOUD_CONFIG.anonKey}`,
            },
            body: JSON.stringify(args),
            keepalive: Boolean(options.keepalive),
          });
          if (!res.ok) {
            let msg = "";
            try {
              msg = (await res.text()).slice(0, 200);
            } catch (e) {}
            throw new Error(`${fn}: HTTP ${res.status} ${msg}`);
          }
          return res.json();
        }
        static cloudGet() {
          return this.rpc("get_state", { p_key: this.getKeyHash() });
        }
        static cloudPut(data, options) {
          return this.rpc(
            "put_state",
            { p_key: this.getKeyHash(), p_data: data },
            options
          );
        }

        // --- Пуш / пул ---
        static pushNow(force = false, options = {}) {
          // Операции синхронизации сериализуются через цепочку: быстрый
          // повторный вызов (два управляющих действия подряд) не теряется,
          // а выполняется следующим.
          return this.enqueue(() => this._pushNow(force, options));
        }
        static async _pushNow(force = false, options = {}) {
          if (!this.isActive() || this.reloading) return false;
          try {
            // Сначала фиксируем модель в localStorage, чтобы снимок отражал
            // самые свежие данные (например, задачу, созданную только что,
            // до первого автосохранения — фикс найден E2E-тестом).
            try {
              StorageService.saveToLocalStorage();
            } catch (e) {}
            const snapshot = this.snapshotLocal();
            const contentHash = this.snapshotContentHash(snapshot);
            const meaningful = this.meaningfulHash(snapshot);
            // Отправляем только ОСМЫСЛЕННЫЕ изменения (структура/имена/веса/
            // цели/управление). Шум счётчиков во время трекинга не уходит:
            // вторые устройства выводят их из startTime сами. Раз в минуту —
            // контрольная точка полным снимком (устойчивость к сбоям).
            const tracking = this.parseSnapshotTimers(snapshot).some(
              t => t.isTracking
            );
            const checkpointDue =
              tracking && Date.now() - this.lastPushAtMs > this.CHECKPOINT_MS;
            if (
              !force &&
              meaningful === localStorage.getItem(this.LS_PUSH_PROJ) &&
              !checkpointDue
            ) {
              this.dirty = false; // не изменилось: не дёргаем updated_at в облаке
              this.updateCloudButton();
              return false;
            }
            const updatedAt = await this.cloudPut(snapshot, options);
            localStorage.setItem(this.LS_PUSH_HASH, contentHash);
            localStorage.setItem(this.LS_PUSH_PROJ, meaningful);
            this.lastPushAtMs = Date.now();
            if (updatedAt) {
              localStorage.setItem(this.LS_LAST_SYNC, String(updatedAt));
            }
            this.lastSyncAt = new Date();
            this.lastError = "";
            this.dirty = false;
            this.lastActivityAt = Date.now();
            this.broadcastPing(); // мгновенно будим другие устройства
            this.updateCloudButton();
            return true;
          } catch (err) {
            this.lastError = String((err && err.message) || err);
            this.updateCloudButton();
            return false;
          }
        }
        static pullNow(force = false) {
          return this.enqueue(() => this._pullNow(force));
        }
        static async _pullNow(force = false) {
          // true = облачные данные приняты в localStorage (нужна перезагрузка).
          // Правила принятия (зеркалирование управления):
          //  - remoteSeq > localSeq: с другого устройства пришло управляющее
          //    действие (старт/пауза/структура) — принимаем безусловно,
          //    даже если у самих идёт трекинг;
          //  - remoteSeq == localSeq, управление совпадает, идёт трекинг:
          //    отличия счётчиков — «шум» параллельного вывода — игнорируем;
          //  - remoteSeq == localSeq, никто не трекается: принимаем при любом
          //    отличии содержимого (ручные правки, веса, история);
          //  - remoteSeq < localSeq или расхождение управления при равных seq:
          //    локальное состояние новее — не принимаем (наш push победит).
          if (!this.isActive() || this.reloading) return false;
          try {
            const row = await this.cloudGet();
            this.lastSyncAt = new Date();
            this.lastError = "";
            if (!row || !row.data) {
              this.updateCloudButton();
              return false; // в облаке пока пусто
            }
            if (row.updated_at) {
              localStorage.setItem(this.LS_LAST_SYNC, String(row.updated_at));
            }
            const remote = row.data;
            const local = this.snapshotLocal();
            const cloudContent = this.snapshotContentHash(remote);
            const localContent = this.snapshotContentHash(local);
            const remoteSeq = Number(remote.controlSeq || 0);
            const localSeq = this.localSeq();
            let adopt = false;
            let controlNewer = false;
            if (cloudContent === localContent) {
              adopt = false;
            } else if (force) {
              adopt = true;
            } else if (remoteSeq > localSeq) {
              adopt = true;
              controlNewer = true;
            } else if (remoteSeq === localSeq) {
              // Принимаем только ОСМЫСЛЕННЫЕ отличия (структура/имена/веса/
              // цели) и только если облачная запись — не эхо нашего
              // последнего пуша (иначе старая копия откатила бы локальную
              // правку, которую мы ещё не отправили). Шум счётчиков/планов
              // поводом не является: устройства сходятся к нему сами.
              const meaningfulDiffers =
                this.meaningfulHash(remote) !== this.meaningfulHash(local);
              const foreign =
                cloudContent !== localStorage.getItem(this.LS_PUSH_HASH);
              adopt = meaningfulDiffers && foreign;
            }
            if (!adopt) {
              if (cloudContent === localContent) {
                localStorage.setItem(this.LS_PUSH_HASH, cloudContent);
                this.dirty = false;
              }
              this.updateCloudButton();
              return false;
            }
            if (
              !force &&
              (!this.canAutoApply(controlNewer) ||
                !this.reloadAllowed(controlNewer))
            ) {
              this.updateCloudButton();
              return false;
            }
            // Защита: пока идёт перезагрузка, тики не должны затереть
            // принятые данные старой копией из памяти
            this.reloading = true;
            this.applySnapshot(remote);
            localStorage.setItem(this.LS_PUSH_HASH, cloudContent);
            this.updateCloudButton();
            return true;
          } catch (err) {
            this.lastError = String((err && err.message) || err);
            this.updateCloudButton();
            return false;
          }
        }
        static canAutoApply(controlNewer = false) {
          // Не подменяем локальное состояние перезагрузкой, пока открыто
          // модальное окно или пользователь печатает в поле. Локальный
          // трекинг больше не блокирует приём: счётчики выводятся из
          // startTime, а чужое управляющее действие важнее.
          try {
            if (ModalController.isOpen()) return false;
            const active = document.activeElement;
            if (active && active.tagName === "INPUT") return false;
          } catch (e) {}
          return true;
        }
        static reloadAllowed(controlNewer = false) {
          // Защита от «шторма перезагрузок»: обычный автоприём не чаще
          // раза в 30 с; управляющее действие — не чаще раза в 5 с
          const last = Number(sessionStorage.getItem("cloudReloadAt") || 0);
          return Date.now() - last >= (controlNewer ? 5000 : 30000);
        }
        static reloadForSync(force = false) {
          if (!force && !this.reloadAllowed()) return;
          sessionStorage.setItem("cloudReloadAt", String(Date.now()));
          location.reload();
        }

        // --- Запуск и фоновая работа ---
        static async boot() {
          if (!this.isConfigured() || this.isDisabled()) {
            this.updateCloudButton();
            return;
          }
          if (!this.getKeyHash()) {
            CloudController.openKeyModal(true); // первый запуск: спросить ключ
            return;
          }
          this.initRealtime(); // fire-and-forget
          const applied = await this.pullNow();
          if (applied) this.reloadForSync(true);
          this.updateCloudButton();
        }
        static startPeriodic() {
          if (this.periodicTimer) return;
          this.scheduleNext();
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
              this.tick().finally(() => {
                if (!this.reloading) this.scheduleNext();
              });
            }
          });
          window.addEventListener("beforeunload", () => {
            // Последний шанс отправить изменения (keepalive — запрос
            // доживает после закрытия страницы)
            if (this.isActive() && this.dirty && !this.reloading) {
              this.pushNow(false, { keepalive: true });
            }
          });
        }
        static async tick() {
          if (!this.isActive() || this.reloading) return;
          this.initRealtime(); // fire-and-forget: подключение/ретрай
          // 1. СНАЧАЛА тянем из облака: чужое управляющее действие
          //    (секвенция новее) имеет приоритет над локальными изменениями —
          //    push не должен затереть его устаревшим состоянием.
          const applied = await this.pullNow();
          if (applied) {
            this.reloadForSync();
            return; // страница перезагружается с принятым состоянием
          }
          // 2. Затем отправляем локальные изменения: pushNow сам фиксирует
          //    модель в localStorage и отправляет снимок только при отличии.
          await this.pushNow();
        }
        static interactiveSync() {
          // Логика «Обновить»: любой клик, получение/потеря фокуса полем
          // вызывают немедленную синхронизацию (push + pull) с дебаунсом —
          // серия быстрых действий сливается в один обмен. В полном простое
          // работает обычный тик раз в syncIntervalMs.
          if (!this.isActive() || this.reloading) return;
          this.lastActivityAt = Date.now();
          if (this._interactiveDebounce) {
            clearTimeout(this._interactiveDebounce);
          }
          this._interactiveDebounce = setTimeout(() => {
            this._interactiveDebounce = null;
            this.tick();
          }, 700);
        }
        // --- Supabase Realtime: broadcast-пинги для мгновенной доставки ---
        // Если Realtime недоступен (офлайн, заблокирован CDN, среда без
        // ES-модулей) — молча остаётся опрос (тик), он же адаптивный.
        static async loadRealtimeModule() {
          return import("https://cdn.jsdelivr.net/npm/@supabase/realtime-js@2/+esm");
        }
        static async initRealtime() {
          if (!this.isActive() || this.rtReady) return;
          if (this.rtFailed) {
            if (Date.now() < this.rtRetryAt) return;
            this.rtFailed = false;
          }
          try {
            const mod = await this.loadRealtimeModule();
            const RealtimeClient =
              (mod &&
                (mod.RealtimeClient ||
                  (mod.default && mod.default.RealtimeClient))) ||
              null;
            if (!RealtimeClient) throw new Error("RealtimeClient not found");
            const wsBase =
              String(CLOUD_CONFIG.url).replace(/\/+$/, "").replace(/^http/, "ws") +
              "/realtime/v1";
            const client = new RealtimeClient(wsBase, {
              params: { apikey: CLOUD_CONFIG.anonKey },
            });
            // Имя канала = хэш ключа синхронизации: без ключа канал не найти
            const channel = client.channel(`sync-${this.getKeyHash()}`);
            channel.on("broadcast", { event: "ping" }, msg => {
              this.onRemotePing(msg && msg.payload);
            });
            // subscribe() резолвится объектом канала, а не статусом —
            // надёжно ждём результат через callback со своим таймаутом
            await new Promise((resolve, reject) => {
              const guard = setTimeout(
                () => reject(new Error("subscribe timeout")),
                10000
              );
              channel.subscribe((status, err) => {
                clearTimeout(guard);
                if (status === "SUBSCRIBED") resolve(status);
                else reject(err || new Error(String(status)));
              });
            });
            this.rt = client;
            this.rtChannel = channel;
            this.rtReady = true;
          } catch (e) {
            this.rtFailed = true;
            this.rtRetryAt = Date.now() + 30000; // редкие ретраи, без штурма
          }
        }
        static onRemotePing(payload) {
          // Свои собственные пинги игнорируем (устройство помечено в payload)
          if (payload && payload.device && payload.device === this.deviceId()) {
            return;
          }
          this.lastActivityAt = Date.now();
          this.tick(); // немедленный pull(+push) — как по действию пользователя
        }
        static broadcastPing() {
          if (!this.rtReady || !this.rtChannel) return;
          try {
            const sent = this.rtChannel.send({
              type: "broadcast",
              event: "ping",
              payload: {
                device: this.deviceId(),
                seq: this.localSeq(),
                at: Date.now(),
              },
            });
            if (sent && typeof sent.catch === "function") sent.catch(() => {});
          } catch (e) {}
        }
        static teardownRealtime() {
          try {
            if (this.rtChannel && this.rtChannel.unsubscribe) {
              this.rtChannel.unsubscribe();
            }
            if (this.rt && this.rt.disconnect) this.rt.disconnect();
          } catch (e) {}
          this.rt = null;
          this.rtChannel = null;
          this.rtReady = false;
        }
        static currentPollDelay() {
          const base = Number(CLOUD_CONFIG.syncIntervalMs) || 20000;
          // С работающим Realtime мгновенность обеспечивают пинги — редкий
          // опрос лишь страховка. Без Realtime ускоряемся, когда идёт трекинг
          // или была недавняя активность.
          if (this.rtReady) return base;
          try {
            const tracking = AppState.getTimers().some(t => t.isTracking);
            const recent = Date.now() - this.lastActivityAt < 60000;
            if (tracking || recent) return Math.min(4000, base);
          } catch (e) {}
          return base;
        }
        static scheduleNext() {
          if (this.periodicTimer) clearTimeout(this.periodicTimer);
          this.periodicTimer = setTimeout(() => {
            this.periodicTimer = null;
            this.tick().finally(() => {
              if (!this.reloading) this.scheduleNext();
            });
          }, this.currentPollDelay());
        }
        static onLocalSaved() {
          if (!this.isActive()) return;
          const contentHash = this.snapshotContentHash(this.snapshotLocal());
          this.dirty = contentHash !== localStorage.getItem(this.LS_PUSH_HASH);
          this.updateCloudButton();
          // Дебаунс-пуш вскоре после сохранения, не дожидаясь следующего тика
          if (this.dirty && !this._saveDebounce) {
            this._saveDebounce = setTimeout(() => {
              this._saveDebounce = null;
              this.pushNow();
            }, 3000);
          }
        }
        static updateCloudButton() {
          const btn = document.getElementById("cloudButton");
          if (!btn) return;
          btn.classList.toggle("has-error", Boolean(this.lastError));
          btn.classList.toggle(
            "synced",
            !this.lastError && !this.dirty && this.isActive()
          );
          btn.title = !this.isActive()
            ? "Облако: не настроено или отключено"
            : this.lastError
              ? `Облако: ошибка — ${this.lastError}`
              : this.dirty
                ? "Облако: есть неотправленные изменения"
                : `Облако: синхронизировано (ключ ${this.keyFingerprint()})`;
        }
      }
      class CloudController {
        // Модальное окно облака: статус, ключ, ручные операции
        static openModal() {
          const M = ModalController;
          const box = M.box();
          box.innerHTML = "";
          box.appendChild(
            M.el("div", { class: "modal-title" }, "☁ Облачная синхронизация")
          );
          if (!CloudSync.isConfigured()) {
            box.appendChild(
              M.el(
                "div",
                {},
                "Облако не настроено. Откройте этот файл в редакторе и впишите в CLOUD_CONFIG (в начале скрипта) Project URL и anon key из Supabase — подробная инструкция в DEPLOY.md."
              )
            );
            const row = M.el("div", { class: "modal-row" });
            row.appendChild(
              M.el("button", { "data-modal-action": "cancel" }, "Закрыть")
            );
            box.appendChild(row);
            M.context = { type: "cloud" };
            M.open();
            return;
          }
          const status = M.el("div", { class: "cloud-status" });
          status.appendChild(
            M.el(
              "div",
              {},
              CloudSync.getKeyHash()
                ? `Ключ синхронизации: задан (отпечаток ${CloudSync.keyFingerprint()} — на всех устройствах должен совпадать)`
                : "Ключ синхронизации: не задан"
            )
          );
          status.appendChild(
            M.el(
              "div",
              {},
              `Облако на этом устройстве: ${
                CloudSync.isDisabled() ? "отключено" : "включено"
              }`
            )
          );
          const lastSync =
            CloudSync.lastSyncAt ||
            localStorage.getItem(CloudSync.LS_LAST_SYNC);
          status.appendChild(
            M.el(
              "div",
              {},
              `Последняя синхронизация: ${CloudSync.formatSyncTime(lastSync)}`
            )
          );
          box.appendChild(status);
          box.appendChild(M.errorRow());
          M.setError(CloudSync.lastError || "");
          const row1 = M.el("div", { class: "modal-row" });
          row1.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cloud-sync-now",
              },
              "Синхронизировать сейчас"
            )
          );
          row1.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cloud-set-key",
              },
              "Задать/сменить ключ"
            )
          );
          box.appendChild(row1);
          const row2 = M.el("div", { class: "modal-row" });
          row2.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cloud-force-push",
              },
              "Выгрузить в облако"
            )
          );
          row2.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cloud-force-pull",
              },
              "Загрузить из облака"
            )
          );
          box.appendChild(row2);
          const row3 = M.el("div", { class: "modal-row" });
          row3.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cloud-toggle-disable",
              },
              CloudSync.isDisabled()
                ? "Включить облако"
                : "Отключить на этом устройстве"
            )
          );
          row3.appendChild(
            M.el(
              "button",
              {
                class: "cloud-action-btn",
                "data-modal-action": "cancel",
              },
              "Закрыть"
            )
          );
          box.appendChild(row3);
          M.context = { type: "cloud" };
          M.open();
        }
        static openKeyModal(isFirst) {
          const M = ModalController;
          const box = M.box();
          box.innerHTML = "";
          box.appendChild(
            M.el(
              "div",
              { class: "modal-title" },
              isFirst
                ? "Облачная синхронизация — настройка ключа"
                : "Задать/сменить ключ синхронизации"
            )
          );
          box.appendChild(
            M.el(
              "div",
              {},
              "Придумайте ключ синхронизации (кодовую фразу, минимум 4 символа) и введите его на всех своих устройствах одинаково. Сам ключ на сервер не уходит — хранится только его хэш, который служит «адресом» вашей записи в облаке."
            )
          );
          const row = M.el("div", { class: "modal-row" });
          row.appendChild(
            M.el("input", {
              type: "password",
              id: "cloudKeyInput",
              placeholder: "Ключ синхронизации",
            })
          );
          box.appendChild(row);
          box.appendChild(M.errorRow());
          const btnRow = M.el("div", { class: "modal-row" });
          btnRow.appendChild(
            M.el(
              "button",
              {
                id: "cloudKeyConfirm",
                "data-modal-action": "cloud-key-confirm",
              },
              "Сохранить и синхронизировать"
            )
          );
          btnRow.appendChild(
            M.el(
              "button",
              { "data-modal-action": isFirst ? "cloud-skip" : "cancel" },
              isFirst ? "Продолжить без облака" : "Отмена"
            )
          );
          box.appendChild(btnRow);
          M.context = { type: "cloud-key" };
          M.open();
          const input = document.getElementById("cloudKeyInput");
          if (input) setTimeout(() => input.focus(), 50);
        }
        static async handleAction(action) {
          const M = ModalController;
          try {
            if (action === "cloud-set-key") {
              this.openKeyModal(false);
              return;
            }
            if (action === "cloud-skip") {
              CloudSync.setDisabled(true);
              M.close();
              CloudSync.updateCloudButton();
              return;
            }
            if (action === "cloud-key-confirm") {
              const input = document.getElementById("cloudKeyInput");
              const pass = ((input && input.value) || "").trim();
              if (pass.length < 4) {
                M.setError("Ключ слишком короткий (минимум 4 символа)");
                return;
              }
              await CloudSync.setKeyFromPassphrase(pass);
              M.close();
              // Если в облаке уже есть данные под этим ключом — принимаем их
              // (и перезагружаемся); иначе выгружаем локальное состояние.
              const row = await CloudSync.cloudGet();
              if (row && row.data) {
                CloudSync.reloading = true;
                CloudSync.applySnapshot(row.data);
                localStorage.setItem(
                  CloudSync.LS_PUSH_HASH,
                  CloudSync.snapshotContentHash(row.data)
                );
                if (row.updated_at) {
                  localStorage.setItem(
                    CloudSync.LS_LAST_SYNC,
                    String(row.updated_at)
                  );
                }
                location.reload();
              } else {
                await CloudSync.pushNow(true);
                this.openModal();
              }
              return;
            }
            if (action === "cloud-sync-now") {
              M.close();
              await CloudSync.pushNow();
              const applied = await CloudSync.pullNow(true);
              if (applied) CloudSync.reloadForSync(true);
              else this.openModal();
              return;
            }
            if (action === "cloud-force-push") {
              await CloudSync.pushNow(true);
              this.openModal();
              return;
            }
            if (action === "cloud-force-pull") {
              M.close();
              const applied = await CloudSync.pullNow(true);
              if (applied) CloudSync.reloadForSync(true);
              else this.openModal();
              return;
            }
            if (action === "cloud-toggle-disable") {
              if (CloudSync.isDisabled()) {
                CloudSync.setDisabled(false);
                if (!CloudSync.getKeyHash()) {
                  this.openKeyModal(false);
                  return;
                }
              } else {
                CloudSync.setDisabled(true);
              }
              CloudSync.updateCloudButton();
              this.openModal();
              return;
            }
          } catch (err) {
            CloudSync.lastError = String((err && err.message) || err);
            this.openModal();
          }
        }
      }
    </script>
  </body>
