<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Пропорциональный таймер</title>
    <style>
      /* =================================================================
         Оформление. Тёмно-синяя тема, моноширинный шрифт, скруглённые
         углы, компактные карточки. Палитра: фон #0a1530, карточки #14275a,
         акцент #6aa7ff, «хорошо» #5fd4a0, «просрочено» #ff7b8a, внимание #f2b84b.
         ================================================================= */
      html,
      body {
        height: 100%;
        min-height: 100%;
      }
      body {
        background-color: #0a1530;
        background-image: radial-gradient(
          ellipse at 50% -10%,
          #1c3672 0%,
          rgba(10, 21, 48, 0) 62%
        );
        background-attachment: fixed;
        color: #dbe5ff;
        margin: 0;
        padding: 0;
        font-family: "JetBrains Mono", "Cascadia Mono", "SF Mono", ui-monospace,
          Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.4;
      }
      input[type="number"],
      input[type="text"],
      input[type="time"],
      input[type="password"] {
        width: 60px;
        height: 28px;
        box-sizing: border-box;
        background-color: #0b1736;
        color: #dbe5ff;
        border: 1px solid #2a447f;
        border-radius: 7px;
        padding: 3px 8px;
        font-family: inherit;
        font-size: 12px;
      }
      input:focus {
        outline: none;
        border-color: #6aa7ff;
        box-shadow: 0 0 0 2px rgba(106, 167, 255, 0.25);
      }
      button {
        margin: 0;
        padding: 4px 11px;
        background-color: #17306a;
        color: #dbe5ff;
        border: 1px solid #2b4a92;
        border-radius: 8px;
        font-family: inherit;
        font-size: 12px;
        line-height: 1.3;
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s;
      }
      button:hover {
        background-color: #1f3d85;
        border-color: #4668b5;
      }
      button:active {
        transform: translateY(1px);
      }
      button[data-action="delete"]:hover,
      button[data-action="delete-folder"]:hover {
        background-color: #5a2233;
        border-color: #ff7b8a;
      }
      .time-display {
        margin: 0;
      }

      /* --- Верхняя панель ------------------------------------------- */
      #globalControls {
        position: sticky;
        top: 0;
        width: 100%;
        box-sizing: border-box;
        background-color: rgba(10, 21, 48, 0.92);
        border-bottom: 1px solid #1f3369;
        padding: 8px 14px;
        box-shadow: 0 4px 14px rgba(2, 8, 28, 0.45);
        z-index: 1000;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
      }
      #globalControls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #8ea3d4;
        font-size: 12px;
      }
      #globalEndTime {
        margin: 0;
      }
      #appTitle {
        color: #6aa7ff;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 0.5px;
        margin-right: 6px;
      }
      #scheduleStartLabel {
        white-space: nowrap;
      }
      #scheduleStart,
      #globalEndTime {
        width: 92px;
      }
      #menuButton {
        margin-left: auto;
      }
      #operationsMenu {
        position: absolute;
        top: 100%;
        right: 14px;
        background-color: #0f1e45;
        border: 1px solid #2b4a92;
        border-radius: 10px;
        padding: 4px;
        box-shadow: 0 10px 28px rgba(2, 8, 28, 0.6);
        display: none;
        flex-direction: column;
        z-index: 1200;
      }
      #operationsMenu.visible {
        display: flex;
      }
      #operationsMenu button {
        margin: 2px;
        text-align: left;
        white-space: nowrap;
        background-color: transparent;
        border-color: transparent;
      }
      #operationsMenu button:hover {
        background-color: #1f3d85;
      }
      #tzHolderButton {
        white-space: nowrap;
      }
      #tzHolderButton.tz-holder {
        border-color: #5fd4a0;
        color: #5fd4a0;
      }
      #tzHolderButton.tz-follower {
        border-color: #ff7b8a;
        color: #ff7b8a;
      }
      #tzHint {
        color: #8ea3d4;
        font-size: 11px;
        margin-left: 4px;
        white-space: nowrap;
      }
      #cloudButton.has-error {
        border-color: #ff7b8a;
        color: #ff7b8a;
      }
      #cloudButton.synced {
        border-color: #5fd4a0;
      }

      /* --- Дерево задач ----------------------------------------------
         Сущности идут в ряд ВЕРТИКАЛЬНО (ТЗ 8.1) и по центру экрана;
         вложенность — отступом слева у .folder-children (ТЗ 8.2). */
      #timersContainer {
        margin: 0 auto;
        padding: 14px 12px 48px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #timersContainer > .timer-container,
      #timersContainer > .folder-node {
        width: 100%;
        max-width: 440px;
      }

      /* --- Карточка таймера ------------------------------------------
         Сетка 4 колонок. В свёрнутом виде три строки:
         [стрелки | название | приоритет]
         [цель                    | доля]
         [Факт / Осталось         | кнопки]
         Подписи полей скрыты там, где достаточно подсказки в поле. */
      .timer-container {
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr) auto;
        column-gap: 8px;
        row-gap: 6px;
        align-items: center;
        box-sizing: border-box;
        min-width: 0;
        margin: 5px 0;
        padding: 10px 12px;
        background-color: #12234d;
        background-image: linear-gradient(180deg, #162b61 0%, #112247 100%);
        border: 1px solid #243d7a;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(2, 8, 28, 0.4);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .timer-container[data-tracking="true"] {
        border-color: #4fbf93;
        box-shadow: 0 0 0 1px rgba(79, 191, 147, 0.4),
          0 8px 24px rgba(10, 70, 55, 0.4);
      }
      .timer-container > * {
        grid-column: 1 / -1;
        min-width: 0;
        margin: 0;
      }
      .timer-container > .compact-toggle-container {
        grid-column: 1;
        grid-row: 1;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .timer-container > .name-input-container {
        grid-column: 2 / 4;
        grid-row: 1;
      }
      .timer-container > .priority-display-container {
        grid-column: 4;
        grid-row: 1;
      }
      .timer-container > .target-container {
        grid-column: 1 / 3;
        grid-row: 2;
      }
      .timer-container > .share-container {
        grid-column: 3 / 5;
        grid-row: 2;
        justify-self: end;
      }
      .timer-container > .tracked-display-container {
        grid-column: 1;
        grid-row: 3;
      }
      .timer-container > .remaining-display-container {
        grid-column: 2 / 4;
        grid-row: 3;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .timer-container > .remaining-display-container::before {
        content: "/";
        color: #4b64a3;
        font-size: 18px;
      }
      .timer-container > .buttons-container {
        grid-column: 4;
        grid-row: 3;
        justify-self: end;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }
      /* Развернутая карточка: кнопки и подробности идут отдельными строками */
      .timer-container:not(.collapsed) > .buttons-container {
        grid-column: 1 / -1;
        grid-row: auto;
        justify-self: stretch;
        justify-content: flex-start;
        border-top: 1px solid #243d7a;
        padding-top: 8px;
      }
      .timer-container:not(.collapsed) > .proportion-container {
        border-top: 1px solid #243d7a;
        padding-top: 8px;
      }
      .timer-container:not(.collapsed) > .remaining-display-container::before {
        display: none;
      }
      .name-input-container .field-label {
        display: none;
      }
      .name-input-container input[type="text"] {
        width: 100%;
        font-size: 13px;
        font-weight: 600;
        background-color: transparent;
        border-color: transparent;
        padding-left: 4px;
      }
      .name-input-container input[type="text"]:hover {
        border-color: #2a447f;
      }
      .name-input-container input[type="text"]:focus {
        background-color: #0b1736;
      }
      .field-label {
        display: inline-block;
        min-width: 130px;
        color: #8ea3d4;
        font-size: 12px;
        margin-right: 6px;
      }
      .target-container .field-label,
      .share-container .field-label {
        min-width: 0;
        margin-right: 4px;
      }
      .target-container input[type="number"],
      .share-container input[type="number"] {
        width: 74px;
      }
      .proportion-container,
      .target-container,
      .tracked-inputs-container,
      .total-inputs-container,
      .recommendation-display-container,
      .priority-display-container,
      .actual-proportion-container {
        margin: 0;
      }
      .tracked-inputs-container,
      .total-inputs-container {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
      }
      .tracked-inputs-container input[type="number"],
      .total-inputs-container input[type="number"] {
        width: 48px;
      }
      .recommendation-display,
      .actual-proportion {
        color: #8ea3d4;
        font-size: 12px;
      }

      /* Время: подпись мелко сверху, значение крупнее, «Факт / Осталось» в ряд */
      .time-display {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
      }
      .time-display .lbl {
        color: #8ea3d4;
        font-size: 10px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
      .time-display span:not(.lbl) {
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.2px;
      }
      .planned-display-container .time-display,
      .total-display-container .time-display {
        flex-direction: row;
        align-items: baseline;
        gap: 10px;
      }
      .planned-display-container .time-display .lbl,
      .total-display-container .time-display .lbl {
        min-width: 56px;
      }
      .planned-display-container .time-display span:not(.lbl),
      .total-display-container .time-display span:not(.lbl) {
        font-size: 13px;
      }
      .time-ok {
        color: #5fd4a0;
      }
      .time-over {
        color: #ff7b8a;
      }
      .timer-container[data-tracking="true"] [id^="tracked-"] {
        color: #6aa7ff;
      }

      /* Приоритет: «пилюля»; первый приоритет мягко мигает */
      .timer-container > .priority-display-container {
        justify-self: end;
      }
      .priority-display-container > div {
        display: inline-block;
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 999px;
        background-color: #1b3167;
        border: 1px solid #2d4b93;
        color: #9fb3e3;
        white-space: nowrap;
      }
      .priority-display-container > div.priority-top {
        color: #ffe7b0;
        background-color: #4a3a12;
        border-color: #e0a93b;
        animation: priority-blink 1.5s ease-in-out infinite;
      }
      @keyframes priority-blink {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(242, 184, 75, 0);
          opacity: 1;
        }
        50% {
          box-shadow: 0 0 0 4px rgba(242, 184, 75, 0.32);
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .priority-display-container > div.priority-top {
          animation: none;
        }
      }

      /* Кнопка Старт/Пауза: текст остаётся прежним, значок — оформление */
      button[data-action="track"] {
        background-color: #1c5a49;
        border-color: #2f8f73;
        color: #d8fff0;
        min-width: 74px;
      }
      button[data-action="track"]::before {
        content: "\25B6\00a0";
        font-size: 10px;
      }
      button[data-action="track"]:hover {
        background-color: #247159;
        border-color: #49b392;
      }
      .timer-container[data-tracking="true"] button[data-action="track"] {
        background-color: #6b4f12;
        border-color: #c9962f;
        color: #ffe9b8;
      }
      .timer-container[data-tracking="true"] button[data-action="track"]::before {
        content: "\23F8\00a0";
      }

      /* --- Компактный режим -----------------------------------------
         По умолчанию карточка СВЁРНУТА — видны только Название, Целевая
         пропорция, Доля, Факт, Осталось, Приоритет и кнопки Старт/Пауза и
         «В группу». Строки, которым разрешено оставаться видимыми, помечены
         классом compact-visible (см. TimerView.appendTimerElements); сама
         стрелка живёт в compact-toggle-container и видна всегда.
         Элементы НЕ удаляются из DOM: в них продолжают писать
         updateDisplay/updateTimer*, поэтому расчёты и облачная синхронизация
         сворачивания «не замечают». */
      .compact-toggle-container {
        margin: 0;
      }
      .compact-toggle,
      .move-buttons .move-button {
        margin: 0;
        padding: 0;
        width: 22px;
        height: 22px;
        font-size: 11px;
        line-height: 1;
        border-radius: 6px;
        background-color: transparent;
        border-color: #2b4a92;
        color: #9fb3e3;
      }
      .compact-toggle:hover,
      .move-buttons .move-button:hover {
        color: #ffffff;
      }
      .timer-container.collapsed {
        padding: 9px 12px;
      }
      .timer-container.collapsed > *:not(.compact-visible) {
        display: none;
      }
      /* «В группу» (ТЗ 6.1) остаётся доступной и в свёрнутой карточке */
      .timer-container.collapsed .buttons-container button:not([data-action="track"]):not([data-action="to-group"]) {
        display: none;
      }
      button[data-action="to-group"] {
        background-color: transparent;
        color: #9fb3e3;
      }

      /* --- Группы (папки) -------------------------------------------- */
      .folder-node {
        box-sizing: border-box;
        margin: 5px 0;
        padding: 8px 10px;
        background-color: rgba(255, 255, 255, 0.03);
        border: 1px solid #2b4a92;
        border-radius: 12px;
        flex: 0 1 auto;
        min-width: 0;
      }
      .folder-header {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto auto;
        align-items: center;
        gap: 6px;
      }
      .folder-header > .move-buttons {
        grid-column: 1;
        grid-row: 1;
      }
      .folder-header > .folder-label {
        display: none;
      }
      .folder-header > .folder-name {
        grid-column: 2 / 5;
        grid-row: 1;
        width: auto;
        min-width: 0;
        font-weight: 600;
      }
      .folder-header > .folder-toggle {
        grid-column: 5;
        grid-row: 1;
      }
      .folder-header > .folder-target {
        grid-column: 1 / 3;
        grid-row: 2;
      }
      .folder-header > .folder-share {
        grid-column: 3;
        grid-row: 2;
      }
      .folder-header > button[data-action="to-group"] {
        grid-column: 4;
        grid-row: 2;
      }
      .folder-header > button[data-action="delete-folder"] {
        grid-column: 5;
        grid-row: 2;
      }
      .folder-label {
        min-width: 0;
        margin-right: 0;
        color: #8ea3d4;
      }
      .folder-target,
      .folder-share {
        color: #8ea3d4;
        font-size: 11px;
        margin: 0 2px;
        white-space: nowrap;
      }
      .folder-share,
      .share-container .share-value {
        color: #6aa7ff;
        border: 1px solid #2b4a92;
        border-radius: 999px;
        padding: 1px 8px;
        cursor: help;
      }
      .folder-action {
        padding: 2px 9px;
        background-color: transparent;
        color: #9fb3e3;
      }
      /* Стрелка сворачивания группы — СПРАВА (ТЗ 8.3) */
      .folder-toggle {
        margin-left: auto;
        padding: 1px 9px;
      }
      .folder-children {
        margin-left: 14px;
        padding-left: 8px;
        border-left: 1px solid #243d7a;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      .folder-children > .timer-container,
      .folder-children > .folder-node {
        max-width: none;
        width: auto;
      }
      .folder-node.collapsed > .folder-children {
        display: none;
      }
      /* Стрелки перемещения — СЛЕВА на таймере и на папке (ТЗ 8.4) */
      .move-buttons {
        display: inline-flex;
        gap: 4px;
        margin-right: 0;
      }
      .share-container {
        margin: 0;
      }

      /* --- Модальные окна --------------------------------------------- */
      #modalOverlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(4, 9, 24, 0.72);
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #modalOverlay.hidden {
        display: none;
      }
      #modalBox {
        background: #0f1e45;
        border: 1px solid #2b4a92;
        border-radius: 14px;
        box-shadow: 0 18px 50px rgba(2, 8, 28, 0.7);
        padding: 18px;
        min-width: 320px;
        max-width: min(520px, 92vw);
        max-height: 82vh;
        overflow: auto;
      }
      #modalBox .modal-row input[type="text"],
      #modalBox input[type="password"] {
        flex: 1 1 140px;
        width: auto;
        min-width: 0;
        max-width: 340px;
      }
      #modalBox > input[type="password"],
      #modalBox > input[type="text"] {
        width: 100%;
        max-width: none;
        box-sizing: border-box;
        margin: 6px 0;
      }
      .modal-title {
        color: #6aa7ff;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .modal-row {
        margin: 8px 0;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .modal-error {
        color: #ff7b8a;
        min-height: 1.2em;
        margin: 6px 0;
      }
      .modal-hint {
        color: #8ea3d4;
        font-size: 12px;
        margin: 6px 0;
      }
      .cloud-status div {
        margin: 2px 0;
      }
      .cloud-action-btn {
        flex: 1;
        white-space: nowrap;
      }
      .group-select-item {
        display: block;
        margin: 4px 0;
      }

      /* --- Конструктор дня -------------------------------------------- */
      #modalBox.day-builder {
        min-width: 560px;
        width: 980px;
        max-width: 94vw;
      }
      #modalBox.day-builder .modal-row input[type="text"] {
        flex: 0 0 auto;
      }
      .dd-toolbar {
        justify-content: flex-start;
      }
      .dd-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        border: 1px solid #243d7a;
        border-radius: 10px;
        padding: 5px 8px;
        margin: 4px 0;
        background: #0c1a3d;
      }
      .dd-row.dd-group {
        border-color: #4668b5;
      }
      .dd-row.dd-red {
        border-color: #ff7b8a;
        background: rgba(255, 123, 138, 0.12);
      }
      .dd-row.dd-blue {
        border-color: #6aa7ff;
        background: rgba(106, 167, 255, 0.14);
      }
      .dd-kind {
        color: #8ea3d4;
        font-size: 11px;
        min-width: 110px;
      }
      .dd-row .dd-name {
        width: 150px;
      }
      .dd-row .dd-time {
        width: 64px;
        text-align: center;
      }
      .dd-duration {
        color: #9fb3e3;
        font-size: 12px;
      }
      .dd-section {
        margin: 12px 0 4px;
        color: #6aa7ff;
        font-weight: bold;
        border-top: 1px dashed #2b4a92;
        padding-top: 8px;
      }
      .dd-errors {
        white-space: pre-line;
      }
      @media (max-width: 560px) {
        #globalControls {
          padding: 6px 8px;
        }
        #modalBox.day-builder {
          min-width: 0;
          width: 96%;
        }
      }
    </style>
  </head>
  <body>
    <div id="globalControls">
      <div id="appTitle">physus</div>
      <label> Конец: <input type="time" id="globalEndTime" />
        <span id="tzHint"></span>
      </label>
      <label id="scheduleStartLabel" title="Калибрует расписание «Конструктора дня»; на Цели и планы не влияет">
        Начало (для конструктора):
        <input type="time" id="scheduleStart" value="00:00" />
      </label>
      <button data-action="add-timer">+ Добавить таймер</button>
      <!-- Кнопка «Отошёл» убрана из интерфейса: её механизм (away-режим)
           теперь включается автоматически, пока не идёт отсчёт ни одного
           таймера (TimeManager.syncAutoAway). -->
      <button
        id="tzHolderButton"
        data-action="tz-holder"
        title="Носитель часового пояса"
      >
        🕒 Носитель часового пояса
      </button>      <button id="saveTimersToLocalStorageManually" data-action="save">
        Сохранить
      </button>
      <button id="exportButton" data-action="export">Экспорт</button>
      <button id="importButton" data-action="import">Импорт</button>
      <button

    <script>
      // ============================================================

      // ============================================================
      // Версия приложения — видна в окне облака (контроль деплоя)
      const APP_VERSION = "2026-11-01-groups";
      const CLOUD_CONFIG = {
        url: "https://iqvqjiwjizlzronudgui.supabase.co",
        anonKey: "sb_publishable_da50tn1zQ9kDLuf0UsdAiw_yzMelb7J", // publishable key (безопасен для браузера)
        syncIntervalMs: 20000, // интервал фоновой синхронизации, мс
      };
      class NotificationService {
        static initializeNotificationSystem() {
          Notification.requestPermission();
        }
        static checkNotificationPermission() {
          return Notification.permission === "granted";
        }
        static showNotification(title, message) {
          if (this.checkNotificationPermission()) {
            new Notification(title, {
              body: message,
            });

        static notifyTaskCompleted(taskName) {

      class EventService {
        static setupEventDelegation() {
          const timersContainer = AppState.getTimersContainerElement();
          timersContainer.addEventListener(
            "click",
            this.handleTimersContainerClick
          );
          timersContainer.addEventListener(
            "change",
            this.handleTimersContainerChange
          );
          // Автообновление при получении/потере фокуса поля ввода
          timersContainer.addEventListener(
            "focusin",
            this.handleFieldFocusTrigger
          );
          timersContainer.addEventListener(
            "focusout",
            this.handleFieldFocusTrigger
          );
          const globalControls = document.getElementById("globalControls");
          globalControls.addEventListener(
            "click",
            this.handleGlobalControlsClick
          );
          globalControls.addEventListener(
            "focusin",
            this.handleFieldFocusTrigger
          );
          globalControls.addEventListener(
            "focusout",
            this.handleFieldFocusTrigger
          );
          const globalEndTimeInput = document.getElementById("globalEndTime");
          globalEndTimeInput.addEventListener(
            "input",
            TimerController.handleGlobalEndTimeInput
          );
          // «Конец» влияет на расписание конструктора (3.3.5, 3.4, 5.8)
          globalEndTimeInput.addEventListener("input", () =>
            ScheduleModel.onEndFieldTyping()
          );
          globalEndTimeInput.addEventListener("change", () =>
            ScheduleModel.onEndFieldCommitted()
          );
          const scheduleStartInput = document.getElementById("scheduleStart");
          if (scheduleStartInput) {
            scheduleStartInput.addEventListener("input", e =>
              ScheduleModel.onStartField(e.target.value, false)
            );
            scheduleStartInput.addEventListener("change", e =>
              ScheduleModel.onStartField(e.target.value, true)
            );
          }
          const modalOverlay = document.getElementById("modalOverlay");
          modalOverlay.addEventListener("click", ModalController.handleOverlayClick);
          modalOverlay.addEventListener("change", e =>
            DayBuilder.handleChange(e.target)
          );
          modalOverlay.addEventListener("input", e =>
            DayBuilder.handleInput(e.target)
          );
          // Поле времени при входе выделяется целиком: новое значение
          // вводится поверх старого, а не дописывается к нему
          modalOverlay.addEventListener("focusin", e =>
            DayBuilder.handleFocus(e.target)
          );
        }
        static handleFieldFocusTrigger(event) {
          // «Дать фокус» / «убрать фокус» с поля — триггер автообновления
          if (event.target && event.target.tagName === "INPUT") {
            AppController.autoUpdate();
          }
        }
        static handleTimersContainerClick(event) {
          return TimerController.handleTimersContainerClick(event);
        }
        static handleTimersContainerChange(event) {
          return TimerController.handleTimersContainerChange(event);
        }
        static handleGlobalControlsClick(event) {
          // Открыт «Конструктор дня»: основной экран не редактируется (11.4.1)
          if (DayBuilder.isOpen()) return;
          // Автообновление срабатывает при каждом клике ДО целевого действия
          // (бывшие кнопки «Обновить всё», «Рекомендация»,
          // «Применить рекомендацию» убраны из интерфейса).
          AppController.autoUpdate();
          const target = event.target;
          if (target.tagName === "BUTTON") {
            const action = target.getAttribute("data-action");
            if (action === "add-timer") {
              AddTaskController.openModal();
            } else if (action === "menu") {
              MenuController.toggle();
            } else if (action === "create-group") {
              MenuController.hide();
              CreateGroupController.openModal();
            } else if (action === "create-in-group") {
              MenuController.hide();
              GroupTaskController.openModal();
            } else if (action === "day-builder") {
              MenuController.hide();
              DayBuilder.open();
            } else if (action === "save") {
              AppController.saveTimers();
            } else if (action === "export") {
              AppController.exportTimers();
            } else if (action === "import") {
              AppController.importTimers();
            } else if (action === "tz-holder") {
              TimeZoneHolder.claim();
            } else if (action === "cloud") {
              CloudController.openModal();
            }
          }
        }
      }
      class SessionManager {
        static isJustAfterReset = false;
        static clearJustAfterResetFlag() {
          this.isJustAfterReset = false;
        }
        static checkForSessionReset() {
          const lastSessionEndTime = AppState.getLastSessionEndTime();
          if (!lastSessionEndTime) return false;
          const now = new Date(CloudSync.serverNow());
          if (now >= lastSessionEndTime) {
            AppState.setNeedsReset(true);
            return true;
          }
          return false;
        }
        static performSessionReset() {
          if (!AppState.getNeedsReset()) return;
          const timers = AppState.getTimers();
          timers.forEach(timer => {
            timer.lastSessionDisplayProportion =
              ProportionCalculator.getActualProportion(timer.id);
            timer.originalDailyTotalSeconds = timer.dailyTotalSeconds;
            timer.dailyTotalSeconds = 0;
            timer.dailyTrackedSeconds = 0;
            timer.trackedSeconds = 0;
            timer.lastResetTime = new Date();
            if (timer.isTracking) {
              // Идёт отсчёт — новая сессия продолжает его с нуля
              TimerModel.rebaseTracking(timer);
            }
          });
          this.isJustAfterReset = true;
          AppState.setNeedsReset(false);
          // Фикс БАГ #2: сразу сдвигаем границу сессии в будущее, чтобы сброс
          // выполнялся строго один раз. Раньше, если globalEndTime отсутствовал
          // (например, терялся после перезагрузки страницы), needsReset
          // взводился каждый тик и счётчики обнулялись каждые 200 мс.
          this.advanceSessionEndTime();
          AppState.notify("sessionReset");
        }
        static advanceSessionEndTime() {
          const last = AppState.getLastSessionEndTime();
          if (!last) return;
          const now = new Date(CloudSync.serverNow());
          if (now < last) return;
          const globalEnd = AppState.getGlobalEndTime();
          if (globalEnd && !isNaN(globalEnd.getTime())) {
            const next = new Date(globalEnd.getTime());
            while (next <= now) {
              next.setDate(next.getDate() + 1);
            }
            AppState.setLastSessionEndTime(next);
          } else {
            // Время конца не задано — естественная граница сессии: полночь.
            AppState.setLastSessionEndTime(TimeCalculator.getNextMidnight(now));
          }
        }
        static updateSessionEndTime(globalEndTime) {
          if (globalEndTime) {
            AppState.setLastSessionEndTime(new Date(globalEndTime));
          }
        }
        static checkAndPerformReset() {
          this.checkForSessionReset();
          this.performSessionReset();
        }
      }
      class AppController {
        static init() {
          TimerView.init();
          StorageService.loadTimersFromLocalStorage();
          SessionManager.checkForSessionReset();
          EventService.setupEventDelegation();
          this.setupIntervalUpdates();
          this.setupEventSubscriptions();
          // Дерево: порядок и вложенность из сохранённого состояния (или из
          // порядка списка таймеров, если ключа "tree" ещё нет)
          TreeModel.ensureTimerNodes();
          TimerView.renderTree();
          ScheduleModel.renderStartField();
          // Носитель часового пояса: индикация + заявление при отсутствии
          TimeZoneHolder.ensure();
        }
        static setupIntervalUpdates() {
          setInterval(() => CalculationService.updateCalculations(), 200);
          setInterval(() => StorageService.saveTimersToLocalStorage(), 60000);
        }
        static setupEventSubscriptions() {
          AppState.subscribe("timerRemoved", timer => {
            if (AppState.getGlobalEndTime()) {
              TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
            }
            CalculationService.updateCalculations();
          });
          AppState.subscribe("timerPlansUpdated", timers => {
            timers.forEach(t => {
              TimerView.updateTimerPlannedTime(t);
              TimerView.updateTimerRemainingTime(t);
            });
          });
        }
        static addNewTimer(name = "", share = null) {
          SessionManager.clearJustAfterResetFlag();
          const timers = AppState.getTimers();
          if (timers.length === 0 || share === null) {
            // Первая задача (или служебное добавление) — обычное создание
            const newTimer = TimerModel.createTimer();
            newTimer.name = name || "";
            AppState.addTimer(newTimer);
            TreeModel.insertTimerNode(newTimer.id);
            if (AppState.getGlobalEndTime()) {
              TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
            }
            CalculationService.updateCalculations();
            CloudSync.bumpControl();
            return newTimer;
          }
          // ТЗ 5.4: «+ Добавить таймер» — создание задачи на КОРНЕВОМ уровне.
          // Ужимаются только корневые сиблинги, общая сумма сохраняется;
          // папки-сиблинги меняют всё своё содержимое в одно и то же число
          // раз, поэтому внутренние доли в них не меняются (ТЗ 5.4.3).
          return this.createTaskInRoot(name, share);
        }
        static createTaskInRoot(name, share) {
          return this.createTaskInLevel(null, name, share);
        }
        static createTaskInFolder(folderId, name, share) {
          const loc = TreeModel.findNode(folderId);
          if (!loc || !TreeModel.isFolder(loc.node)) return null;
          return this.createTaskInLevel(loc.node, name, share);
        }
        /**
         * Общая механика создания задачи внутри уровня (ТЗ 5.3.4 и 5.4):
         * содержимое уровня ужимается в (1 − p), новая задача получает долю p,
         * сумма уровня не меняется — значит за его пределами не меняется
         * ничего. Папка ужимается целиком (равномерно), поэтому её внутренние
         * доли сохраняются (ТЗ 3.9.2). level = null означает корень.
         */
        static createTaskInLevel(level, name, share) {
          SessionManager.clearJustAfterResetFlag();
          const children = level
            ? level.children || (level.children = [])
            : TreeModel.root();
          let p = Number(
            typeof share === "string" ? Utils.parseShareInput(share) : share
          );
          if (!Number.isFinite(p) || p < 0) p = 0;
          if (p >= 1) p = 1 - 1e-9;
          const levelTarget = TreeModel.levelSumNodes(children);
          const levelWeight = TreeModel.levelWeightNodes(children);
          const memberIds = [];
          children.forEach(node =>
            memberIds.push(...TreeModel.descendantTimerIds(node))
          );
          const history = memberIds.reduce((sum, id) => {
            const t = AppState.findTimerById(id);
            return sum + (t ? Number(t.totalSeconds) || 0 : 0);
          }, 0);
          const newTimer = TimerModel.createTimer();
          newTimer.name = name || "";
          newTimer.proportion = levelWeight * p;
          newTimer.targetProportion = levelTarget * p;
          // «Виртуальная история» p·G/(1−p): фактическая доля новой задачи
          // сразу равна целевой, и рекомендации не перекашиваются.
          const virtualTime = p < 1 ? (p * history) / (1 - p) : 0;
          newTimer.totalSeconds = virtualTime;
          newTimer.dailyTotalSeconds = virtualTime;
          newTimer.originalDailyTotalSeconds = virtualTime;
          newTimer.lifetimeTotalSeconds = virtualTime;
          newTimer.recommendedProportion = 0;
          children.forEach(node => TreeModel.scaleNode(node, 1 - p, 1 - p));
          AppState.addTimer(newTimer);
          if (level) {
            TreeModel.moveToFolder(newTimer.id, level.id);
          } else {
            TreeModel.insertTimerNode(newTimer.id);
          }
          TimerView.renderTree();
          TimerView.syncAllProportionInputs();
          if (AppState.getGlobalEndTime()) {
            TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
          }
          CalculationService.updateCalculations();
          this.autoUpdate();
          CloudSync.bumpControl();
          return newTimer;
        }
        static createTaskInGroup(groupIds, name, share, folderName) {
          // «Создать задачу внутри группы» (ТЗ 5.3):
          //  - выбираются существующие группы-папки (5.3.1);
          //  - если папок ещё нет, выбираются таймеры (5.3.2) — они и есть
          //    визуальная группа, поэтому из отмеченных создаётся папка;
          //  - доля p — доля новой задачи ВНУТРИ папки: содержимое папки
          //    ужимается в (1 − p), сумма папки не меняется, а за её
          //    пределами не меняется ничего (5.3.4).
          SessionManager.clearJustAfterResetFlag();
          const ids = (groupIds || []).map(Number).filter(Number.isFinite);
          if (!ids.length) return null;
          const folderIds = ids.filter(id => {
            const loc = TreeModel.findNode(id);
            return Boolean(loc) && TreeModel.isFolder(loc.node);
          });
          let folderId;
          if (folderIds.length) {
            folderId = folderIds[0];
          } else {
            const folder = TreeModel.wrapNodesIntoFolder(ids, folderName);
            if (!folder) return null;
            folderId = folder.id;
          }
          return this.createTaskInFolder(folderId, name, share);
        }
        static splitTimer(timerId, specs, folderName) {
          // «Разбить задачу на подзадачи»: ВСЕ счётчики времени делятся
          // пропорционально долям (а не копируются целиком), счётчики трекинга
          // сбрасываются. По ТЗ 5.2 подзадачи автоматически группируются
          // в папку на месте исходного таймера: название папки предлагается
          // в модалке, по умолчанию — имя таймера, из которого разбивали.
          // Целевые пропорции подзадач делятся в указанных долях, поэтому
          // доли внутри новой папки равны долям разбиения (ТЗ 5.2.5), но
          // отдельным полем они больше НЕ хранятся — доля выводится из целей
          // и пересчитывается при любом изменении состава (ТЗ 4.4).
          SessionManager.clearJustAfterResetFlag();
          const timers = AppState.getTimers();
          const index = timers.findIndex(t => t.id === timerId);
          if (index === -1) return null;
          const parent = timers[index];
          ScheduleModel.reconcile();
          const totalShare = specs.reduce((sum, x) => sum + x.share, 0);
          if (!(totalShare > 0)) return null;
          const children = specs.map(spec => {
            const share = spec.share / totalShare; // нормализация к сумме 1
            const child = {
              ...parent,
              id: Utils.generateId(),
              name: spec.name,
              proportion: (parent.proportion || 0) * share,
              targetProportion: (parent.targetProportion || 0) * share,
              recommendedProportion: 0,
              trackedSeconds: (parent.trackedSeconds || 0) * share,
              totalTrackedSeconds: (parent.totalTrackedSeconds || 0) * share,
              totalDuration: (parent.totalDuration || 0) * share,
              dailyTrackedSeconds: (parent.dailyTrackedSeconds || 0) * share,
              totalSeconds: (parent.totalSeconds || 0) * share,
              dailyTotalSeconds: (parent.dailyTotalSeconds || 0) * share,
              originalDailyTotalSeconds:
                (parent.originalDailyTotalSeconds || 0) * share,
              lifetimeTotalSeconds: (parent.lifetimeTotalSeconds || 0) * share,
              plannedSeconds: 0,
              baseAllocation: 0,
              remainingSeconds: 0,
              isTracking: false,
              startTime: null,
              trackingSnapshot: null,
              lastResetTime: new Date(),
              shouldUpdateProportion: false,
            };
            delete child.lastSessionDisplayProportion;
            // Наследие прежнего разбиения (ТЗ 4.4): доля больше не поле модели
            delete child.splitShare;
            delete child.splitId;
            delete child.splitParentName;
            return child;
          });
          const newTimers = timers
            .slice(0, index)
            .concat(children, timers.slice(index + 1));
          const folderTitle =
            folderName === undefined ||
            folderName === null ||
            String(folderName).trim() === ""
              ? parent.name || ""
              : String(folderName).trim();
          // Дерево меняем ДО обновления модели таймеров и БЕЗ оповещения:
          // иначе renderTree выбросил бы узлы ещё не созданных подзадач.
          const loc = TreeModel.findNode(timerId);
          const folderNode = TreeModel.createFolderNode(folderTitle);
          children.forEach(child =>
            folderNode.children.push(TreeModel.createTimerNode(child.id))
          );
          if (loc) {
            loc.siblings.splice(loc.index, 1, folderNode);
          } else {
            TreeModel.root().push(folderNode);
          }
          ScheduleModel.replaceId(timerId, folderNode.id);
          AppState.setTimers(newTimers);
          TimerView.forgetCompactState(timerId);
          TreeModel.changed();
          // Одна перерисовка: карточка родителя уходит сама (её узла нет
          // в дереве), карточки подзадач создаются внутри папки.
          TimerView.renderTree();
          if (AppState.getGlobalEndTime()) {
            TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
          }
          CalculationService.updateCalculations();
          TimerView.syncAllProportionInputs();
          this.autoUpdate();
          CloudSync.bumpControl();
          return children;
        }
        static toggleTracking(id) {
          TimerController.toggleTracking(id);
        }
        static resetTimer(timer) {
          TimerController.resetTimer(timer);
        }
        static deleteTimer(timer) {
          TimerController.deleteTimer(timer);
        }
        static updateTimer(timer) {
          TimerController.updateTimer(timer);
        }
        static calculateRecommendations() {
          SessionManager.checkAndPerformReset();
          CalculationService.calculateRecommendedProportions(
            AppState.getTimers(),
            CalculationService.getTotalTime()
          );
          CalculationService.calculatePriority(AppState.getTimers());
        }
        static applyRecommendations() {
          // Бывшая «Применить рекомендацию», но чтение из модели, а не из
          // текста DOM: рекомендованные пропорции становятся текущими весами,
          // затем планы и рекомендации пересчитываются от новых весов.
          SessionManager.clearJustAfterResetFlag();
          const timers = AppState.getTimers();
          timers.forEach(timer => {
            const rec = Number(timer.recommendedProportion);
            if (Number.isFinite(rec) && rec >= 0) {
              timer.proportion = rec;
              const input = AppState.getTimerProportionElement(timer.id);
              if (input) {
                input.value = String(rec);
              }
            }
          });
          TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
          CalculationService.calculateRecommendedProportions(
            timers,
            CalculationService.getTotalTime()
          );
          CalculationService.calculatePriority(timers);
          AppState.notify("displayNeedsUpdate");
        }
        static updateAllTimers() {
          // Бывшее «Обновить всё»: планы всех таймеров + рекомендации + приоритеты
          TimeManager.updateGlobalEndTimeAndPlans(null, null, false);
          AppController.calculateRecommendations();
        }
        static refreshDistribution() {
          // Пересчёт распределения от настенного времени: планы всех задач,
          // рекомендации, приоритеты. Общая часть пользовательского и
          // «служебного» (ролловер сессии) автообновления.
          this.updateAllTimers();
          this.applyRecommendations();
        }
        static autoUpdate() {
          // Единая точка ПОЛЬЗОВАТЕЛЬСКОГО автообновления. Триггеры:
          //  - любой пользовательский клик (до целевого действия);
          //  - получение/потеря фокуса поля ввода.
          SessionManager.checkAndPerformReset();
          // Пользовательское действие (клик/фокус) — немедленная синхронизация
          CloudSync.interactiveSync();
          // Away-режим теперь включён постоянно, пока не идёт отсчёт ни
          // одного таймера (TimeManager.syncAutoAway), поэтому заморозка
          // распределения здесь НЕ применяется: иначе правки «Конца», весов и
          // целей, добавление и удаление задач перестали бы отображаться.
          // Заморозка нужна только фоновому тику — она живёт там, где тик
          // пересчитывает распределение (CalculationService.updateCalculations
          // → ролловер сессии): в away-режиме планы уменьшает handleAwayMode,
          // а пересчёт от настенного времени стёр бы эти вычитания.
          this.refreshDistribution();
        }
        static saveTimers() {
          StorageService.saveTimersToLocalStorage();
          // Ручное «Сохранить» сразу отправляет состояние в облако
          CloudSync.pushNow(true);
        }
        static exportTimers() {
          StorageService.exportTimersToFile();
        }
        static importTimers() {
          StorageService.importTimersFromFile();
        }
      }
      function initializeOnLoad() {
        AppController.init();
      }
      // Запуск: сначала приложение стартует на локальном состоянии,
      // затем подключается облако — если облачная запись отличается,
      // она применяется и страница перезагружается.
      window.onload = async () => {
        initializeOnLoad();
        CloudSync.startPeriodic();
        await CloudSync.boot();
      };
      NotificationService.initializeNotificationSystem();
      const AppState = {
        timers: [],

      class TimerModel {
        static createTimer() {

            trackedSeconds: 0,

            startTime: null,

            dailyTrackedSeconds: 0,

        }
        static resetTimer(timer) {
          // Фикс (семантика "отмена"): «Сброс» полностью отменяет время,
          // намерянное в текущей сессии. Дельта вычитается из всех счётчиков,
          // которые увеличивал трекинг, — включая «Всего» и дневные итоги, —
          // чтобы отменённое время не оставалось в «Фактической пропорции»
          // и рекомендациях. Симметрично ручному вводу «Факт = 0».
          const tracked = Number(timer.trackedSeconds) || 0;
          const dailyBefore = Number(timer.dailyTotalSeconds) || 0;
          const originalBefore = Number(timer.originalDailyTotalSeconds) || 0;
          if (tracked !== 0) {

          // Вчерашняя/ручная база выше дневного итога остаётся нетронутой.
          if (tracked !== 0 && originalBefore <= dailyBefore) {

            "totalSeconds",
            "dailyTotalSeconds",

          // (даже с расстроенными часами) вычислит одинаковый Факт
          timer.startTime = new Date(CloudSync.serverNow());
          // Снимок счётчиков на момент старта: факт выводится как
          // «снимок + (сейчас − startTime)», поэтому любое устройство
          // получает одинаковые значения (зеркалирование без двойного счёта).
          timer.trackingSnapshot = this.captureSnapshot(timer);

        static captureSnapshot(timer) {

            trackedSeconds: timer.trackedSeconds || 0,
            totalTrackedSeconds: timer.totalTrackedSeconds || 0,
            totalDuration: timer.totalDuration || 0,
            dailyTrackedSeconds: timer.dailyTrackedSeconds || 0,
            totalSeconds: timer.totalSeconds || 0,
            dailyTotalSeconds: timer.dailyTotalSeconds || 0,
            lifetimeTotalSeconds: timer.lifetimeTotalSeconds || 0,
            originalDailyTotalSeconds: timer.originalDailyTotalSeconds || 0,
          };
        }
        static rebaseTracking(timer) {
          // После ручной правки счётчиков во время трекинга — вывод
          // продолжается от новых значений
          if (timer.isTracking) {
            timer.startTime = new Date(CloudSync.serverNow());
            timer.trackingSnapshot = this.captureSnapshot(timer);
          }
        }
        static stopTracking(timer) {
          // Точная фиксация накопленного перед остановкой
          this.syncTrackedFromClock(timer, new Date(CloudSync.serverNow()));

        static pauseAt(timer, when) {

          if (when && timer.startTime && timer.trackingSnapshot) {

        static syncTrackedFromClock(timer, now) {

          // Кто бы ни считал (это устройство или другое после синхронизации),

          if (!timer.isTracking || !timer.startTime || !timer.trackingSnapshot) {

          const snap = timer.trackingSnapshot;

          timer.trackedSeconds = (snap.trackedSeconds || 0) + elapsed;
          timer.totalTrackedSeconds = (snap.totalTrackedSeconds || 0) + elapsed;
          timer.totalDuration = (snap.totalDuration || 0) + elapsed;
          timer.dailyTrackedSeconds = (snap.dailyTrackedSeconds || 0) + elapsed;
          timer.totalSeconds = (snap.totalSeconds || 0) + elapsed;
          const derivedDaily = (snap.dailyTotalSeconds || 0) + elapsed;
          timer.dailyTotalSeconds = derivedDaily;
          timer.lifetimeTotalSeconds = (snap.lifetimeTotalSeconds || 0) + elapsed;
          timer.originalDailyTotalSeconds = Math.max(
            snap.originalDailyTotalSeconds || 0,
            derivedDaily
          );

        }
        static updateTrackedTime(timer, delta) {

            const snap = timer.trackingSnapshot;

            snap.totalTrackedSeconds = (snap.totalTrackedSeconds || 0) + delta;
            snap.totalDuration = (snap.totalDuration || 0) + delta;
            snap.dailyTrackedSeconds = (snap.dailyTrackedSeconds || 0) + delta;
            snap.totalSeconds = (snap.totalSeconds || 0) + delta;
            snap.dailyTotalSeconds = (snap.dailyTotalSeconds || 0) + delta;
            snap.lifetimeTotalSeconds = (snap.lifetimeTotalSeconds || 0) + delta;

      class ProportionCalculator {
        static calculateRecommendedProportions(timers, totalTime) {
          const { spentToday, remainingTime } =
            this.calculateSpentAndRemainingTime(timers, totalTime);
          const realRemainingTime = TimeCalculator.getTotalTime();
          if (remainingTime === 0) {
            const recommendations = this.calculateInitialRecommendations(
              timers,
              realRemainingTime
            );
            const updatedRecommendations = this.distributeRemainingTime(
              recommendations,
              realRemainingTime
            );
            const normalizedRecommendations = this.normalizeRecommendations(
              updatedRecommendations,
              realRemainingTime
            );
            normalizedRecommendations.forEach(rec => {
              const originalTimer = AppState.findTimerById(rec.id);
              if (originalTimer) {
                originalTimer.recommendedProportion = rec.recommendedProportion;
              }
            });
            AppState.notify(
              "recommendationsCalculated",
              normalizedRecommendations
            );
            return normalizedRecommendations;
          }
          const recommendations = this.calculateInitialRecommendations(
            timers,
            remainingTime
          );
          const updatedRecommendations = this.distributeRemainingTime(
            recommendations,
            remainingTime
          );
          const normalizedRecommendations = this.normalizeRecommendations(
            updatedRecommendations,
            remainingTime
          );
          normalizedRecommendations.forEach(rec => {
            const originalTimer = AppState.findTimerById(rec.id);
            if (originalTimer) {
              originalTimer.recommendedProportion = rec.recommendedProportion;
            }

            "recommendationsCalculated",
            normalizedRecommendations

          return normalizedRecommendations;
        }
        static calculateSpentAndRemainingTime(timers, totalTime) {
          const spentToday = timers.reduce(
            (sum, timer) => sum + timer.trackedSeconds,
            0
          );
          const remainingTime = Math.max(totalTime - spentToday, 0);
          return { spentToday, remainingTime };
        }
        static handleZeroRemainingTime(timers) {
          const recommendations = timers.map(timer => ({
            ...timer,
            recommendedProportion: timer.targetProportion,
          }));
          recommendations.forEach(rec => {
            const originalTimer = AppState.findTimerById(rec.id);
            if (originalTimer) {
              originalTimer.recommendedProportion = rec.recommendedProportion;
            }
          });
          AppState.notify("recommendationsCalculated", recommendations);
          return recommendations;
        }
        static calculateInitialRecommendations(timers, remainingTime) {
          const sumTotal = timers.reduce(
            (sum, timer) =>
              sum +
              Math.max(
                timer.originalDailyTotalSeconds || 0,
                timer.dailyTotalSeconds
              ),
            0
          );
          const totalTargetTime = sumTotal + remainingTime;
          const totalWeight = timers.reduce((sum, t) => sum + t.proportion, 0);
          return timers.map(timer => {
            const baseTime = Math.max(
              timer.originalDailyTotalSeconds || 0,
              timer.dailyTotalSeconds
            );
            const targetTime = timer.targetProportion * totalTargetTime;
            const currentTargetTime =
              (timer.proportion / totalWeight) * remainingTime;
            const necessaryTime = Math.max(targetTime - baseTime, 0);
            const isOverperformed = timer.trackedSeconds > timer.plannedSeconds;
            return { ...timer, necessaryTime, isOverperformed };
          });
        }
        static distributeRemainingTime(recommendations, remainingTime) {
          const nonOverperformed = recommendations.filter(
            rec => !rec.isOverperformed
          );
          const sumNecessary = nonOverperformed.reduce(
            (sum, rec) => sum + rec.necessaryTime,
            0
          );
          const freeTime = remainingTime - sumNecessary;
          if (freeTime > 0) {
            const sumTargetProportions = nonOverperformed.reduce(
              (sum, t) => sum + t.targetProportion,
              0
            );
            return recommendations.map(rec => {
              if (rec.isOverperformed) {
                return { ...rec, necessaryTime: 0 };
              }
              return {
                ...rec,
                necessaryTime:
                  rec.necessaryTime +
                  (freeTime * rec.targetProportion) / sumTargetProportions,
              };
            });
          }
          return recommendations.map(rec => ({
            ...rec,
            necessaryTime: rec.isOverperformed ? 0 : rec.necessaryTime,

        static normalizeRecommendations(recommendations, remainingTime) {
          const nonOverperformed = recommendations.filter(
            rec => !rec.isOverperformed

          const sumNecessary = nonOverperformed.reduce(
            (sum, rec) => sum + rec.necessaryTime,
            0
          );
          const divisor =
            sumNecessary > remainingTime ? sumNecessary : remainingTime;
          return recommendations.map(rec => {
            if (rec.isOverperformed) {

      class TimeCalculator {
        static getTotalTime() {

            const midnight = TimeZoneHolder.endEpoch(0, 0, now.getTime());
            return Math.max(0, (midnight - now.getTime()) / 1000);
          }
          if (globalEndTime <= now) {
            const nextDay = new Date(globalEndTime);
            nextDay.setDate(nextDay.getDate() + 1);

          // без минут, из-за чего создавалась Invalid Date и дальше шёл NaN).
          const raw =
            typeof timeValue === "string"

          const m = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(raw || "");
          if (!m) return null;

        static createNewGlobalEndTime(hours, minutes) {

        static calculateTotalWeight(timers) {

      }

        static updateActiveTimers(delta) {

        static updateCalculations() {

          // локальные часы на устройстве со сбитым временем взводили сброс

          // 6. Управление

        // ----------------------------------------------------------
        //  Компактный режим (свёрнутые карточки по умолчанию).
        //  Состояние развёрнутости — ТОЛЬКО представление: оно живёт здесь,
        //  а не в объекте таймера, чтобы не менять «осмысленный снимок»
        //  облачной синхронизации (meaningfulHash) и не влиять на расчёты.
        // ----------------------------------------------------------
        static COMPACT_DOWN = "\u25BC"; // стрелка вниз: карточка свёрнута
        static COMPACT_UP = "\u25B2"; // стрелка вверх: карточка развёрнута
        static expandedTimers = new Set();
        static isExpanded(timerId) {
          return this.expandedTimers.has(String(timerId));
        }
        static createCompactToggle(timer) {
          const expanded = this.isExpanded(timer.id);
          return UIFactory.createButton(
            expanded ? this.COMPACT_UP : this.COMPACT_DOWN,
            "toggle-compact",
            {
              id: `compact-toggle-${timer.id}`,
              class: "compact-toggle",
              title: expanded
                ? "Свернуть карточку"
                : "Развернуть карточку",
              "aria-expanded": expanded ? "true" : "false",
            }
          );
        }
        static applyCompactState(timer) {
          const timerDiv = AppState.getTimerElement(timer.id);
          if (!timerDiv) return;
          const expanded = this.isExpanded(timer.id);
          timerDiv.classList.toggle("collapsed", !expanded);
          const toggle = timerDiv.querySelector(
            '[data-action="toggle-compact"]'
          );
          if (toggle) {
            toggle.textContent = expanded
              ? this.COMPACT_UP
              : this.COMPACT_DOWN;
            toggle.title = expanded
              ? "Свернуть карточку"
              : "Развернуть карточку";
            toggle.setAttribute("aria-expanded", expanded ? "true" : "false");
          }
        }
        static toggleCompact(timerId) {
          if (this.isExpanded(timerId)) {
            this.expandedTimers.delete(String(timerId));
          } else {
            this.expandedTimers.add(String(timerId));
          }
          const timer = AppState.findTimerById(timerId);
          if (timer) {
            this.applyCompactState(timer);
          }
          return this.isExpanded(timerId);
        }
        static forgetCompactState(timerId) {
          this.expandedTimers.delete(String(timerId));

      class TimeManager {
        static updateGlobalEndTime(now) {
          const globalEndTime = AppState.getGlobalEndTime();
          if (globalEndTime && now >= globalEndTime) {
            // Следующее вхождение «Конца» в зоне носителя (учитывает перевод
            // часов); если поле пустое — прежнее поведение «+1 сутки»
            const parsed = TimeCalculator.parseGlobalEndTime(null);
            let next;
            if (parsed) {
              next = new Date(
                TimeZoneHolder.endEpoch(parsed[0], parsed[1], now.getTime())
              );
            } else {
              next = new Date(globalEndTime);
              next.setDate(next.getDate() + 1);
            }
            AppState.setGlobalEndTime(next);
            AppState.setInitialAvailable((next - now) / 1000);
            this.updateGlobalEndTimeAndPlans(null, null, false);
            return true; // произошёл ролловер сессии
          }
          return false;
        }
        static updateGlobalEndTimeAndPlans(
          timeValue,
          timerId,
          shouldUpdateDisplay = false
        ) {
          const parsed = CalculationService.parseGlobalEndTime(timeValue);
          const now = new Date(CloudSync.serverNow());
          let newGlobalEndTime = null;
          let sessionEndTime;
          if (parsed) {
            const [hours, minutes] = parsed;
            const created = CalculationService.createNewGlobalEndTime(
              hours,
              minutes
            );
            newGlobalEndTime = created.newGlobalEndTime;
            sessionEndTime = newGlobalEndTime;
          } else {
            // Фикс БАГ #4: поле очищено/значение невалидно — считаем временем
            // конца полночь (как getTotalTime по умолчанию), а не оставляем
            // в состоянии Invalid Date, из-за которой везде появлялся NaN.
            sessionEndTime = TimeCalculator.getNextMidnight(now);
          }
          AppState.setGlobalEndTime(newGlobalEndTime);
          SessionManager.updateSessionEndTime(sessionEndTime);
          const remaining = CalculationService.calculateRemainingTime(
            sessionEndTime,
            now
          );
          AppState.setInitialAvailable(remaining);
          const timers = AppState.getTimers();
          const totalWeight = CalculationService.calculateTotalWeight(timers);
          CalculationService.updateTimerPlans(
            timers,
            remaining,
            timerId,
            totalWeight
          );
          if (shouldUpdateDisplay) {
            AppState.notify("displayNeedsUpdate");
          }
        }
        // ----------------------------------------------------------
        //  Авто-режим «Отошёл»
        //  Кнопки «Отошёл» в интерфейсе больше нет: away-режим включён
        //  ВСЕГДА, пока не идёт отсчёт ни одного таймера, и выключается на
        //  время отсчёта. Содержательно это ровно прежнее поведение кнопки:
        //  время простоя вычитается из планов всех задач пропорционально их
        //  весам (handleAwayMode), а фоновый пересчёт распределения от
        //  настенного времени на это время заморожен: иначе каждый тик
        //  возвращал бы планам полное значение и вычитание обнулялось.
        //  Пользовательские действия (клик/фокус поля) пересчёт ВЫПОЛНЯЮТ —
        //  см. AppController.autoUpdate.
        // ----------------------------------------------------------
        static isAnyTracking() {
          return AppState.getTimers().some(t => t.isTracking);
        }
        static syncAutoAway() {
          // Идемпотентная синхронизация away-режима с фактом отсчёта.
          // Вызывается из фонового тика и из точек, где трекинг
          // начинается/останавливается.
          if (this.isAnyTracking()) {
            this.deactivateAway();
          } else {
            this.armAway();
          }
        }
        static armAway() {
          // Взвод только по ПЕРЕХОДУ в простой: awayStartTime — точка отсчёта
          // для handleAwayMode, и её повторная установка во время простоя
          // обнулила бы уже накопленное время (а установка задним числом
          // списала бы время простоя дважды).
          if (AppState.isAwayModeActive() && AppState.getAwayStartTime()) {
            return false;
          }
          const timers = AppState.getTimers();
          const stopped = [];
          timers.forEach(t => {
            // Защита: away-режим и идущий отсчёт несовместимы. На практике
            // сюда не попадают — syncAutoAway взводит режим только при
            // отсутствии трекинга.
            if (t.isTracking) {
              TimerModel.stopTracking(t);
              stopped.push(t);
            }
          });
          stopped.forEach(t => {
            AppState.notify("timerStateChanged", t);
          });
          AppState.setAwayStartTime(new Date(CloudSync.serverNow()));
          AppState.setAwayModeActive(true);
          return true;
        }
        static deactivateAway() {
          // Пошёл отсчёт: простой закончился. Точку отсчёта сбрасываем, чтобы
          // следующая пауза начала накопление заново (время самого отсчёта
          // учитывает трекинг, а не away-вычитание).
          if (!AppState.isAwayModeActive() && !AppState.getAwayStartTime()) {
            return false;
          }
          AppState.setAwayModeActive(false);
          AppState.setAwayStartTime(null);
          return true;
        }
        static handleAwayMode(now, delta) {
          // Прямое включение возможно только когда отсчёт не идёт (иначе
          // планы уменьшались бы параллельно с растущим «Фактом»).
          if (
            AppState.isAwayModeActive() &&
            AppState.getAwayStartTime() &&
            !this.isAnyTracking()
          ) {
            const elapsed = (now - AppState.getAwayStartTime()) / 1000;
            const timers = AppState.getTimers();
            const totalProportion = timers.reduce(
              (sum, t) => sum + t.proportion,
              0
            );
            const updatedTimers = [];
            timers.forEach(t => {
              // Фикс БАГ #5: отсутствие уменьшает доступное время, но план
              // отдельного таймера не может стать отрицательным — зажимаем в 0.
              // При вырожденных весах (totalProportion = 0) не вычитаем ничего,
              // чтобы не получить NaN (Math.max(0, NaN) === NaN).
              if (totalProportion > 0) {
                t.plannedSeconds = Math.max(
                  0,
                  t.plannedSeconds - elapsed * (t.proportion / totalProportion)
                );
              }
              updatedTimers.push(t);
            });
            updatedTimers.forEach(t => {
              AppState.notify("timerUpdated", t);
            });
            AppState.setAwayStartTime(now);
          }
        }
        static handleAutoAwayMode(delta) {
          const timers = AppState.getTimers();
          let activeTimer = timers.find(t => t.isTracking);
          if (
            activeTimer &&
            activeTimer.trackedSeconds > activeTimer.plannedSeconds
          ) {
            AppState.setAutoAwayModeActive(true);
          } else {
            AppState.setAutoAwayModeActive(false);
          }
          // Код, уменьшающий время на других таймерах, отключен
          /*
          if (AppState.isAutoAwayModeActive() && activeTimer) {
            const updatedTimers = [];
            timers.forEach(t => {
              if (!t.isTracking) {
                t.plannedSeconds = Math.max(0, t.plannedSeconds - delta);
                updatedTimers.push(t);
              }
            });
            updatedTimers.forEach(t => {
              AppState.notify('timerUpdated', t);
            });
          }
          */
        }
      }
      // ============================================================
      //  ДЕРЕВО ЗАДАЧ: папки (визуальные группы), «Доля», перемещения.
      //
      //  Модель — AppState.tree, массив узлов верхнего уровня («корень»):
      //    узел таймера: { k: "t", id: <number> }
      //    узел папки:   { k: "f", id: <number>, name: <string>, children: [...] }
      //  Папка — НЕ таймер: у неё нет времени, плана и кнопки запуска, а её
      //  «Целевая пропорция» производная — сумма целей содержимого (ТЗ 2.5–2.6),
      //  поэтому отдельным полем она не хранится и не редактируется.
      //
      //  «Доля» и «Целевая пропорция» — одна величина в двух представлениях
      //  (ТЗ 3.1): доля узла = его цель / сумма целей сиблингов того же уровня.
      //  Правка ДОЛИ локальна: сумма родителя не меняется, остальное делится
      //  между сиблингами пропорционально прежним целям (ТЗ 3.6).
      //  Правка ЦЕЛИ глобальна: все остальные таймеры приложения изменяются
      //  в одно и то же число раз, чтобы сумма осталась равной 1 (ТЗ 3.7).
      //
      //  Порядок узлов живёт в самом дереве, сериализуется ключом "tree"
      //  (localStorage) и входит в «осмысленную проекцию» облака БЕЗ сортировки,
      //  поэтому порядок одинаков на всех устройствах (ТЗ 10.1) и уезжает
      //  в облако сразу при клике (ТЗ 10.2).
      // ============================================================
      class TreeModel {
        static KIND_TIMER = "t";
        static KIND_FOLDER = "f";
        static DEFAULT_FOLDER_NAME = "Группа";
        static EPS = 1e-12;

        // --- доступ к дереву -------------------------------------------
        static root() {
          return AppState.getTree();
        }
        static changed() {
          // Структура/Цели изменились — расписание конструктора следует за ними
          if (typeof ScheduleModel !== "undefined") ScheduleModel.reconcile();
          AppState.notify("treeChanged", AppState.getTree());
        }
        static isFolder(node) {
          return Boolean(node) && node.k === this.KIND_FOLDER;
        }
        static isTimerNode(node) {
          return Boolean(node) && node.k === this.KIND_TIMER;
        }
        static sameId(a, b) {
          return Number(a) === Number(b);
        }
        static createFolderNode(name) {
          return {
            k: this.KIND_FOLDER,
            id: Utils.uniqueId(),
            name: String(name === null || name === undefined ? "" : name),
            children: [],
          };
        }
        static createTimerNode(id) {
          return { k: this.KIND_TIMER, id: Number(id) };
        }
        /** clamp значения доли/цели: мусор и отрицательные -> 0, больше 1 -> 1 (ТЗ 3.2.3). */
        static clamp01(value) {
          const n = Number(value);
          if (!Number.isFinite(n) || n <= 0) return 0;
          return n >= 1 ? 1 : n;
        }

        // --- поиск и структура -----------------------------------------
        static findNode(id, nodes, parent) {
          const list = nodes === undefined ? this.root() : nodes;
          const par = parent === undefined ? null : parent;
          if (!Array.isArray(list)) return null;
          for (let i = 0; i < list.length; i++) {
            const node = list[i];
            if (!node || typeof node !== "object") continue;
            if (this.sameId(node.id, id)) {
              return { node, siblings: list, index: i, parent: par };
            }
            if (this.isFolder(node)) {
              const deep = this.findNode(id, node.children, node);
              if (deep) return deep;
            }
          }
          return null;
        }
        static parentOf(id) {
          const loc = this.findNode(id);
          return loc ? loc.parent : null;
        }
        static siblingsOf(id) {
          const loc = this.findNode(id);
          return loc ? loc.siblings : [];
        }
        static childrenOf(folderId) {
          const loc = this.findNode(folderId);
          if (!loc || !this.isFolder(loc.node)) return null;
          return loc.node.children;
        }
        static folderName(folderId) {
          const loc = this.findNode(folderId);
          return loc && this.isFolder(loc.node) ? loc.node.name || "" : "";
        }
        /** Все id таймеров внутри узла (для папки — на любой глубине). */
        static descendantTimerIds(node) {
          if (!node) return [];
          if (this.isTimerNode(node)) return [Number(node.id)];
          const out = [];
          (node.children || []).forEach(child => {
            out.push(...this.descendantTimerIds(child));
          });
          return out;
        }
        static allTimerIds() {
          return this.descendantTimerIds({ k: this.KIND_FOLDER, id: -1, children: this.root() });
        }
        static allFolderNodes(nodes, out) {
          const list = nodes === undefined ? this.root() : nodes;
          const acc = out === undefined ? [] : out;
          (list || []).forEach(node => {
            if (this.isFolder(node)) {
              acc.push(node);
              this.allFolderNodes(node.children, acc);
            }
          });
          return acc;
        }
        /** Плоский список для отрисовки/проверок: [{kind,id,depth,node,parent}]. */
        static flatten(nodes, depth, parent, out) {
          const list = nodes === undefined ? this.root() : nodes;
          const d = depth || 0;
          const par = parent === undefined ? null : parent;
          const acc = out === undefined ? [] : out;
          (list || []).forEach(node => {
            acc.push({
              kind: this.isFolder(node) ? "folder" : "timer",
              id: Number(node.id),
              depth: d,
              node,
              parent: par,
            });
            if (this.isFolder(node)) {
              this.flatten(node.children, d + 1, node, acc);
            }
          });
          return acc;
        }
        /**
         * Дерево и список таймеров могут разъехаться (старое сохранение без
         * ключа "tree", битые данные, импорт). Приводим в соответствие:
         * чужие id выкидываем, отсутствующие таймеры добавляем в конец корня.
         */
        static ensureTimerNodes() {
          const timers = AppState.getTimers();
          const known = new Set();
          const walk = nodes => {
            (nodes || []).forEach(node => {
              if (!node || typeof node !== "object") return;
              if (this.isFolder(node)) {
                known.add(`f:${node.id}`);
                walk(node.children);
              } else if (this.isTimerNode(node)) {
                known.add(`t:${node.id}`);
              }
            });
          };
          const root = this.root();
          // 1. узлы таймеров, которых нет в модели — удалить
          const prune = nodes => {
            for (let i = nodes.length - 1; i >= 0; i--) {
              const node = nodes[i];
              if (!node || typeof node !== "object") {
                nodes.splice(i, 1);
                continue;
              }
              if (this.isFolder(node)) {
                prune(node.children || (node.children = []));
                continue;
              }
              const timer = timers.find(t => this.sameId(t.id, node.id));
              if (!timer) nodes.splice(i, 1);
              else node.id = Number(node.id);
            }
          };
          prune(root);
          // 2. таймеры без узла — в конец корня (порядок модели сохраняется)
          timers.forEach(timer => {
            if (!known.has(`t:${timer.id}`) && !this.findNode(timer.id)) {
              root.push(this.createTimerNode(timer.id));
            }
          });
          return root;
        }
        /** Разбор сохранённого/принятого из облака дерева (защита от мусора). */
        static sanitizeTree(raw, depth) {
          const level = depth || 0;
          if (!Array.isArray(raw) || level > 32) return [];
          const out = [];
          const seen = new Set();
          raw.forEach(item => {
            if (!item || typeof item !== "object") return;
            const id = Number(item.id);
            if (!Number.isFinite(id) || seen.has(`${item.k}:${id}`)) return;
            seen.add(`${item.k}:${id}`);
            if (item.k === this.KIND_FOLDER) {
              out.push({
                k: this.KIND_FOLDER,
                id,
                name: typeof item.name === "string" ? item.name : "",
                children: this.sanitizeTree(item.children, level + 1),
              });
            } else if (item.k === this.KIND_TIMER) {
              out.push({ k: this.KIND_TIMER, id });
            }
          });
          return out;
        }

        // --- производные величины (цель/вес/доля) ----------------------
        static timerById(id) {
          return AppState.findTimerById(id);
        }
        static nodeTarget(node) {
          if (!node) return 0;
          if (this.isTimerNode(node)) {
            const timer = this.timerById(node.id);
            return timer ? Number(timer.targetProportion) || 0 : 0;
          }
          return (node.children || []).reduce(
            (sum, child) => sum + this.nodeTarget(child),
            0
          );
        }
        static nodeWeight(node) {
          if (!node) return 0;
          if (this.isTimerNode(node)) {
            const timer = this.timerById(node.id);
            return timer ? Number(timer.proportion) || 0 : 0;
          }
          return (node.children || []).reduce(
            (sum, child) => sum + this.nodeWeight(child),
            0
          );
        }
        static levelSumNodes(nodes) {
          return (nodes || []).reduce((s, n) => s + this.nodeTarget(n), 0);
        }
        static levelWeightNodes(nodes) {
          return (nodes || []).reduce((s, n) => s + this.nodeWeight(n), 0);
        }
        /** Сумма целевых пропорций уровня, на котором стоит узел id. */
        static levelSumOf(id) {
          const loc = this.findNode(id);
          return loc ? this.levelSumNodes(loc.siblings) : 0;
        }
        /** Производная цель папки (ТЗ 2.6). */
        static folderTarget(folderId) {
          const loc = this.findNode(folderId);
          return loc ? this.nodeTarget(loc.node) : 0;
        }
        /** Доля узла среди сиблингов (ТЗ 3.3); при нулевой сумме уровня — 0 (ТЗ 3.4.6). */
        static shareOf(id) {
          const loc = this.findNode(id);
          if (!loc) return 0;
          const sum = this.levelSumNodes(loc.siblings);
          if (!(sum > 0)) return 0;
          return this.nodeTarget(loc.node) / sum;
        }
        /**
         * Показывается ли доля (ТЗ 3.4.2/3.4.3): в корне — нет (там доля
         * численно равна цели), у единственного ребёнка — нет.
         */
        static isShareVisible(id) {
          const loc = this.findNode(id);
          if (!loc) return false;
          if (!loc.parent) return false;
          return loc.siblings.length > 1;
        }
        static isRootLevel(id) {
          const loc = this.findNode(id);
          return Boolean(loc) && !loc.parent;
        }

        // --- перераспределения -----------------------------------------
        /**
         * Равномерное изменение всего содержимого узла (ТЗ 3.9.2): папка
